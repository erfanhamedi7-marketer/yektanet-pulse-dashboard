}

// One page, three campaign groups: everything, the in-app campaigns and the
// Cafe Bazaar ones. Each gets the same cost/CPI chart; the tables each group
// asks for hang under its own chart.
function updateCpiSection(project){
  if(project.error) return;
  const {joined, matchedCost, totalCostInSheet} = computeSection(project);
  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalInstalls = joined.reduce((s,r)=>s+r.conversion,0);
  const cpaLabel = project.cpaLabel || 'CPA';

  renderCoverageNote(project, joined, matchedCost, totalCostInSheet, totalCost);

  const groups = (project.cpiGroups||[]).map(g=>{
    const inGroup = cpiGroupFilter(g);
    const rows = joined.filter(r=>inGroup(r.campaign));
    const cost = rows.reduce((s,r)=>s+r.cost,0);
    const installs = rows.reduce((s,r)=>s+r.conversion,0);
    return {group:g, rows, cost, installs, cpi: installs>0 ? cost/installs : null};
  });

  const prevWin = previousWindow(project);
  let prev = null;
  if(prevWin){
    const pj = computeSection(project, prevWin).joined;
    const pc = pj.reduce((t,r)=>t+r.cost,0), pi = pj.reduce((t,r)=>t+r.conversion,0);
    prev = {days: prevWin.days, cost: pc, installs: pi, cpi: pi>0 ? pc/pi : null, rows: pj};
  }
  const withDays = d => d ? {...d, days: prevWin.days} : null;
  const overall = groupByDateGeneric(joined);

  const cards = [
    {label:'هزینه کل', value: fmtMoney(totalCost), series: overall.cost,
     metric:{id:'cost', label:'هزینه', data:overall.cost, bar:true, axis:'spend'},
     delta: prev ? withDays(deltaOf(totalCost, prev.cost, 'none')) : null},
    {label:'نصب کل', value: fmtNum(totalInstalls), series: overall.conversion,
     metric:{id:'conv', label:'نصب', data:overall.conversion},
     delta: prev ? withDays(deltaOf(totalInstalls, prev.installs, 'up')) : null},
    {label:cpaLabel + ' کلی', value: totalInstalls>0 ? fmtMoney(totalCost/totalInstalls) : '—', accent:true,
     series: overall.cpaSeries,
     metric:{id:'cpa', label:cpaLabel, data:overall.cpaSeries},
     delta: prev ? withDays(deltaOf(totalInstalls>0 ? totalCost/totalInstalls : null, prev.cpi, 'down')) : null}
  ];
  groups.filter(g=>g.group.id !== 'all').forEach(g=>{
    const inGroup = cpiGroupFilter(g.group);
    const pg = prev ? prev.rows.filter(r=>inGroup(r.campaign)) : [];
    const pgCost = pg.reduce((t,r)=>t+r.cost,0), pgInst = pg.reduce((t,r)=>t+r.conversion,0);
    const gd = groupByDateGeneric(g.rows);
    cards.push({label:`${cpaLabel} ${g.group.title}`,
                value: g.cpi!==null ? fmtMoney(g.cpi) : '—',
                sub: `${fmtMoney(g.cost)} هزینه · ${fmtNum(g.installs)} نصب`,
                series: gd.cpaSeries,
                metric:{id:'cpa-' + g.group.id, label:`${cpaLabel} ${g.group.title}`,
                        data: seriesOn(overall.dates, gd, day => day.conversion>0 ? day.cost/day.conversion : null)},
                delta: prev ? withDays(deltaOf(g.cpi, pgInst>0 ? pgCost/pgInst : null, 'down')) : null});
  });
  // Further conversions the sheet reports (Signup), priced like elsewhere.
  (project.costPerMetrics||[]).forEach(m=>{
    const name = m.label || m.col;
    const now = costPerExtra(project, m, joined);
    const before = prev ? costPerExtra(project, m, prev.rows) : null;
    const series = seriesOn(overall.dates, overall, costPerExtraDaily(m));
    const {from} = sectionRange(project);
    const partial = now.since && from && from < now.since;
    cards.push({label:`هزینه به ازای ${name}`, value: now.per!==null ? fmtMoney(now.per) : '—',
                sub: `${fmtNum(now.total)} ${name}` + (partial ? ` · از ${fmtDateLabel(now.since)}` : ''),
                series,
                metric:{id:'per-' + m.col, label:`هزینه به ازای ${name}`, data:series},
                delta: prev && before.since && !(prevWin.from < before.since) ? withDays(deltaOf(now.per, before.per, 'down')) : null});
  });
  renderKpiCards(project, cards);

  renderDimensionTables(project);

  // The overall chart follows the cards; each campaign group keeps its own
  // cost / CPI chart.
  renderMetricChart(project, `${project.id}-all`, `cpiChart-${project.id}-all`, {
    labels: overall.labels,
    metrics: cards.filter(c=>c.metric).map(c=>c.metric),
    defaults: ['cost', 'cpa'],
    tooltipExtra: {id:'conv', label:'نصب', data:overall.conversion}
  });
  groups.forEach(g=>{
    if(g.group.id !== 'all') renderCostCpaChart(project, `${project.id}-${g.group.id}`,
                       `cpiChart-${project.id}-${g.group.id}`, g.rows, cpaLabel);
    if(g.group.campaignTable){
      renderCampaignCpaTable(project, g.rows, `cpiCampaigns-${project.id}-${g.group.id}`);
    }
    if(g.group.creativeTable){
      renderCreativeCpiTable(project, g.group, `cpiCreatives-${project.id}-${g.group.id}`, 'Creative');
    }
  });
}

function updateSection(project){
  // Every filter change lands here, so the filter lists catch up with it too.
  if(projectState[project.id]){ renderCampaignDropdown(project); renderSegChips(project); }
  if(project.kind === 'budget') return updateBudgetSection(project);
  if(project.kind === 'cpi') return updateCpiSection(project);
  if(project.error) return;
  const {joined, matchedCost, totalCostInSheet} = computeSection(project);
  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const totalInstalls = joined.reduce((s,r)=>s+r.installs,0);
  const cpa = totalConversion>0 ? totalCost/totalConversion : null;

  renderCoverageNote(project, joined, matchedCost, totalCostInSheet, totalCost);

  // The stretch right before this one, for the change chips.
  const prevWin = previousWindow(project);
  let prev = null;
  if(prevWin){
    const pj = computeSection(project, prevWin).joined;
    prev = {
      days: prevWin.days,
      cost: pj.reduce((t,r)=>t+r.cost,0),
      conversion: pj.reduce((t,r)=>t+r.conversion,0),
      installs: pj.reduce((t,r)=>t+r.installs,0),
      rows: pj
    };
    prev.cpa = prev.conversion > 0 ? prev.cost/prev.conversion : null;
  }
  const withDays = d => d ? {...d, days: prevWin.days} : null;
  const daily = groupByDateGeneric(joined);

  const convLabel = project.conversionLabel || 'کانورژن';
  const installsLabel = project.installsLabel || 'Installs';
  const cards = [
    {label:'هزینه کل', value: fmtMoney(totalCost), series: daily.cost,
     metric:{id:'cost', label:'هزینه', data:daily.cost, bar:true, axis:'spend'},
     delta: prev ? withDays(deltaOf(totalCost, prev.cost, 'none')) : null},
    {label: convLabel + ' کل', value: fmtNum(totalConversion), series: daily.conversion,
     metric:{id:'conv', label:convLabel, data:daily.conversion},
     delta: prev ? withDays(deltaOf(totalConversion, prev.conversion, 'up')) : null}
  ];
  if(project.showInstalls) cards.push({label:installsLabel + ' کل', value: fmtNum(totalInstalls), series: daily.installs,
     metric:{id:'installs', label:installsLabel, data:daily.installs},
     delta: prev ? withDays(deltaOf(totalInstalls, prev.installs, 'up')) : null});
  cards.push({label:'CPA کلی', value: cpa!==null?fmtMoney(cpa):'—', accent:true, series: daily.cpaSeries,
     metric:{id:'cpa', label:'CPA', data:daily.cpaSeries},
     delta: prev ? withDays(deltaOf(cpa, prev.cpa, 'down')) : null});
  // Counts the cost sheet itself carries (KYC on Talaeen's), with their cost per.
  const costExtraTotal = (rows, col) => rows.reduce((t,r)=>t + ((r.costExtras && r.costExtras[col]) || 0), 0);
  (project.costExtraCols||[]).forEach(m=>{
    const name = m.label || m.col;
    const total = costExtraTotal(joined, m.col);
    const prevTotal = prev ? costExtraTotal(prev.rows, m.col) : null;
    const series = daily.dates.map(d => daily.byDate[d].costExtras[m.col] || 0);
    const per = total > 0 ? totalCost / total : null;
    cards.push({label: name + ' کل', value: fmtNum(total), series,
      sub: `هزینه به ازای ${escapeHtml(name)}: ${per!==null ? fmtMoney(per) : '—'}`,
      metric:{id:'cx-' + m.col, label:name, data:series},
      delta: prev ? withDays(deltaOf(total, prevTotal, 'up')) : null});
  });
  const cc = project.compareConversion;
  if(cc){
    const rows = cmpConvRows(project);
    const total = rows.reduce((t,r)=>t+r.value, 0);
    const prevTotal = prevWin ? cmpConvRows(project, prevWin).reduce((t,r)=>t+r.value, 0) : null;
    const byDate = {};
    rows.forEach(r=>{ byDate[r.date] = (byDate[r.date] || 0) + r.value; });
    const series = daily.dates.map(d => byDate[d] || 0);
    const name = `${cc.col} (${cc.source})`;
    cards.push({label: name + ' کل', value: fmtNum(total), series,
      sub: `اختلاف با ${escapeHtml(cc.ownSource)}: <bdi dir="ltr">${fmtDiffPct(cmpDiffPct(totalConversion, total))}</bdi>`,
      metric:{id:'cmpconv', label:name, data:series},
      delta: prev ? withDays(deltaOf(total, prevTotal, 'up')) : null});
  }
  (project.costPerMetrics||[]).forEach(m=>{
    const name = m.label || m.col;
    const now = costPerExtra(project, m, joined);
    const before = prev ? costPerExtra(project, m, prev.rows) : null;
    const series = seriesOn(daily.dates, daily, costPerExtraDaily(m));
    cards.push({label:`هزینه به ازای ${name}`, value: now.per!==null ? fmtMoney(now.per) : '—',
                sub: `${fmtNum(now.total)} ${name}`, series,
                metric:{id:'per-' + m.col, label:`هزینه به ازای ${name}`, data:series},
                delta: prev ? withDays(deltaOf(now.per, before.per, 'down')) : null});
  });

  renderKpiCards(project, cards);

  renderMetricChart(project, project.id, `trendChart-${project.id}`, {
    labels: daily.labels,
    metrics: cards.filter(c=>c.metric).map(c=>c.metric),
    defaults: ['cost', 'cpa'],
    tooltipExtra: {id:'conv', label:convLabel, data:daily.conversion}
  });

  renderCampaignCpaTable(project, joined);
  renderDimensionTables(project);
  renderSessionsChart(project);
  renderSessionGaps(project);
  renderCostDrivers(project, joined);
  renderCpaDrivers(project, joined);
  if(!project.hideSegmentAnalysis) renderSegmentIssues(project, joined);
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---------- Init ----------
// Sections can share tabs (several parts of one project read the same sheets),
// so each tab is fetched once per load and reused.
const sheetCache = {};
function fetchSheetCached(spreadsheetId, sheet){
  const key = spreadsheetId + '||' + sheet;
  if(!sheetCache[key]) sheetCache[key] = fetchSheetData(spreadsheetId, sheet);
  return sheetCache[key];
}

async function loadProject(project){
  try{
    if(project.kind === 'budget'){
      const [blendRows, budgetRows] = await Promise.all([
        fetchSheetCached(project.spreadsheetId, project.blendSheet),
        fetchSheetCached(project.spreadsheetId, project.budgetSheet)
      ]);
      const today = todayStr();
      // Same rule as the other sections: the day in progress isn't reported.
      project.rawBlend = normalizeBlendRows(blendRows).filter(r=>!(/^\d{8}$/.test(r.date) && r.date >= today));
      project.rawBudget = normalizeBudgetRows(budgetRows);
      project.budgetByCampaign = {};
      project.rawBudget.forEach(r=>{ project.budgetByCampaign[r.campaign] = r; });
      project.diag = {};
      project.error = null;
      const dates = project.rawBlend.map(r=>r.date).sort();
      project.minDate = dates[0] || null;
      project.maxDate = dates[dates.length-1] || null;
      // Campaigns that spend without a budget row can't be capped, so say so.
      project.noBudgetCampaigns = Array.from(new Set(
        project.rawBlend.filter(r=>!project.budgetByCampaign[r.campaign] && r.cost > 0).map(r=>r.campaignLabel || r.campaign)));
      return;
    }
    const cmp = project.sessionsCompare;
    // refSheet may name several sheets; their rows are concatenated and then
    // aggregated on Date + Campaign, which sums a campaign's conversions across
    // the sheets for each day.
    // An entry is either a sheet name (using the project's conversionCol) or
    // {sheet, conversionCol} — sheets that count the same conversion under
    // different column names still add up.
    const refSheets = (Array.isArray(project.refSheet) ? project.refSheet : [project.refSheet])
      .map(entry => typeof entry === 'string' ? {sheet: entry, conversionCol: project.conversionCol} : entry);
    let [refSheetRows, costRows, compareOrNull] = await Promise.all([
      Promise.all(refSheets.map(r => fetchSheetCached(project.spreadsheetId, r.sheet))),
      fetchSheetCached(project.spreadsheetId, project.costSheet),
      cmp ? fetchSheetCached(project.spreadsheetId, cmp.sheet) : null
    ]);
    const compareRows = compareOrNull || [];
    // A second source's count of the same conversion (GA4 beside Yektanet).
    const cc = project.compareConversion;
    project.rawCmpConv = cc
      ? normalizeCmpConvRows(await fetchSheetCached(project.spreadsheetId, cc.sheet), cc.col) : [];
    // A section that covers only some rows of a shared tab narrows both sides
    // here; the cached sheet itself stays whole for the other sections.
    if(project.rowFilter){
      refSheetRows.forEach((rows, i)=>{ refSheetRows[i] = rows.filter(project.rowFilter); });
      costRows = costRows.filter(project.rowFilter);
    }
    // Dimension tabs are independent of the join, so they are fetched on their
    // own and kept beside it.
    const dimTables = project.dimensionTables || [];
    const dimRows = await Promise.all(dimTables.map(d => fetchSheetCached(project.spreadsheetId, d.sheet)));
    project.rawDims = dimTables.map((d, i) => normalizeDimensionRows(dimRows[i], d.dimCol, d.metricCol));
    const diag = {skippedRows:0, skippedCost:0, unreadableCost:0, excludedCost:0, futureRows:0};
    const refBySheet = refSheetRows.map((rows, i) =>
      normalizeRefRows(rows, refSheets[i].conversionCol || project.conversionCol,
                       project.installsCol, project.adgroupCol, project.creativeCol,
                       (project.costPerMetrics||[]).map(m=>m.col)));
    // What each conversion sheet reported, before any filter — so a campaign
    // rule can say "every campaign sheet X tracks" rather than only match names.
    const campaignCtx = {refCampaigns: {}};
    refSheets.forEach((r, i)=>{ campaignCtx.refCampaigns[r.sheet] = new Set(refBySheet[i].map(x=>x.campaign)); });
    // An entry's own `keep` narrows that sheet's rows only (one sheet counts
    // every campaign, another only some).
    project.rawRef = refBySheet.flatMap((rows, i) =>
      refSheets[i].keep ? rows.filter(r=>refSheets[i].keep(r.campaign)) : rows);
    project.rawCost = normalizeCostRows(costRows, project.impressionsCol, project.clicksCol, diag,
                                        (project.costExtraCols||[]).map(m=>m.col));
    // The session comparison works off daily totals of each tab as-is, so it
    // keeps the rows the project's campaign filter removes from everything else.
    project.rawCompare = cmp ? normalizeCompareRows(compareRows, cmp.sessionsCol) : [];
    // With refCampaignsFromCost the conversion sheet may cover several trackers
    // or networks; a row counts only if its campaign appears in the cost sheet,
    // which is what makes Campaign the join key on its own.
    if(project.refCampaignsFromCost){
      const costCampaigns = new Set(project.rawCost.map(r=>r.campaign));
      const kept = project.rawRef.filter(r=>costCampaigns.has(r.campaign));
      diag.refNoCostCampaign = project.rawRef.length - kept.length;
      project.rawRef = kept;
    }
    project.allRef = project.rawRef;
    if(project.excludeCampaign){
      project.rawRef = project.rawRef.filter(r=>!project.excludeCampaign(r.campaign, campaignCtx));
      const keptCost = project.rawCost.filter(r=>!project.excludeCampaign(r.campaign, campaignCtx));
      diag.excludedCost = project.rawCost.reduce((s,r)=>s+r.cost,0) - keptCost.reduce((s,r)=>s+r.cost,0);
      project.rawCost = keptCost;
    }
    // Today and anything after it is dropped. Sheets carry pre-created rows for
    // days that haven't happened yet, which would push maxDate forward and make
    // "last 7 days" land on empty days; and today's own row is only as complete
    // as the hour it was last filled, so a half-day of cost against a half-day
    // of conversions makes every average lie. The dashboard therefore ends at
    // yesterday, which is the last day that is actually finished.
    // Only well-formed YYYYMMDD dates are compared, so other date shapes stay.
    const today = todayStr();
    const isUnfinished = d => /^\d{8}$/.test(d) && d >= today;
    const dropFuture = (rows, count) => {
      const kept = rows.filter(r=>!isUnfinished(r.date));
      if(count) diag.futureRows += rows.length - kept.length;
      return kept;
    };
    diag.futureRows = 0;
    project.rawDims = (project.rawDims || []).map(rows => dropFuture(rows, false));
    project.rawRef = dropFuture(project.rawRef, true);
    project.rawCost = dropFuture(project.rawCost, true);
    project.rawCompare = dropFuture(project.rawCompare, true);
    if(project.excludeCampaign) project.rawCmpConv = project.rawCmpConv.filter(r=>!project.excludeCampaign(r.campaign, campaignCtx));
    project.rawCmpConv = dropFuture(project.rawCmpConv, false);
    // allRef holds the same conversion rows before the campaign filter, so its
    // dropped rows are the ones already counted above.
    project.allRef = dropFuture(project.allRef, false);

    project.diag = diag;
    project.error = null;
    const allDates = [...project.rawRef.map(r=>r.date), ...project.rawCost.map(r=>r.date), ...project.rawCompare.map(r=>r.date)].sort();
    project.minDate = allDates[0] || null;
    project.maxDate = allDates[allDates.length-1] || null;
  }catch(e){
    project.rawRef = [];
    project.allRef = [];
    project.rawCost = [];
    project.rawCompare = [];
    project.rawDims = [];
    project.rawBlend = [];
    project.rawBudget = [];
    project.budgetByCampaign = {};
    project.error = 'نتونستم دیتای این پروژه رو بخونم: ' + (e.message || 'خطای نامشخص') + ' — مطمئن شو شیت با ایمیل Service Account شیر شده.';
  }
}

// A tab is either one project, or the group of parts sharing a `group` key —
// several sections of the same project, each with its own sheets and filters,
// behind one tab with a second row of buttons.
function buildTabs(){
  const tabs = [];
  const byId = {};
  PROJECTS.forEach(p=>{
    const tabId = p.group || p.id;
    if(!byId[tabId]){
      byId[tabId] = {id:tabId, title: p.groupTitle || p.tabTitle || p.title, logo:p.logo,
                     logoWide:p.logoWide, theme:p.theme, parts:[]};
      tabs.push(byId[tabId]);
    }
    byId[tabId].parts.push(p);
  });
  return tabs;
}
let TABS = [];
const activePart = {};   // { [tabId]: projectId }
let activeTabId = null;

// A tab wears its project's brand: on the dark switcher the brand colour is
// the dot beside the label, and the ink is used where a tab sits on white.
function tabThemeStyle(t){
  const th = t.theme;
  return `--tab-accent:${th.accent}; --tab-ink:${th.ink || th.accent}; --tab-soft:${th.accentSoft};`;
}

function renderTabBar(){
  TABS = buildTabs();
  const el = document.getElementById('tabBar');
  el.innerHTML = TABS.map(t=>`
    <button type="button" class="tab-btn" id="tab-${t.id}" style="${tabThemeStyle(t)}">
      ${t.logo?`<img src="${t.logo}" class="${t.logoWide?'wide':''}" alt="">`:''}${escapeHtml(t.title)}
    </button>`).join('');
  TABS.forEach(t=>{
    document.getElementById(`tab-${t.id}`).addEventListener('click', ()=>switchTab(t.id));
  });
}

function renderSubTabBar(tab){
  const el = document.getElementById('subTabBar');
  if(tab.parts.length < 2){ el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = tab.parts.map(p=>`
    <button type="button" class="sub-tab-btn${p.id===activePart[tab.id]?' active':''}"
            id="subtab-${p.id}" style="${tabThemeStyle(p)}">${escapeHtml(p.partTitle || p.title)}</button>`).join('');
  tab.parts.forEach(p=>{
    document.getElementById(`subtab-${p.id}`).addEventListener('click', ()=>{
      activePart[tab.id] = p.id;
      switchTab(tab.id);
    });
  });
}

// The filter bar sticks below the pinned header, whose height changes when the
// tabs wrap onto a second row or a sub-tab row appears.
function syncStickyOffset(){
  const bar = document.getElementById('tabBar');
  const sub = document.getElementById('subTabBar');
  if(!bar) return;
  const barH = bar.offsetHeight;
  const subH = (sub && !sub.hidden) ? sub.offsetHeight : 0;
  document.documentElement.style.setProperty('--tabbar-h', barH + 'px');
  document.documentElement.style.setProperty('--sticky-top', (barH + subH) + 'px');
}

// The page picks up a trace of whichever project is open — enough that
// switching tabs feels like moving somewhere, not enough to tint the data.
function paintPageAccent(tab){
  const th = (tab && tab.theme) || {};
  document.documentElement.style.setProperty('--page-accent', th.accent || '#2563EB');
  document.documentElement.style.setProperty('--page-accent-ink', th.ink || th.accent || '#1D4ED8');
}

// ---- "?" hints ------------------------------------------------------------
// The descriptions under headings are hidden (CSS) and read from a "?" beside
// the heading instead. A heading's description is its sibling .sub /
// .section-sub / .card-sub, or — for a sub-heading inside a card — the
// .deep-subtext.intro its renderer writes into the block right after it. A
// section title also carries the section's coverage strip (how much of the
// sheet's cost was matched), shown under its description.
const HINT_TITLES = '.topbar h1, .section-title, .card-head h2, .deep-subhead';
function hintSources(title){
  if(title.matches('.deep-subhead')){
    const next = title.nextElementSibling;
    if(!next) return [];
    return [next.matches('.deep-subtext.intro') ? next : next.querySelector(':scope > .deep-subtext.intro')];
  }
  const holder = title.parentElement;
  const found = [holder && holder.querySelector(':scope > .sub, :scope > .section-sub, :scope > .card-sub')];
  if(title.matches('.section-title')){
    const section = title.closest('.section');
    found.push(section && section.querySelector(':scope > .coverage-note'));
  }
  return found;
}
// The parts that have something in them, as the popup will show them.
function hintHtml(title){
  return hintSources(title)
    .filter(el => el && el.textContent.trim())
    .map(el => el.innerHTML)
    .join('<hr class="hint-sep">');
}
// Renderers rewrite blocks on every filter change, so the icons are kept in
// step afterwards: a heading gains a "?" when it has a description and loses
// it when the description is gone or empty (a range with no data, say).
function syncHints(){
  document.querySelectorAll(HINT_TITLES).forEach(title=>{
    const has = hintSources(title).some(el => el && el.textContent.trim());
    const icon = title.querySelector(':scope > .hint');
    if(has && !icon){
      title.insertAdjacentHTML('beforeend', '<span class="hint" role="button" tabindex="0" aria-label="توضیحات">?</span>');
    }else if(!has && icon){
      icon.remove();
    }
  });
  if(hintOpen && !document.body.contains(hintOpen)) hideHint();
}

const hintPop = document.createElement('div');
hintPop.id = 'hintPop';
hintPop.setAttribute('role', 'tooltip');
document.body.appendChild(hintPop);
let hintOpen = null;

// The popup is read from the description at the moment it opens, so it always
// shows what the current filters produced. It sits under the "?" (above it if
// there is no room below) and is kept 12px inside the screen on both sides.
function showHint(icon){
  const html = hintHtml(icon.parentElement);
  if(!html) return;
  if(hintOpen && hintOpen !== icon) hintOpen.classList.remove('open');
  hintOpen = icon;
  icon.classList.add('open');
  hintPop.innerHTML = html;
  hintPop.classList.add('show');
  const r = icon.getBoundingClientRect();
  const pw = hintPop.offsetWidth, ph = hintPop.offsetHeight;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const left = Math.max(12, Math.min(r.left + r.width / 2 - pw / 2, vw - pw - 12));
  let top = r.bottom + 8;
  if(top + ph > vh - 8 && r.top - ph - 8 >= 8) top = r.top - ph - 8;
  hintPop.style.left = left + 'px';
  hintPop.style.top = top + 'px';
}
function hideHint(){
  if(hintOpen) hintOpen.classList.remove('open');
  hintOpen = null;
  hintPop.classList.remove('show');
}
const hintAt = el => el && el.closest ? el.closest('.hint') : null;
// Mouse: open on hover, close on leaving unless the "?" was clicked (focused).
// Touch: a tap focuses the "?" and opens it; a tap anywhere else closes it.
document.addEventListener('mouseover', e=>{ const h = hintAt(e.target); if(h) showHint(h); });
document.addEventListener('mouseout', e=>{
  const h = hintAt(e.target);
  if(h && !h.contains(e.relatedTarget) && document.activeElement !== h) hideHint();
});
document.addEventListener('focusin', e=>{ const h = hintAt(e.target); if(h) showHint(h); });
document.addEventListener('focusout', e=>{ if(hintAt(e.target)) hideHint(); });
document.addEventListener('click', e=>{ const h = hintAt(e.target); if(h) showHint(h); else hideHint(); });
document.addEventListener('keydown', e=>{
  const h = hintAt(e.target);
  if(e.key === 'Escape') hideHint();
  else if(h && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); showHint(h); }
});
// iOS Safari only passes a tap up to the document from something that looks
// clickable, so a tap elsewhere is caught at touchstart as well.
document.addEventListener('touchstart', e=>{ if(!hintAt(e.target)) hideHint(); }, {passive:true});
// The popup is pinned to the screen, not the page, so it goes when the page moves.
window.addEventListener('scroll', hideHint, {passive:true});
window.addEventListener('resize', hideHint);

let hintSyncQueued = false;
new MutationObserver(()=>{
  if(hintSyncQueued) return;
  hintSyncQueued = true;
  requestAnimationFrame(()=>{ hintSyncQueued = false; syncHints(); });
}).observe(document.querySelector('.wrap'), {childList:true, subtree:true});
syncHints();

// On a phone the tab rows are single lines that scroll sideways, so the chosen
// tab is brought to the middle of its row rather than left off-screen. The
// delta is physical pixels, which keeps it right in RTL too.
function revealInRow(bar, id){
  const el = document.getElementById(id);
  if(!bar || !el || bar.scrollWidth <= bar.clientWidth + 1) return;
  const b = bar.getBoundingClientRect(), r = el.getBoundingClientRect();
  bar.scrollBy({left: (r.left + r.width / 2) - (b.left + b.width / 2), behavior: 'smooth'});
}

function switchTab(tabId){
  const tab = TABS.find(t=>t.id===tabId);
  if(!tab) return;
  activeTabId = tabId;
  paintPageAccent(tab);
  if(!activePart[tabId] || !tab.parts.some(p=>p.id===activePart[tabId])) activePart[tabId] = tab.parts[0].id;
  const shownId = activePart[tabId];

  PROJECTS.forEach(p=>{
    const sectionEl = document.getElementById(`section-${p.id}`);
    if(sectionEl) sectionEl.style.display = (p.id===shownId) ? '' : 'none';
  });
  TABS.forEach(t=>{
    const tabEl = document.getElementById(`tab-${t.id}`);
    if(tabEl) tabEl.classList.toggle('active', t.id===tabId);
  });
  renderSubTabBar(tab);

  const shownProject = PROJECTS.find(p=>p.id===shownId);
  const mainContentEl = document.getElementById('mainContent');
  mainContentEl.style.display = (shownProject && !shownProject.ownDateFilter) ? '' : 'none';
  revealInRow(document.getElementById('tabBar'), `tab-${tabId}`);
  revealInRow(document.getElementById('subTabBar'), `subtab-${shownId}`);
  syncStickyOffset();
  // The section just became measurable, so its figures can be sized for real.
  fitKpiValues();
}

async function init(){
  setStatus('loading','در حال خوندن شیت‌های همه‌ی پروژه‌ها...');
  await Promise.all(PROJECTS.map(loadProject));

  const globalProjects = PROJECTS.filter(p=>!p.ownDateFilter && !p.error);
  const allDates = [];
  globalProjects.forEach(p=>{
    p.rawRef.forEach(r=>allDates.push(r.date));
    p.rawCost.forEach(r=>allDates.push(r.date));
  });
  allDates.sort();
  if(allDates.length){
    sheetMinDate = allDates[0];
    sheetMaxDate = allDates[allDates.length-1];
    currentFrom = sheetMinDate;
    currentTo = sheetMaxDate;
    renderFilterBar();
  } else {
    document.getElementById('mainContent').innerHTML = '';
  }

  renderSectionsShell();
  PROJECTS.filter(p=>!p.error).forEach(p=>{
    try{ updateSection(p); }
    catch(e){
      console.error('section failed:', p.id, e);
      const el = document.getElementById(`coverageNote-${p.id}`);
      if(el) el.innerHTML = 'نمایش این بخش با خطا مواجه شد: ' + escapeHtml(e.message || 'خطای نامشخص');
    }
  });
  renderTabBar();
  switchTab(TABS[0].id);
  syncStickyOffset();
  window.addEventListener('resize', syncStickyOffset);
  // Cards get narrower as the window does, so the figures are re-fitted with it.
  let fitTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(fitTimer);
    fitTimer = setTimeout(()=>fitKpiValues(), 120);
  });
  if(window.ResizeObserver){
    const ro = new ResizeObserver(syncStickyOffset);
    ro.observe(document.getElementById('tabBar'));
    ro.observe(document.getElementById('subTabBar'));
  }

  const anyError = PROJECTS.some(p=>p.error);
  setStatus(anyError?'err':'live', anyError ? 'بعضی پروژه‌ها خطا دادن — جزئیات توی همون سکشن' : 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

init();
})();

</script>
