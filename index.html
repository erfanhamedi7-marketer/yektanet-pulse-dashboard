<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوست دارم</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;800&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#fff1f3; --bg2:#ffe4ea; --ink:#2a1016; --accent:#e11d48; --muted:#9f5866; }
  @media (prefers-color-scheme: dark) {
    :root { --bg1:#1a0b10; --bg2:#2a0f18; --ink:#fde8ec; --accent:#fb7185; --muted:#d79aa6; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: Vazirmatn, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1) 70%);
    color: var(--ink);
    display: grid; place-items: center; padding: 16px; overflow: hidden;
  }
  main { text-align: center; position: relative; z-index: 1; }
  .heart {
    font-size: clamp(72px, 18vw, 140px); color: var(--accent); line-height: 1;
    display: inline-block; animation: beat 1.4s ease-in-out infinite;
  }
  h1 {
    font-weight: 800; font-size: clamp(48px, 13vw, 120px); margin-top: 12px;
    letter-spacing: -1px; animation: rise .9s ease-out both;
  }
  p { color: var(--muted); font-weight: 300; font-size: clamp(16px, 4vw, 22px); margin-top: 8px; animation: rise .9s .3s ease-out both; }
  .float { position: fixed; bottom: -40px; color: var(--accent); opacity: .35; animation: up linear infinite; pointer-events: none; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.15)} 30%{transform:scale(1)} 45%{transform:scale(1.1)} }
  @keyframes rise { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  @keyframes up { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .heart, .float, h1, p { animation: none; } .float { display:none; } }
</style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">♥</div>
    <h1>دوست دارم</h1>
    <p>همین. ساده و از ته دل.</p>
  </main>
<script>
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('span');
    h.className = 'float'; h.textContent = '♥';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 14 + Math.random() * 26 + 'px';
    h.style.animationDuration = 7 + Math.random() * 8 + 's';
    h.style.animationDelay = -Math.random() * 12 + 's';
    document.body.appendChild(h);
  }
</script>
</body>
</html>
