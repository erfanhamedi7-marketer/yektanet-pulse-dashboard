<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Pulse — Cost - Yektanet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#EEF1F5; --surface:#FFFFFF; --border:#D8DEE7; --border-soft:#E6EAF0;
    --ink:#1B2430; --muted:#6B7686; --faint:#9AA3B2;
    --accent:#5B4FE0; --accent-soft:#EDEBFC;
    --positive:#1E9E8B; --positive-soft:#E6F5F3;
    --negative:#E8604C; --negative-soft:#FCEBE8;
    --amber:#F2A93B; --amber-soft:#FCF1DE;
    --radius:10px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 64px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .topbar h1{font-size:20px;font-weight:800;margin:0;}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .status-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .dot.live{background:var(--positive);box-shadow:0 0 0 3px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 3px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
  .kpi{background:var(--surface);padding:16px 16px;}
  .kpi .label{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:500;}
  .kpi .value{font-family:var(--font-mono);font-size:19px;font-weight:600;letter-spacing:-0.02em;}
  .kpi .value.accent{color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h2{font-size:14.5px;font-weight:700;margin:0 0 3px;}
  .card .card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .chart-box{position:relative;height:290px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;padding:0 10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;}
  thead th:hover{color:var(--ink);}
  thead th .arrow{opacity:.4;font-size:10px;margin-inline-start:3px;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tbody td.num{font-family:var(--font-mono);}
  tbody tr:hover{background:#FAFBFC;}
  .loading-state, .error-state{text-align:center;padding:60px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);font-size:13.5px;}
  .error-state{color:var(--negative);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Cost - Yektanet</h1>
      <div class="sub">داده‌ی زنده از تب Cost - Yektanet</div>
    </div>
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">در حال بارگذاری...</span></div>
  </div>

  <div id="mainContent">
    <div class="loading-state">در حال خوندن شیت...</div>
  </div>
</div>

<script>
(function(){
"use strict";

const SHEET_ID = '1r9f3Vdl6ldgQeL50tHX4TxjVP0H_UxYeYFKhGFp0yeQ';
const GID = '1883387170'; // Cost - Yektanet

function csvUrl(gid){ return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }

function setStatus(kind, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (kind==='live'?' live':kind==='err'?' err':' loading');
  t.textContent = text;
}

function toNumber(v){
  if(v===null||v===undefined) return 0;
  const cleaned = String(v).replace(/[^0-9.\-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function fmtDateLabel(yyyymmdd){
  const s = String(yyyymmdd||'').trim();
  if(s.length !== 8) return s;
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fmtNum(n, digits){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{maximumFractionDigits: digits===undefined?0:digits, minimumFractionDigits: digits===undefined?0:digits});
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return fmtNum(n,0) + ' تومان';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function fetchRows(){
  const res = await fetch(csvUrl(GID));
  if(!res.ok) throw new Error('sheet not accessible');
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data.map(r=>({
    date: String(r['Date']||'').trim(),
    campaign: String(r['Campaign']||'').trim(),
    impressions: toNumber(r['Impressions']),
    clicks: toNumber(r['Clicks']),
    cost: toNumber(r['Cost']),
    kyc: toNumber(r['KYC'])
  })).filter(r=>r.date && r.campaign);
}

function groupByDate(rows){
  const map = {};
  rows.forEach(r=>{
    if(!map[r.date]) map[r.date] = {cost:0, kyc:0};
    map[r.date].cost += r.cost;
    map[r.date].kyc += r.kyc;
  });
  const keys = Object.keys(map).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>map[k].cost),
    kyc: keys.map(k=>map[k].kyc)
  };
}

function groupByCampaign(rows){
  const map = {};
  rows.forEach(r=>{
    if(!map[r.campaign]) map[r.campaign] = {campaign:r.campaign, cost:0, impressions:0, clicks:0, kyc:0};
    const m = map[r.campaign];
    m.cost += r.cost; m.impressions += r.impressions; m.clicks += r.clicks; m.kyc += r.kyc;
  });
  return Object.values(map).map(r=>({
    ...r,
    ctr: r.impressions ? (r.clicks/r.impressions*100) : 0,
    cpa: r.kyc>0 ? (r.cost/r.kyc) : null
  }));
}

function renderError(msg){
  document.getElementById('mainContent').innerHTML = `<div class="error-state">${msg}</div>`;
  setStatus('err','خطا در دریافت داده');
}

function renderDashboard(rows){
  const totalCost = rows.reduce((s,r)=>s+r.cost,0);
  const totalImpr = rows.reduce((s,r)=>s+r.impressions,0);
  const totalClicks = rows.reduce((s,r)=>s+r.clicks,0);
  const totalKyc = rows.reduce((s,r)=>s+r.kyc,0);
  const ctr = totalImpr ? (totalClicks/totalImpr*100) : null;
  const cpa = totalKyc>0 ? (totalCost/totalKyc) : null;

  document.getElementById('mainContent').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">هزینه کل</div><div class="value">${fmtMoney(totalCost)}</div></div>
      <div class="kpi"><div class="label">نمایش</div><div class="value">${fmtNum(totalImpr)}</div></div>
      <div class="kpi"><div class="label">کلیک</div><div class="value">${fmtNum(totalClicks)}</div></div>
      <div class="kpi"><div class="label">CTR</div><div class="value">${ctr!==null?ctr.toFixed(2)+'%':'—'}</div></div>
      <div class="kpi"><div class="label">KYC / CPA</div><div class="value accent">${fmtNum(totalKyc)} — ${cpa!==null?fmtMoney(cpa):'—'}</div></div>
    </div>

    <div class="card">
      <h2>هزینه و KYC بر حسب روز</h2>
      <div class="card-sub">مجموع روزانه‌ی همه‌ی کمپین‌ها</div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="card">
      <h2>خلاصه به تفکیک کمپین</h2>
      <div class="card-sub">روی هدر ستون کلیک کن تا مرتب بشه</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th data-key="campaign">کمپین</th>
              <th data-key="cost">هزینه</th>
              <th data-key="impressions">نمایش</th>
              <th data-key="clicks">کلیک</th>
              <th data-key="ctr">CTR</th>
              <th data-key="kyc">KYC</th>
              <th data-key="cpa">CPA</th>
            </tr>
          </thead>
          <tbody id="campaignTableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  const {labels, cost, kyc} = groupByDate(rows);
  new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar', label:'هزینه (تومان)', data:cost, backgroundColor:'rgba(91,79,224,0.55)', borderRadius:4, yAxisID:'y', order:2, maxBarThickness:26},
        {type:'line', label:'KYC', data:kyc, borderColor:'#1E9E8B', backgroundColor:'#1E9E8B', tension:.3, yAxisID:'y1', pointRadius:3, borderWidth:2, order:1}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{legend:{position:'top', align:'end', labels:{boxWidth:8, boxHeight:8, usePointStyle:true, font:{size:11}}}},
      scales:{
        y:{position:'left', grid:{color:'#EEF1F5'}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        y1:{position:'right', grid:{display:false}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12}}
      }
    }
  });

  let sortKey='cost', sortDir='desc';
  const byCampaign = groupByCampaign(rows);
  function renderTable(){
    const list = [...byCampaign].sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(av===null) av=-Infinity; if(bv===null) bv=-Infinity;
      if(typeof av==='string') return sortDir==='asc'? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir==='asc' ? av-bv : bv-av;
    });
    document.getElementById('campaignTableBody').innerHTML = list.map(r=>`
      <tr>
        <td>${escapeHtml(r.campaign)}</td>
        <td class="num">${fmtMoney(r.cost)}</td>
        <td class="num">${fmtNum(r.impressions)}</td>
        <td class="num">${fmtNum(r.clicks)}</td>
        <td class="num">${r.ctr.toFixed(2)}%</td>
        <td class="num">${fmtNum(r.kyc)}</td>
        <td class="num">${r.cpa!==null?fmtMoney(r.cpa):'—'}</td>
      </tr>`).join('');
    document.querySelectorAll('thead th[data-key]').forEach(th=>{
      const arrow = th.querySelector('.arrow'); if(arrow) arrow.remove();
      if(th.dataset.key===sortKey) th.insertAdjacentHTML('beforeend', `<span class="arrow">${sortDir==='asc'?'▲':'▼'}</span>`);
    });
  }
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if(sortKey===k){ sortDir = sortDir==='asc'?'desc':'asc'; } else { sortKey=k; sortDir='desc'; }
      renderTable();
    });
  });
  renderTable();

  setStatus('live', 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

async function init(){
  setStatus('loading','در حال خوندن شیت...');
  let rows;
  try{
    rows = await fetchRows();
  }catch(e){
    renderError('نتونستم شیت رو بخونم. مطمئن شو دسترسی «هرکسی با لینک — بازبین» فعاله.');
    return;
  }
  if(!rows.length){
    renderError('ردیفی با Date و Campaign معتبر توی شیت پیدا نشد.');
    return;
  }
  renderDashboard(rows);
}

init();
})();
</script>
</body>
</html>
