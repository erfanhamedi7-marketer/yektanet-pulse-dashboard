<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yektanet Pulse — Cost × KYC Blend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0C12;
    --bg-elev:#0F121A;
    --surface:#12151E;
    --surface-2:#171B26;
    --border:#232838;
    --border-soft:#1B2030;
    --text:#E8EAF0;
    --text-muted:#8A93A8;
    --text-faint:#565F74;
    --accent:#8B7CF6;
    --accent-2:#4EA1FF;
    --accent-soft:rgba(139,124,246,0.12);
    --positive:#34D399;
    --positive-soft:rgba(52,211,153,0.12);
    --negative:#FB7185;
    --negative-soft:rgba(251,113,133,0.12);
    --amber:#FBBF24;
    --amber-soft:rgba(251,191,36,0.12);
    --radius:16px;
    --radius-sm:10px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(139,124,246,0.10), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(78,161,255,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:36px 24px 72px;}

  /* Topbar */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px -4px rgba(139,124,246,.55);
  }
  .brand-mark svg{width:18px;height:18px;color:#fff;}
  .topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--text-muted);
    box-shadow:var(--shadow-card);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .dot.live{background:var(--positive);box-shadow:0 0 0 4px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 4px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Coverage meter */
  .coverage-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow-card);
  }
  .coverage-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .coverage-top .title{font-size:13px;font-weight:700;color:var(--text);}
  .coverage-top .pct{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent-2);}
  .meter-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border-soft);}
  .meter-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease;}
  .coverage-legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .coverage-legend b{color:var(--text);font-family:var(--font-mono);font-weight:600;}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
  .kpi{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 20px;overflow:hidden;box-shadow:var(--shadow-card);
  }
  .kpi::before{
    content:'';position:absolute;top:0;right:0;left:0;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.85;
  }
  .kpi .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .kpi .icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-2);flex-shrink:0;}
  .kpi .icon svg{width:15px;height:15px;}
  .kpi .value{font-family:var(--font-mono);font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--text);}
  .kpi .value.accent{color:var(--accent-2);}
  .kpi .ctx{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* Cards */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .card h2{font-size:15px;font-weight:700;margin:0 0 3px;color:var(--text);}
  .card .card-sub{font-size:12px;color:var(--text-muted);}
  .legend-dots{display:flex;gap:16px;font-size:12px;color:var(--text-muted);}
  .legend-dots span{display:flex;align-items:center;gap:6px;}
  .legend-dots i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .chart-box{position:relative;height:320px;}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:var(--text-muted);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.03em;
    padding:0 12px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  thead th .arrow{opacity:.5;font-size:9px;margin-inline-start:4px;}
  tbody td{padding:12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text);}
  tbody td.num{font-family:var(--font-mono);font-size:12.5px;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  }
  .badge.good{background:var(--positive-soft);color:var(--positive);}
  .badge.bad{background:var(--negative-soft);color:var(--negative);}
  .badge.neutral{background:var(--surface-2);color:var(--text-muted);}

  .loading-state, .error-state{
    text-align:center;padding:80px 20px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text-muted);font-size:13.5px;box-shadow:var(--shadow-card);
  }
  .error-state{color:var(--negative);}
  .spinner{
    width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .filter-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow-card);
  }
  .filter-group{display:flex;align-items:center;gap:8px;}
  .filter-group label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .filter-bar input[type="date"]{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-family:var(--font-mono);font-size:12.5px;color:var(--text);
    color-scheme:dark;
  }
  .filter-bar input[type="date"]:focus{outline:none;border-color:var(--accent);}
  .filter-presets{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;}
  .preset-btn{
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;font-size:12px;color:var(--text-muted);font-family:var(--font-ui);cursor:pointer;
    transition:all .15s;
  }
  .preset-btn:hover{border-color:var(--accent);color:var(--text);}
  .preset-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600;}
  .filter-range-label{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

  .section{margin-bottom:32px;}
  .section:not(:last-child){padding-bottom:28px;border-bottom:1px solid var(--border-soft);}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
  .section-title{font-size:17px;font-weight:800;margin:0 0 3px;color:var(--text);}
  .section-sub{font-size:12px;color:var(--text-muted);}
  .campaign-select{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);
    min-width:180px; color-scheme:dark;
  }
  .campaign-select:focus{outline:none;border-color:var(--accent);}
  .coverage-note{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .coverage-note b{color:var(--text-muted);font-family:var(--font-mono);}
  .error-inline{
    grid-column:1/-1;background:var(--negative-soft);color:var(--negative);border-radius:8px;
    padding:12px 16px;font-size:13px;
  }

  .section-head-left{display:flex;align-items:center;gap:12px;}
  .section-logo{
    width:42px;height:42px;border-radius:13px;object-fit:cover;
    background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0;
  }
  .section-controls{display:flex;align-items:center;gap:10px;}
  .ms-dropdown{position:relative;}
  .ms-toggle{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);
    min-width:170px;text-align:right;cursor:pointer;
  }
  .ms-toggle:hover{border-color:var(--accent);}
  .ms-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:260px;max-width:340px;
    max-height:320px;overflow-y:auto;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:8px;box-shadow:0 12px 32px -12px rgba(0,0,0,.6);
  }
  .ms-option{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:12.5px;
    cursor:pointer;color:var(--text);
  }
  .ms-option:hover{background:rgba(255,255,255,0.04);}
  .ms-option input{accent-color:var(--accent);flex-shrink:0;}
  .ms-option-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-option-cost{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .ms-option-all{font-weight:600;}
  .ms-divider{height:1px;background:var(--border);margin:6px 2px;}

  .section-filter-bar{margin-bottom:14px;}

  .tab-bar{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tab-btn{
    display:flex;align-items:center;gap:8px;background:none;border:none;
    padding:10px 4px;margin-inline-end:18px;font-family:var(--font-ui);font-size:14px;font-weight:600;
    color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s, border-color .15s;
  }
  .tab-btn img{width:20px;height:20px;border-radius:6px;object-fit:cover;background:#fff;flex-shrink:0;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--tab-accent, var(--text));border-bottom-color:var(--tab-accent, var(--text));}

  .insight-text{font-size:13.5px;line-height:1.9;color:var(--text);margin:0 0 16px;}
  .insight-chips{display:flex;flex-wrap:wrap;gap:10px;}
  .insight-chip{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;min-width:150px;flex:1 1 150px;
  }
  .insight-chip .ic-label{font-size:11px;color:var(--text-muted);margin-bottom:5px;}
  .insight-chip .ic-value{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .insight-chip.good{border-color:rgba(52,211,153,.35);}
  .insight-chip.good .ic-value{color:var(--positive);}
  .insight-chip.bad{border-color:rgba(251,113,133,.35);}
  .insight-chip.bad .ic-value{color:var(--negative);}

  .deep-subhead{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--text);}
  .deep-subhead:first-of-type{margin-top:0;}
  .deep-subtext{font-size:11.5px;color:var(--text-faint);margin:-4px 0 10px;}
  .deep-list{list-style:none;margin:0;padding:0;}
  .deep-item{padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;line-height:1.8;color:var(--text);}
  .deep-item:last-child{border-bottom:none;}
  .deep-item b{font-weight:700;}
  .di-date{font-family:var(--font-mono);color:var(--text-muted);font-size:11.5px;margin-inline-start:6px;}
  .di-tag{
    display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;
    font-size:11px;font-weight:700;font-family:var(--font-mono);margin-inline-end:8px;
  }
  .di-tag.good{background:var(--positive-soft);color:var(--positive);}
  .di-tag.bad{background:var(--negative-soft);color:var(--negative);}
  .deep-empty{font-size:12.5px;color:var(--text-faint);padding:8px 0;}
  .seg-rate{font-family:var(--font-mono);}
  .seg-rate.low{color:var(--negative);}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr;}
  }
</style>
</head>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>
      </div>
      <div>
        <h1>Marketing Pulse</h1>
        <div class="sub">داشبورد چندپروژه‌ای — هر سکشن، جوین Adtrace با شیت هزینه بر اساس Date + Campaign</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">در حال بارگذاری...</span></div>
    </div>
  </div>

  <div id="tabBar" class="tab-bar"></div>

  <div id="mainContent">
    <div class="loading-state"><div class="spinner"></div>در حال خوندن شیت‌های همه‌ی پروژه‌ها...</div>
  </div>
  <div id="resultsContent"></div>
</div>

<script>
(function(){
"use strict";

async function fetchSheetData(spreadsheetId, sheet){
  const res = await fetch(`/api/sheet-data?spreadsheetId=${encodeURIComponent(spreadsheetId)}&sheet=${encodeURIComponent(sheet)}`);
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'sheet not accessible');
  return json.data;
}

function setStatus(kind, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (kind==='live'?' live':kind==='err'?' err':' loading');
  t.textContent = text;
}

function toNumber(v){
  if(v===null||v===undefined) return 0;
  const cleaned = String(v).replace(/[^0-9.\-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function normCampaign(c){ return String(c||'').trim().toLowerCase(); }
function normDate(d){ return String(d||'').trim(); }
function fmtDateLabel(yyyymmdd){
  const s = String(yyyymmdd);
  if(s.length !== 8) return s;
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fmtNum(n, digits){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{maximumFractionDigits: digits===undefined?0:digits, minimumFractionDigits: digits===undefined?0:digits});
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return fmtNum(n,0) + ' تومان';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toInputDate(yyyymmdd){
  const s = String(yyyymmdd);
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fromInputDate(isoDate){
  return isoDate.replace(/-/g,'');
}
function addDaysToDateStr(yyyymmdd, days){
  const d = new Date(toInputDate(yyyymmdd));
  d.setDate(d.getDate() + days);
  return fromInputDate(d.toISOString().slice(0,10));
}

// ---------- Project configuration ----------
// Add a new object here for each new project/section. spreadsheetId must also
// be added to ALLOWED_SPREADSHEETS in api/sheet-data.js and the sheet must be
// shared with the service account email.
const PROJECTS = [
  {
    id: 'blue',
    title: 'پروژه بلو',
    subtitle: 'Adtrace (مرجع) × Yektanet',
    logo: '/blu-logo.png',
    spreadsheetId: '1DdhvkT6gVXKoDiicgXnXHTq32yZg3aGpJx97RT4wYeU',
    refSheet: 'Adtrace',
    costSheet: 'Yektanet',
    conversionCol: 'Card Order',
    conversionLabel: 'Card Order',
    showInstalls: false,
    installsCol: 'Installs',
    ownDateFilter: true,
    defaultRangeDays: 30,
    theme: { accent: '#3B82F6', accent2: '#EF4444', accentSoft: 'rgba(59,130,246,0.12)' }
  },
  {
    id: 'wepod',
    title: 'پروژه ویپاد',
    subtitle: 'Wepod - Metrix (مرجع) × Wepod - Yektanet',
    spreadsheetId: '18ohsYVwngt7UJ5BwvBBWdhpQ2IOxO4b08-D4OMm2VEQ',
    refSheet: 'Wepod - Metrix',
    costSheet: 'Wepod - Yektanet',
    conversionCol: 'v2_national',
    conversionLabel: 'v2_national',
    showInstalls: false,
    installsCol: 'Total Installs',
    adgroupCol: 'Ad Group',
    creativeCol: 'Creative',
    impressionsCol: 'Impression',
    clicksCol: 'Click',
    ownDateFilter: true,
    defaultRangeDays: 30,
    theme: { accent: '#10B981', accent2: '#F97316', accentSoft: 'rgba(16,185,129,0.12)' }
  },
  {
    id: 'yektanet',
    title: 'Yektanet',
    subtitle: 'Adtrace (مرجع) × Cost - Yektanet',
    spreadsheetId: '1r9f3Vdl6ldgQeL50tHX4TxjVP0H_UxYeYFKhGFp0yeQ',
    refSheet: 'Adtrace',
    costSheet: 'Cost - Yektanet',
    conversionCol: 'KYC',
    conversionLabel: 'KYC',
    showInstalls: true,
    installsCol: 'Installs',
    ownDateFilter: false,
    theme: { accent: '#8B7CF6', accent2: '#FBBF24', accentSoft: 'rgba(139,124,246,0.12)' }
  }
];

const projectState = {}; // { [id]: { campaigns: 'ALL' | Set(keys), from, to } }
const chartInstances = {};

function normalizeRefRows(rows, conversionCol, installsCol, adgroupCol, creativeCol){
  adgroupCol = adgroupCol || 'Adgroup';
  creativeCol = creativeCol || 'Creative';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaignRaw = r['Campaign'];
    const campaign = normCampaign(campaignRaw);
    if(!date || !campaign) return null;
    return {
      date, campaign, campaignLabel:(campaignRaw||'').trim(),
      adgroup: (r[adgroupCol]||'').trim() || '(بدون Adgroup)',
      creative: (r[creativeCol]||'').trim() || '(بدون Creative)',
      installs: installsCol ? toNumber(r[installsCol]) : 0,
      conversion: toNumber(r[conversionCol])
    };
  }).filter(Boolean);
}
function normalizeCostRows(rows, impressionsCol, clicksCol){
  impressionsCol = impressionsCol || 'Impressions';
  clicksCol = clicksCol || 'Clicks';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    if(!date || !campaign) return null;
    return {date, campaign, cost: toNumber(r['Cost']), impressions: toNumber(r[impressionsCol]), clicks: toNumber(r[clicksCol])};
  }).filter(Boolean);
}
function aggregateRef(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {date:r.date, campaign:r.campaign, campaignLabel:r.campaignLabel, installs:0, conversion:0};
    map[key].installs += r.installs;
    map[key].conversion += r.conversion;
  });
  return map;
}
function aggregateCost(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {cost:0, impressions:0, clicks:0};
    map[key].cost += r.cost;
    map[key].impressions += r.impressions;
    map[key].clicks += r.clicks;
  });
  return map;
}
function buildJoinedRows(refMap, costMap){
  const joined = [];
  let matchedCost = 0;
  Object.keys(refMap).forEach(key=>{
    const base = refMap[key];
    const costRow = costMap[key];
    const cost = costRow ? costRow.cost : 0;
    if(costRow) matchedCost += costRow.cost;
    joined.push({
      date: base.date, campaign: base.campaign, campaignLabel: base.campaignLabel,
      installs: base.installs, conversion: base.conversion,
      cost, cpa: base.conversion>0 ? (cost/base.conversion) : null
    });
  });
  const totalCostInSheet = Object.values(costMap).reduce((s,r)=>s+r.cost,0);
  return {joined, matchedCost, totalCostInSheet, unmatchedCost: totalCostInSheet - matchedCost};
}
function groupByDateGeneric(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {cost:0, conversion:0};
    map[r.date].cost += r.cost; map[r.date].conversion += r.conversion;
  });
  const keys = Object.keys(map).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>map[k].cost),
    cpaSeries: keys.map(k=> map[k].conversion>0 ? (map[k].cost/map[k].conversion) : null)
  };
}

// Campaign options sorted by total cost (desc); label falls back to the raw key.
function getCampaignOptionsSortedByCost(project){
  const costByCampaign = {};
  project.rawCost.forEach(r=>{ costByCampaign[r.campaign] = (costByCampaign[r.campaign]||0) + r.cost; });
  const labelByCampaign = {};
  project.rawRef.forEach(r=>{ if(!labelByCampaign[r.campaign]) labelByCampaign[r.campaign] = r.campaignLabel; });
  const allKeys = new Set([...Object.keys(costByCampaign), ...Object.keys(labelByCampaign)]);
  return Array.from(allKeys).map(k=>({
    key: k, label: labelByCampaign[k] || k, cost: costByCampaign[k] || 0
  })).sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}

// ---------- Global date range (applies to projects without their own filter) ----------
let sheetMinDate = null;
let sheetMaxDate = null;
let currentFrom = null;
let currentTo = null;

function computeSection(project){
  const st = projectState[project.id];
  const from = project.ownDateFilter ? st.from : currentFrom;
  const to = project.ownDateFilter ? st.to : currentTo;
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const refFiltered = project.rawRef.filter(r=>inRange(r.date) && inCampaign(r.campaign));
  const costFiltered = project.rawCost.filter(r=>inRange(r.date) && inCampaign(r.campaign));
  const refMap = aggregateRef(refFiltered);
  const costMap = aggregateCost(costFiltered);
  return buildJoinedRows(refMap, costMap);
}

function pivotByDateCampaign(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {};
    if(!map[r.date][r.campaign]) map[r.date][r.campaign] = {cost:0, conversion:0, label:r.campaignLabel};
    map[r.date][r.campaign].cost += r.cost;
    map[r.date][r.campaign].conversion += r.conversion;
  });
  return map;
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stdev(arr, m){
  if(arr.length < 2) return 0;
  const v = arr.reduce((a,b)=>a+Math.pow(b-m,2),0)/arr.length;
  return Math.sqrt(v);
}

// For each day, is the day-over-day cost change large enough (relative to this
// section's own normal day-to-day noise) to be worth explaining? If so, find
// which single campaign's own cost delta best explains the total delta.
// Only compares the most recent available day against the one before it (not
// the whole range), and lists every campaign that contributed to the change
// in spend, ranked by the size of its own contribution.
function computeLatestCostBreakdown(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = pivot[d], yesterday = pivot[prevD];
  const totalToday = Object.values(today).reduce((s,c)=>s+c.cost,0);
  const totalYesterday = Object.values(yesterday).reduce((s,c)=>s+c.cost,0);
  const totalDelta = totalToday - totalYesterday;
  const pctChange = totalYesterday>0 ? (totalDelta/totalYesterday*100) : null;

  const allKeys = new Set([...Object.keys(today), ...Object.keys(yesterday)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = today[k] ? today[k].cost : 0;
    const c0 = yesterday[k] ? yesterday[k].cost : 0;
    const delta = c1-c0;
    if(Math.abs(delta) < 1) return; // ignore true zero / rounding noise
    contributions.push({
      campaign: (today[k]||yesterday[k]).label,
      delta, todayCost:c1, yesterdayCost:c0,
      share: totalDelta!==0 ? (delta/totalDelta*100) : 0
    });
  });
  contributions.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {date:d, prevDate:prevD, totalToday, totalYesterday, totalDelta, pctChange, contributions};
}

// Same idea for CPA, but attribution uses a leave-one-out counterfactual: "if
// only this campaign's cost/conversion had stayed at yesterday's level, what
// would today's overall CPA have been?" The campaign whose reversal moves CPA
// the most is the one driving the change.
// Only compares the most recent available day's CPA against the day before —
// not the whole range. Only reports a cause if that change is clearly bigger
// than this section's normal day-to-day CPA noise; otherwise says so plainly.
// Attribution uses leave-one-out: "if only this campaign's cost/conversion
// had stayed at yesterday's level, what would today's CPA have been?" — the
// gap between that counterfactual and today's real CPA is the campaign's
// contribution, and only the main contributor(s) (~80% of the shift) are shown.
function computeLatestCpaChange(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const dayAgg = d => {
    const cost = Object.values(pivot[d]).reduce((s,c)=>s+c.cost,0);
    const conv = Object.values(pivot[d]).reduce((s,c)=>s+c.conversion,0);
    return {cost, conv, cpa: conv>0 ? cost/conv : null};
  };
  const totals = dates.map(d=>({date:d, ...dayAgg(d)}));

  const cpaChanges = [];
  for(let i=1;i<totals.length;i++){
    if(totals[i-1].cpa!==null && totals[i].cpa!==null) cpaChanges.push((totals[i].cpa-totals[i-1].cpa)/totals[i-1].cpa*100);
  }
  const m = mean(cpaChanges), sd = stdev(cpaChanges, m);

  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = totals[totals.length-1], yesterday = totals[totals.length-2];
  if(today.cpa===null || yesterday.cpa===null) return {date:d, prevDate:prevD, significant:false, pctChange:null};

  const pctChange = (today.cpa-yesterday.cpa)/yesterday.cpa*100;
  const zLike = sd>0 ? Math.abs(pctChange-m)/sd : (Math.abs(pctChange)>=25 ? 2 : 0);
  const significant = zLike >= 1.5 && Math.abs(pctChange) >= 10;

  const base = {date:d, prevDate:prevD, pctChange, todayCpa:today.cpa, yesterdayCpa:yesterday.cpa, significant};
  if(!significant) return base;

  const todayC = pivot[d], yesterdayC = pivot[prevD];
  const allKeys = new Set([...Object.keys(todayC), ...Object.keys(yesterdayC)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = todayC[k] ? todayC[k].cost : 0;
    const v1 = todayC[k] ? todayC[k].conversion : 0;
    const c0 = yesterdayC[k] ? yesterdayC[k].cost : 0;
    const v0 = yesterdayC[k] ? yesterdayC[k].conversion : 0;
    const cfCost = today.cost - c1 + c0;
    const cfConv = today.conv - v1 + v0;
    if(cfConv<=0) return;
    const contribution = today.cpa - (cfCost/cfConv);
    if(Math.abs(contribution) < 1) return;
    contributions.push({campaign:(todayC[k]||yesterdayC[k]).label, contribution});
  });
  contributions.sort((a,b)=>Math.abs(b.contribution)-Math.abs(a.contribution));

  const totalAbs = contributions.reduce((s,c)=>s+Math.abs(c.contribution),0);
  const target = totalAbs*0.8;
  const main = [];
  let cum = 0;
  for(const c of contributions){ main.push(c); cum += Math.abs(c.contribution); if(cum>=target || main.length>=3) break; }

  base.contributors = main;
  return base;
}

// Two-proportion z-test on Installs->conversion rate: is this segment's rate
// significantly lower than the rest of the same campaign? Requires n>=30 on
// both sides to be considered meaningful (one-tailed, ~95% confidence).
const SEG_MIN_N = 30;
const SEG_Z_THRESHOLD = 1.645;
function runSegmentTest(rows, keyFn){
  const totalInstalls = rows.reduce((s,r)=>s+r.installs,0);
  const totalConv = rows.reduce((s,r)=>s+r.conversion,0);
  const byKey = {};
  rows.forEach(r=>{
    const k = keyFn(r);
    if(!byKey[k]) byKey[k] = {installs:0, conversion:0};
    byKey[k].installs += r.installs;
    byKey[k].conversion += r.conversion;
  });
  const flags = [];
  Object.entries(byKey).forEach(([k,seg])=>{
    if(seg.installs < SEG_MIN_N) return;
    const restInstalls = totalInstalls - seg.installs;
    const restConv = totalConv - seg.conversion;
    if(restInstalls < SEG_MIN_N) return;
    const p1 = seg.conversion/seg.installs;
    const p2 = restConv/restInstalls;
    const pooled = (seg.conversion+restConv)/(seg.installs+restInstalls);
    if(pooled<=0 || pooled>=1) return;
    const se = Math.sqrt(pooled*(1-pooled)*(1/seg.installs+1/restInstalls));
    if(se===0) return;
    const z = (p1-p2)/se;
    if(z <= -SEG_Z_THRESHOLD) flags.push({key:k, segRate:p1, restRate:p2, installs:seg.installs, z});
  });
  return flags.sort((a,b)=>a.z-b.z);
}

// For each campaign: pick the smallest recent window (7/14/30/60 days, else
// all available data) that has enough installs to test — so recent days get
// priority, and we only reach further back when there isn't enough recent
// data. Only campaigns whose CPA in that window is meaningfully above the
// project's overall benchmark CPA get the Adgroup/Creative breakdown, since
// those are the ones actually worth optimizing.
const CAMPAIGN_MIN_N = 100;
const WINDOWS_DAYS = [7,14,30,60,null];
function analyzeCampaignSegments(project){
  const st = projectState[project.id];
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const filteredRef = project.rawRef.filter(r=>inCampaign(r.campaign));
  const filteredCost = project.rawCost.filter(r=>inCampaign(r.campaign));
  if(!project.maxDate) return [];

  // Benchmark CPA always comes from ALL campaigns (ignores the campaign
  // filter) — it's the reference point a single filtered campaign gets
  // compared against. If it used the filtered set too, filtering down to one
  // campaign would make the benchmark equal to that campaign's own CPA and
  // nothing would ever look "high" by comparison.
  // It still prefers the last 7 days, only reaching further back if there
  // isn't enough conversion volume yet to trust the average.
  const BENCHMARK_MIN_CONV = 30;
  let benchmarkCpa = null, benchmarkWindow = null;
  for(const w of WINDOWS_DAYS){
    const fromDate = w ? addDaysToDateStr(project.maxDate, -(w-1)) : project.minDate;
    const refRows = project.rawRef.filter(r=>r.date>=fromDate && r.date<=project.maxDate);
    const conv = refRows.reduce((s,r)=>s+r.conversion,0);
    if(conv >= BENCHMARK_MIN_CONV || w===null){
      const costRows = project.rawCost.filter(r=>r.date>=fromDate && r.date<=project.maxDate);
      const cost = costRows.reduce((s,r)=>s+r.cost,0);
      benchmarkCpa = conv>0 ? cost/conv : null;
      benchmarkWindow = w;
      break;
    }
  }
  if(benchmarkCpa===null) return [];

  const campaignKeys = Array.from(new Set(filteredRef.map(r=>r.campaign)));
  const results = [];

  campaignKeys.forEach(campKey=>{
    const label = (filteredRef.find(r=>r.campaign===campKey)||{}).campaignLabel || campKey;

    // Skip campaigns with no spend in the last 7 days — not currently active,
    // so no point optimizing them right now even if their older CPA was high.
    const last7From = addDaysToDateStr(project.maxDate, -6);
    const recentCost = filteredCost
      .filter(r=>r.campaign===campKey && r.date>=last7From && r.date<=project.maxDate)
      .reduce((s,r)=>s+r.cost,0);
    if(recentCost <= 0) return;

    let chosen = null;
    for(const w of WINDOWS_DAYS){
      const fromDate = w ? addDaysToDateStr(project.maxDate, -(w-1)) : project.minDate;
      const refRows = filteredRef.filter(r=>r.campaign===campKey && r.date>=fromDate && r.date<=project.maxDate);
      const installs = refRows.reduce((s,r)=>s+r.installs,0);
      if(installs >= CAMPAIGN_MIN_N || w===null){
        const costRows = filteredCost.filter(r=>r.campaign===campKey && r.date>=fromDate && r.date<=project.maxDate);
        const conversion = refRows.reduce((s,r)=>s+r.conversion,0);
        const cost = costRows.reduce((s,r)=>s+r.cost,0);
        chosen = {window:w, fromDate, refRows, installs, conversion, cost, cpa: conversion>0 ? cost/conversion : null};
        break;
      }
    }
    if(!chosen || chosen.cpa===null) return;
    if(chosen.cpa <= benchmarkCpa*1.1) return; // not meaningfully worse than the overall benchmark

    const adgroupFlags = runSegmentTest(chosen.refRows, r=>r.adgroup);
    const creativeFlags = runSegmentTest(chosen.refRows, r=>r.creative);
    if(adgroupFlags.length || creativeFlags.length){
      results.push({campaign:label, cpa:chosen.cpa, benchmarkCpa, benchmarkWindow, window:chosen.window, installs:chosen.installs, adgroupFlags, creativeFlags});
    }
  });

  return results.sort((a,b)=>b.cpa-a.cpa);
}

function renderCostDrivers(project, joined){
  const b = computeLatestCostBreakdown(joined);
  const el = document.getElementById(`costDrivers-${project.id}`);
  if(!b){ el.innerHTML = `<div class="deep-empty">برای مقایسه‌ی آخرین روز با روز قبلش، حداقل ۲ روز داده لازمه.</div>`; return; }
  const headline = `
    <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
      <span class="di-tag ${b.totalDelta>=0?'good':'bad'}">${b.totalDelta>=0?'▲':'▼'} ${b.pctChange!==null?Math.abs(b.pctChange).toFixed(0)+'٪':'—'}</span>
      <span class="di-date">${fmtDateLabel(b.prevDate)} ← ${fmtDateLabel(b.date)}</span><br>
      هزینه از <b>${fmtMoney(b.totalYesterday)}</b> به <b>${fmtMoney(b.totalToday)}</b> ${b.totalDelta>=0?'رسیده (افزایش':'رسیده (کاهش'} ${fmtMoney(Math.abs(b.totalDelta))})
    </div>`;
  if(!b.contributions.length){
    el.innerHTML = headline + `<div class="deep-empty">هیچ کمپینی تغییر هزینه‌ی قابل‌ثبتی نداشته.</div>`;
    return;
  }
  // Only surface the main driver(s): keep adding the next-largest contributor
  // until they cumulatively explain ~80% of the total change, capped at 3 —
  // this is "the main factor(s)", not an exhaustive list of every campaign.
  const targetAbs = Math.abs(b.totalDelta) * 0.8;
  const mainContributors = [];
  let cum = 0;
  for(const c of b.contributions){
    mainContributors.push(c);
    cum += Math.abs(c.delta);
    if(cum >= targetAbs || mainContributors.length >= 3) break;
  }
  const rows = mainContributors.map(c=>`
    <li class="deep-item">
      <span class="di-tag ${c.delta>=0?'good':'bad'}">${c.delta>=0?'+':''}${fmtMoney(c.delta)}</span>
      <b>${escapeHtml(c.campaign)}</b>
      <span class="di-date">${fmtMoney(c.yesterdayCost)} ← ${fmtMoney(c.todayCost)}</span>
      ${b.totalDelta!==0?` — ${Math.abs(c.share).toFixed(0)}٪ از کل تغییر`:''}
    </li>`).join('');
  el.innerHTML = headline + `<ul class="deep-list">${rows}</ul>`;
}
function renderCpaDrivers(project, joined){
  const r = computeLatestCpaChange(joined);
  const el = document.getElementById(`cpaDrivers-${project.id}`);
  if(!r){ el.innerHTML = `<div class="deep-empty">برای مقایسه‌ی CPA آخرین روز با روز قبلش، حداقل ۲ روز داده لازمه.</div>`; return; }
  if(r.pctChange===null){ el.innerHTML = `<div class="deep-empty">دیروز یا پریروز کانورژنی ثبت نشده، پس CPA قابل مقایسه نیست.</div>`; return; }
  if(!r.significant){
    el.innerHTML = `<div class="deep-empty">CPA از ${fmtDateLabel(r.prevDate)} به ${fmtDateLabel(r.date)} تغییر قابل‌توجهی (نسبت به نوسان عادی) نداشته (${r.pctChange>=0?'+':''}${r.pctChange.toFixed(0)}٪).</div>`;
    return;
  }
  const headline = `
    <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
      <span class="di-tag ${r.pctChange>=0?'bad':'good'}">${r.pctChange>=0?'▲':'▼'} ${Math.abs(r.pctChange).toFixed(0)}٪</span>
      <span class="di-date">${fmtDateLabel(r.prevDate)} ← ${fmtDateLabel(r.date)}</span><br>
      CPA از <b>${fmtMoney(r.yesterdayCpa)}</b> به <b>${fmtMoney(r.todayCpa)}</b> ${r.pctChange>=0?'بدتر شده':'بهتر شده'}
    </div>`;
  if(!r.contributors || !r.contributors.length){
    el.innerHTML = headline + `<div class="deep-empty">عامل مشخصی در سطح کمپین پیدا نشد (احتمالاً ترکیب چندتایی کوچیک از تغییرات بوده).</div>`;
    return;
  }
  const rows = r.contributors.map(c=>`
    <li class="deep-item">
      <span class="di-tag ${c.contribution>=0?'bad':'good'}">${c.contribution>=0?'+':''}${fmtMoney(c.contribution)}</span>
      <b>${escapeHtml(c.campaign)}</b> از تغییر CPA
    </li>`).join('');
  el.innerHTML = headline + `<ul class="deep-list">${rows}</ul>`;
}
function renderSegmentIssues(project){
  const results = analyzeCampaignSegments(project);
  const el = document.getElementById(`segmentIssues-${project.id}`);
  if(!results.length){
    el.innerHTML = `<div class="deep-empty">کمپینی که هم CPA‌ش به‌طور معنادار از میانگین کلی بالاتر باشه، هم توش Adgroup/Creative مشکل‌دار آماری پیدا بشه، شناسایی نشد.</div>`;
    return;
  }
  el.innerHTML = results.map(r=>{
    const windowLabel = r.window ? `${r.window} روز اخیر` : 'کل بازه‌ی موجود (دیتای روزهای اخیر برای تحلیل کافی نبود)';
    const benchWindowLabel = r.benchmarkWindow ? `${r.benchmarkWindow} روز اخیر` : 'کل بازه‌ی موجود';
    const diffPct = (r.cpa-r.benchmarkCpa)/r.benchmarkCpa*100;
    let block = `
      <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:10px;">
        <b>${escapeHtml(r.campaign)}</b><br>
        CPA این کمپین در ${windowLabel} (n=${fmtNum(r.installs)} نصب): <span class="seg-rate low">${fmtMoney(r.cpa)}</span>
        — میانگین پروژه (${benchWindowLabel}): <span class="seg-rate">${fmtMoney(r.benchmarkCpa)}</span> (${diffPct>=0?'+':''}${diffPct.toFixed(0)}٪)
      </div>`;
    if(r.adgroupFlags.length){
      block += `<div class="deep-subtext" style="margin:8px 0 4px;">Adgroup های مشکل‌دار (مستقل از Creative):</div>
        <ul class="deep-list">` + r.adgroupFlags.slice(0,3).map(f=>`
          <li class="deep-item">
            «${escapeHtml(f.key)}»: نرخ تبدیل <span class="seg-rate low">${(f.segRate*100).toFixed(1)}٪</span> در مقابل <span class="seg-rate">${(f.restRate*100).toFixed(1)}٪</span> بقیه‌ی کمپین (n=${fmtNum(f.installs)}, z=${f.z.toFixed(2)})
          </li>`).join('') + `</ul>`;
    }
    if(r.creativeFlags.length){
      block += `<div class="deep-subtext" style="margin:8px 0 4px;">Creative های مشکل‌دار (مستقل از Adgroup):</div>
        <ul class="deep-list">` + r.creativeFlags.slice(0,3).map(f=>`
          <li class="deep-item">
            «${escapeHtml(f.key)}»: نرخ تبدیل <span class="seg-rate low">${(f.segRate*100).toFixed(1)}٪</span> در مقابل <span class="seg-rate">${(f.restRate*100).toFixed(1)}٪</span> بقیه‌ی کمپین (n=${fmtNum(f.installs)}, z=${f.z.toFixed(2)})
          </li>`).join('') + `</ul>`;
    }
    return block;
  }).join('');
}


function updateSection(project){
  if(project.error) return;
  const {joined, matchedCost, totalCostInSheet} = computeSection(project);
  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const totalInstalls = joined.reduce((s,r)=>s+r.installs,0);
  const cpa = totalConversion>0 ? totalCost/totalConversion : null;
  const matchPct = totalCostInSheet>0 ? Math.round(matchedCost/totalCostInSheet*100) : 0;

  document.getElementById(`coverageNote-${project.id}`).innerHTML =
    `پوشش join: <b>${matchPct}%</b> هزینه (${fmtMoney(matchedCost)} از ${fmtMoney(totalCostInSheet)} تطبیق یافت)`;

  const cards = [
    {label:'هزینه کل', value: fmtMoney(totalCost)},
    {label: project.conversionLabel + ' کل', value: fmtNum(totalConversion)}
  ];
  if(project.showInstalls) cards.push({label:'Installs کل', value: fmtNum(totalInstalls)});
  cards.push({label:'CPA کلی', value: cpa!==null?fmtMoney(cpa):'—', accent:true});

  const kpiEl = document.getElementById(`kpis-${project.id}`);
  kpiEl.style.gridTemplateColumns = `repeat(${cards.length}, 1fr)`;
  kpiEl.innerHTML = cards.map(c=>`
    <div class="kpi">
      <div class="kpi-top"><span class="label">${c.label}</span></div>
      <div class="value ${c.accent?'accent':''}">${c.value}</div>
    </div>`).join('');

  const {labels, cost, cpaSeries} = groupByDateGeneric(joined);
  if(chartInstances[project.id]){ chartInstances[project.id].destroy(); }
  const accentHex = project.theme.accent;
  const accent2Hex = project.theme.accent2;
  chartInstances[project.id] = new Chart(document.getElementById(`trendChart-${project.id}`), {
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar', label:'هزینه', data:cost, backgroundColor: hexToRgba(accentHex,0.55), hoverBackgroundColor: hexToRgba(accentHex,0.8), borderRadius:5, yAxisID:'y', order:2, maxBarThickness:24},
        {type:'line', label:'CPA', data:cpaSeries, borderColor: accent2Hex, backgroundColor: hexToRgba(accent2Hex,0.12), fill:true, tension:.35, yAxisID:'y1', pointRadius:2.5, pointBackgroundColor: accent2Hex, pointBorderColor:'#0F121A', pointBorderWidth:1.5, borderWidth:2.2, order:1}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#171B26', borderColor:'#232838', borderWidth:1,
          titleColor:'#E8EAF0', bodyColor:'#8A93A8', padding:12, boxPadding:5, cornerRadius:8,
          titleFont:{family:"'IBM Plex Mono', monospace", size:11},
          bodyFont:{family:"'IBM Plex Mono', monospace", size:11.5},
          callbacks:{ label: ctx => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y,0)}` }
        }
      },
      scales:{
        y:{position:'left', grid:{color:'rgba(255,255,255,0.05)'}, border:{display:false}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        y1:{position:'right', grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        x:{grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12}}
      }
    }
  });

  renderCostDrivers(project, joined);
  renderCpaDrivers(project, joined);
  renderSegmentIssues(project);
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---------- Init ----------
async function loadProject(project){
  try{
    const [refRows, costRows] = await Promise.all([
      fetchSheetData(project.spreadsheetId, project.refSheet),
      fetchSheetData(project.spreadsheetId, project.costSheet)
    ]);
    project.rawRef = normalizeRefRows(refRows, project.conversionCol, project.installsCol, project.adgroupCol, project.creativeCol);
    project.rawCost = normalizeCostRows(costRows, project.impressionsCol, project.clicksCol);
    project.error = null;
    const allDates = [...project.rawRef.map(r=>r.date), ...project.rawCost.map(r=>r.date)].sort();
    project.minDate = allDates[0] || null;
    project.maxDate = allDates[allDates.length-1] || null;
  }catch(e){
    project.rawRef = [];
    project.rawCost = [];
    project.error = 'نتونستم دیتای این پروژه رو بخونم: ' + (e.message || 'خطای نامشخص') + ' — مطمئن شو شیت با ایمیل Service Account شیر شده.';
  }
}

function renderTabBar(){
  const el = document.getElementById('tabBar');
  el.innerHTML = PROJECTS.map(p=>`
    <button type="button" class="tab-btn" id="tab-${p.id}" style="--tab-accent:${p.theme.accent}">
      ${p.logo?`<img src="${p.logo}" alt="">`:''}${escapeHtml(p.title)}
    </button>`).join('');
  PROJECTS.forEach(p=>{
    document.getElementById(`tab-${p.id}`).addEventListener('click', ()=>switchTab(p.id));
  });
}

function switchTab(id){
  PROJECTS.forEach(p=>{
    const sectionEl = document.getElementById(`section-${p.id}`);
    if(sectionEl) sectionEl.style.display = (p.id===id) ? '' : 'none';
    const tabEl = document.getElementById(`tab-${p.id}`);
    if(tabEl) tabEl.classList.toggle('active', p.id===id);
  });
  const activeProject = PROJECTS.find(p=>p.id===id);
  const mainContentEl = document.getElementById('mainContent');
  mainContentEl.style.display = (activeProject && !activeProject.ownDateFilter) ? '' : 'none';
}

async function init(){
  setStatus('loading','در حال خوندن شیت‌های همه‌ی پروژه‌ها...');
  await Promise.all(PROJECTS.map(loadProject));

  const globalProjects = PROJECTS.filter(p=>!p.ownDateFilter && !p.error);
  const allDates = [];
  globalProjects.forEach(p=>{
    p.rawRef.forEach(r=>allDates.push(r.date));
    p.rawCost.forEach(r=>allDates.push(r.date));
  });
  allDates.sort();
  if(allDates.length){
    sheetMinDate = allDates[0];
    sheetMaxDate = allDates[allDates.length-1];
    currentFrom = sheetMinDate;
    currentTo = sheetMaxDate;
    renderFilterBar();
  } else {
    document.getElementById('mainContent').innerHTML = '';
  }

  renderSectionsShell();
  PROJECTS.filter(p=>!p.error).forEach(p=>updateSection(p));
  renderTabBar();
  switchTab(PROJECTS[0].id);

  const anyError = PROJECTS.some(p=>p.error);
  setStatus(anyError?'err':'live', anyError ? 'بعضی پروژه‌ها خطا دادن — جزئیات توی همون سکشن' : 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

init();
})();
