<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yektanet Pulse — Cost × KYC Blend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0C12;
    --bg-elev:#0F121A;
    --surface:#12151E;
    --surface-2:#171B26;
    --border:#232838;
    --border-soft:#1B2030;
    --text:#E8EAF0;
    --text-muted:#8A93A8;
    --text-faint:#565F74;
    --accent:#8B7CF6;
    --accent-2:#4EA1FF;
    --accent-soft:rgba(139,124,246,0.12);
    --positive:#34D399;
    --positive-soft:rgba(52,211,153,0.12);
    --negative:#FB7185;
    --negative-soft:rgba(251,113,133,0.12);
    --amber:#FBBF24;
    --amber-soft:rgba(251,191,36,0.12);
    --radius:16px;
    --radius-sm:10px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(139,124,246,0.10), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(78,161,255,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:36px 24px 72px;}

  /* Topbar */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px -4px rgba(139,124,246,.55);
  }
  .brand-mark svg{width:18px;height:18px;color:#fff;}
  .topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--text-muted);
    box-shadow:var(--shadow-card);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .dot.live{background:var(--positive);box-shadow:0 0 0 4px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 4px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Coverage meter */
  .coverage-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow-card);
  }
  .coverage-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .coverage-top .title{font-size:13px;font-weight:700;color:var(--text);}
  .coverage-top .pct{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent-2);}
  .meter-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border-soft);}
  .meter-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease;}
  .coverage-legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .coverage-legend b{color:var(--text);font-family:var(--font-mono);font-weight:600;}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
  .kpi{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 20px;overflow:hidden;box-shadow:var(--shadow-card);
  }
  .kpi::before{
    content:'';position:absolute;top:0;right:0;left:0;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.85;
  }
  .kpi .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .kpi .icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-2);flex-shrink:0;}
  .kpi .icon svg{width:15px;height:15px;}
  .kpi .value{font-family:var(--font-mono);font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--text);}
  .kpi .value.accent{color:var(--accent-2);}
  .kpi .ctx{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* Cards */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .card h2{font-size:15px;font-weight:700;margin:0 0 3px;color:var(--text);}
  .card .card-sub{font-size:12px;color:var(--text-muted);}
  .legend-dots{display:flex;gap:16px;font-size:12px;color:var(--text-muted);}
  .legend-dots span{display:flex;align-items:center;gap:6px;}
  .legend-dots i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .chart-box{position:relative;height:320px;}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:var(--text-muted);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.03em;
    padding:0 12px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  thead th .arrow{opacity:.5;font-size:9px;margin-inline-start:4px;}
  tbody td{padding:12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text);}
  tbody td.num{font-family:var(--font-mono);font-size:12.5px;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  }
  .badge.good{background:var(--positive-soft);color:var(--positive);}
  .badge.bad{background:var(--negative-soft);color:var(--negative);}
  .badge.neutral{background:var(--surface-2);color:var(--text-muted);}

  .loading-state, .error-state{
    text-align:center;padding:80px 20px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text-muted);font-size:13.5px;box-shadow:var(--shadow-card);
  }
  .error-state{color:var(--negative);}
  .spinner{
    width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>
      </div>
      <div>
        <h1>Yektanet Pulse</h1>
        <div class="sub">Adtrace (مرجع) × Cost - Yektanet — بلند‌شده بر اساس Date + Campaign</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">در حال بارگذاری...</span></div>
    </div>
  </div>

  <div id="mainContent">
    <div class="loading-state"><div class="spinner"></div>در حال خوندن Adtrace و Cost - Yektanet...</div>
  </div>
</div>

<script>
(function(){
"use strict";

const SHEET_ID = '1r9f3Vdl6ldgQeL50tHX4TxjVP0H_UxYeYFKhGFp0yeQ';
const GID_ADTRACE = '0';
const GID_COST_YEKTANET = '1883387170';

function csvUrl(gid){ return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }

function setStatus(kind, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (kind==='live'?' live':kind==='err'?' err':' loading');
  t.textContent = text;
}

function toNumber(v){
  if(v===null||v===undefined) return 0;
  const cleaned = String(v).replace(/[^0-9.\-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function normCampaign(c){ return String(c||'').trim().toLowerCase(); }
function normDate(d){ return String(d||'').trim(); }
function fmtDateLabel(yyyymmdd){
  const s = String(yyyymmdd);
  if(s.length !== 8) return s;
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fmtNum(n, digits){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{maximumFractionDigits: digits===undefined?0:digits, minimumFractionDigits: digits===undefined?0:digits});
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return fmtNum(n,0) + ' تومان';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Animated count-up for KPI numbers
function animateValue(el, target, formatter, duration){
  duration = duration || 700;
  const start = performance.now();
  function frame(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = formatter(target * eased);
    if(p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function fetchCsv(gid){
  const res = await fetch(csvUrl(gid));
  if(!res.ok) throw new Error('sheet not accessible');
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

function aggregateAdtrace(rows){
  const map = {};
  rows.forEach(r=>{
    const date = normDate(r['Date']);
    const campaignRaw = r['Campaign'];
    const campaign = normCampaign(campaignRaw);
    if(!date || !campaign) return;
    const key = date + '||' + campaign;
    if(!map[key]) map[key] = {date, campaign, campaignLabel:(campaignRaw||'').trim(), installs:0, kyc:0};
    map[key].installs += toNumber(r['Installs']);
    map[key].kyc += toNumber(r['KYC']);
  });
  return map;
}
function aggregateCostYektanet(rows){
  const map = {};
  rows.forEach(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    if(!date || !campaign) return;
    const key = date + '||' + campaign;
    if(!map[key]) map[key] = {cost:0, impressions:0, clicks:0};
    map[key].cost += toNumber(r['Cost']);
    map[key].impressions += toNumber(r['Impressions']);
    map[key].clicks += toNumber(r['Clicks']);
  });
  return map;
}
function buildJoinedRows(adtraceMap, costMap){
  const joined = [];
  let matchedCost = 0;
  Object.keys(adtraceMap).forEach(key=>{
    const base = adtraceMap[key];
    const costRow = costMap[key];
    const cost = costRow ? costRow.cost : 0;
    const impressions = costRow ? costRow.impressions : 0;
    const clicks = costRow ? costRow.clicks : 0;
    if(costRow) matchedCost += costRow.cost;
    joined.push({
      date: base.date, campaign: base.campaignLabel, installs: base.installs, kyc: base.kyc,
      cost, impressions, clicks, cpa: base.kyc>0 ? (cost/base.kyc) : null, matched: !!costRow
    });
  });
  const totalCostInSheet = Object.values(costMap).reduce((s,r)=>s+r.cost,0);
  return {joined, matchedCost, totalCostInSheet, unmatchedCost: totalCostInSheet - matchedCost};
}
function groupByDate(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {cost:0, kyc:0};
    map[r.date].cost += r.cost; map[r.date].kyc += r.kyc;
  });
  const keys = Object.keys(map).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>map[k].cost),
    cpa: keys.map(k=> map[k].kyc>0 ? (map[k].cost/map[k].kyc) : null)
  };
}
function groupByCampaign(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.campaign]) map[r.campaign] = {campaign:r.campaign, cost:0, kyc:0, installs:0};
    map[r.campaign].cost += r.cost; map[r.campaign].kyc += r.kyc; map[r.campaign].installs += r.installs;
  });
  return Object.values(map).map(r=>({...r, cpa: r.kyc>0 ? (r.cost/r.kyc) : null}));
}

function renderError(msg){
  document.getElementById('mainContent').innerHTML = `<div class="error-state">${msg}</div>`;
  setStatus('err','خطا در دریافت داده');
}

function renderDashboard(joined, coverage){
  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalKyc = joined.reduce((s,r)=>s+r.kyc,0);
  const totalInstalls = joined.reduce((s,r)=>s+r.installs,0);
  const overallCpa = totalKyc>0 ? totalCost/totalKyc : null;
  const matchPct = coverage.totalCostInSheet>0 ? Math.round(coverage.matchedCost/coverage.totalCostInSheet*100) : 0;

  document.getElementById('mainContent').innerHTML = `
    <div class="coverage-card">
      <div class="coverage-top">
        <span class="title">پوشش Join — چقدر از هزینه‌ی Cost-Yektanet به یه کمپین در Adtrace وصل شد</span>
        <span class="pct">${matchPct}%</span>
      </div>
      <div class="meter-track"><div class="meter-fill" id="meterFill" style="width:0%"></div></div>
      <div class="coverage-legend">
        <span>هزینه‌ی متصل‌شده: <b>${fmtMoney(coverage.matchedCost)}</b></span>
        <span>هزینه‌ی کل شیت: <b>${fmtMoney(coverage.totalCostInSheet)}</b></span>
        ${coverage.unmatchedCost>1000?`<span>بدون تطبیق: <b style="color:var(--negative)">${fmtMoney(coverage.unmatchedCost)}</b></span>`:''}
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-top"><span class="label">هزینه کل</span><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span></div>
        <div class="value" id="kpiCost">0</div>
        <div class="ctx">در بازه‌ی داده‌ی متصل‌شده</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="label">KYC کل</span><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></span></div>
        <div class="value" id="kpiKyc">0</div>
        <div class="ctx">منبع: Adtrace (مرجع)</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="label">Installs کل</span><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span></div>
        <div class="value" id="kpiInstalls">0</div>
        <div class="ctx">همه‌ی نتورک‌ها</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="label">CPA کلی</span><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span></div>
        <div class="value accent" id="kpiCpa">—</div>
        <div class="ctx">هزینه ÷ KYC</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>هزینه و CPA بر حسب روز</h2>
          <div class="card-sub">مجموع روزانه‌ی همه‌ی کمپین‌های تطبیق‌یافته</div>
        </div>
        <div class="legend-dots">
          <span><i style="background:var(--accent)"></i>هزینه</span>
          <span><i style="background:var(--amber)"></i>CPA</span>
        </div>
      </div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>خلاصه به تفکیک کمپین</h2>
          <div class="card-sub">روی هدر ستون کلیک کن تا مرتب بشه — رنگ CPA نسبت به میانگین کلیه</div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th data-key="campaign">کمپین</th>
              <th data-key="cost">هزینه</th>
              <th data-key="kyc">KYC</th>
              <th data-key="installs">Installs</th>
              <th data-key="cpa">CPA</th>
            </tr>
          </thead>
          <tbody id="campaignTableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  requestAnimationFrame(()=>{ document.getElementById('meterFill').style.width = matchPct + '%'; });
  animateValue(document.getElementById('kpiCost'), totalCost, v=>fmtMoney(v));
  animateValue(document.getElementById('kpiKyc'), totalKyc, v=>fmtNum(v));
  animateValue(document.getElementById('kpiInstalls'), totalInstalls, v=>fmtNum(v));
  document.getElementById('kpiCpa').textContent = overallCpa!==null ? fmtMoney(overallCpa) : '—';

  const {labels, cost, cpa} = groupByDate(joined);
  Chart.defaults.color = '#8A93A8';
  Chart.defaults.font.family = "'Vazirmatn', system-ui, sans-serif";
  new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar', label:'هزینه', data:cost, backgroundColor:'rgba(139,124,246,0.55)', hoverBackgroundColor:'rgba(139,124,246,0.8)', borderRadius:5, yAxisID:'y', order:2, maxBarThickness:24},
        {type:'line', label:'CPA', data:cpa, borderColor:'#FBBF24', backgroundColor:'rgba(251,191,36,0.12)', fill:true, tension:.35, yAxisID:'y1', pointRadius:2.5, pointBackgroundColor:'#FBBF24', pointBorderColor:'#0F121A', pointBorderWidth:1.5, borderWidth:2.2, order:1}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#171B26', borderColor:'#232838', borderWidth:1,
          titleColor:'#E8EAF0', bodyColor:'#8A93A8', padding:12, boxPadding:5, cornerRadius:8,
          titleFont:{family:"'IBM Plex Mono', monospace", size:11},
          bodyFont:{family:"'IBM Plex Mono', monospace", size:11.5},
          callbacks:{ label: ctx => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y,0)}` }
        }
      },
      scales:{
        y:{position:'left', grid:{color:'rgba(255,255,255,0.05)'}, border:{display:false}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        y1:{position:'right', grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, callback:v=>fmtNum(v)}},
        x:{grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12}}
      }
    }
  });

  let sortKey='cost', sortDir='desc';
  const byCampaign = groupByCampaign(joined);
  const avgCpa = overallCpa;
  function cpaBadge(cpaVal){
    if(cpaVal===null) return `<span class="badge neutral">—</span>`;
    if(avgCpa===null) return `<span class="badge neutral">${fmtMoney(cpaVal)}</span>`;
    const cls = cpaVal <= avgCpa ? 'good' : 'bad';
    return `<span class="badge ${cls}">${fmtMoney(cpaVal)}</span>`;
  }
  function renderTable(){
    const list = [...byCampaign].sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(av===null) av=-Infinity; if(bv===null) bv=-Infinity;
      if(typeof av==='string') return sortDir==='asc'? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir==='asc' ? av-bv : bv-av;
    });
    document.getElementById('campaignTableBody').innerHTML = list.map(r=>`
      <tr>
        <td>${escapeHtml(r.campaign)}</td>
        <td class="num">${fmtMoney(r.cost)}</td>
        <td class="num">${fmtNum(r.kyc)}</td>
        <td class="num">${fmtNum(r.installs)}</td>
        <td class="num">${cpaBadge(r.cpa)}</td>
      </tr>`).join('');
    document.querySelectorAll('thead th[data-key]').forEach(th=>{
      const arrow = th.querySelector('.arrow'); if(arrow) arrow.remove();
      if(th.dataset.key===sortKey) th.insertAdjacentHTML('beforeend', `<span class="arrow">${sortDir==='asc'?'▲':'▼'}</span>`);
    });
  }
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if(sortKey===k){ sortDir = sortDir==='asc'?'desc':'asc'; } else { sortKey=k; sortDir='desc'; }
      renderTable();
    });
  });
  renderTable();

  setStatus('live', 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

async function init(){
  setStatus('loading','در حال خوندن Adtrace...');
  let adtraceRows, costRows;
  try{ adtraceRows = await fetchCsv(GID_ADTRACE); }
  catch(e){ renderError('نتونستم تب Adtrace رو بخونم. مطمئن شو شیت با دسترسی «هرکسی با لینک — بازبین» شیر شده.'); return; }
  setStatus('loading','در حال خوندن Cost - Yektanet...');
  try{ costRows = await fetchCsv(GID_COST_YEKTANET); }
  catch(e){ renderError('نتونستم تب Cost - Yektanet رو بخونم. مطمئن شو شیت با دسترسی «هرکسی با لینک — بازبین» شیر شده.'); return; }
  const adtraceMap = aggregateAdtrace(adtraceRows);
  const costMap = aggregateCostYektanet(costRows);
  const {joined, matchedCost, totalCostInSheet, unmatchedCost} = buildJoinedRows(adtraceMap, costMap);
  renderDashboard(joined, {matchedCost, totalCostInSheet, unmatchedCost});
}

init();
})();
</script>
</body>
</html>
