<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yektanet Pulse — Cost × KYC Blend</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F3F5F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* Light surfaces: the page is a soft neutral, every panel is plain white. */
    --bg:#F3F5F9;
    --bg-elev:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F5F7FB;
    --surface-3:#EDF1F7;
    --border:#E1E6EF;
    --border-soft:#EDF0F6;
    --text:#111827;
    --text-muted:#5A6577;
    --text-faint:#7C8798;
    /* Per-project brand colors override these three on each section. */
    --accent:#2563EB;
    --accent-ink:#1D4ED8;          /* the brand color stepped dark enough for text */
    --accent-2:#1B1F27;
    --accent-soft:rgba(37,99,235,0.10);
    --accent-grad:linear-gradient(90deg,var(--accent),var(--accent-2));
    --positive:#0E7A4F;
    --positive-soft:rgba(14,122,79,0.10);
    --negative:#C62026;
    --negative-soft:rgba(198,32,38,0.09);
    --amber:#B45309;
    --amber-soft:rgba(180,83,9,0.12);
    --radius:14px;
    --radius-sm:10px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -18px rgba(16,24,40,.28);
    --shadow-pop:0 12px 32px -12px rgba(16,24,40,.24), 0 2px 6px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);color-scheme:light;}
  body{
    margin:0;
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(37,99,235,0.05), transparent 60%),
      radial-gradient(760px 380px at 100% 0%, rgba(15,23,42,0.035), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px;}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 72px;}

  /* Topbar */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,#1E293B,#334155);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -8px rgba(15,23,42,.6);
  }
  .brand-mark svg{width:18px;height:18px;color:#fff;}
  .topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--text-muted);
    box-shadow:var(--shadow-card);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .dot.live{background:var(--positive);box-shadow:0 0 0 4px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 4px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Coverage meter */
  .coverage-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 22px;margin-bottom:22px;box-shadow:var(--shadow-card);
  }
  .coverage-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .coverage-top .title{font-size:13px;font-weight:700;color:var(--text);}
  .coverage-top .pct{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent-ink);}
  .meter-track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
  .meter-fill{height:100%;border-radius:99px;background:var(--accent-grad);transition:width .6s ease;}
  .coverage-legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .coverage-legend b{color:var(--text);font-family:var(--font-mono);font-weight:600;}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .kpi{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;overflow:hidden;box-shadow:var(--shadow-card);
  }
  .kpi::before{
    content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--accent-grad);
  }
  .kpi .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;}
  .kpi-key{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:7px;flex-shrink:0;}
  .kpi-sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex-shrink:0;}
  .kpi .icon svg{width:15px;height:15px;}
  .kpi .value{font-family:var(--font-mono);font-size:23px;font-weight:700;letter-spacing:-0.02em;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.35;}
  .kpi .value.accent{color:var(--accent-ink);}
  .kpi .ctx{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* Cards */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-card);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .card h2{font-size:15px;font-weight:700;margin:0 0 3px;color:var(--text);letter-spacing:-0.01em;}
  .card .card-sub{font-size:12px;color:var(--text-muted);max-width:70ch;line-height:1.7;}
  .legend-dots{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .legend-dots span{display:flex;align-items:center;gap:6px;}
  .legend-dots i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0;}
  .legend-dots i.bar{background:var(--accent-grad);}
  .legend-dots i.line{height:3px;border-radius:2px;background:var(--accent-2);}
  .chart-box{position:relative;height:320px;}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:var(--text-muted);font-weight:700;font-size:11.5px;
    letter-spacing:.02em;
    padding:0 12px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  thead th .arrow{opacity:.5;font-size:9px;margin-inline-start:4px;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text);}
  tbody td.num{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  }
  .badge.good{background:var(--positive-soft);color:var(--positive);}
  .badge.bad{background:var(--negative-soft);color:var(--negative);}
  .badge.neutral{background:var(--surface-3);color:var(--text-muted);}

  .loading-state, .error-state{
    text-align:center;padding:80px 20px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text-muted);font-size:13.5px;box-shadow:var(--shadow-card);
  }
  .error-state{color:var(--negative);}
  .spinner{
    width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .filter-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow-card);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    position:sticky;top:var(--sticky-top, 60px);z-index:30;
  }
  .filter-group{display:flex;align-items:center;gap:8px;}
  .filter-group label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .filter-bar input[type="date"]{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-family:var(--font-mono);font-size:12.5px;color:var(--text);
    color-scheme:light;
  }
  .filter-bar input[type="date"]:hover{border-color:var(--text-faint);}
  .filter-bar input[type="date"]:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft);}
  .filter-presets{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;}
  .preset-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;font-size:12px;color:var(--text-muted);font-family:var(--font-ui);font-weight:600;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .preset-btn:hover{border-color:var(--accent-ink);color:var(--text);}
  .preset-btn.active{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink);}
  .filter-range-label{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

  .section{margin-bottom:28px;}
  .section:not(:last-child){padding-bottom:24px;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .section-title{font-size:18px;font-weight:800;margin:0 0 3px;color:var(--text);letter-spacing:-0.015em;}
  .section-sub{font-size:12px;color:var(--text-muted);}
  .campaign-select{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);
    min-width:180px;color-scheme:light;
  }
  .campaign-select:focus{outline:none;border-color:var(--accent-ink);}
  .coverage-note{
    font-size:11.5px;color:var(--text-muted);margin-bottom:14px;background:var(--surface-2);
    border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:9px 12px;line-height:1.9;
  }
  .coverage-note b{color:var(--text);font-family:var(--font-mono);}
  .error-inline{
    grid-column:1/-1;background:var(--negative-soft);color:var(--negative);border-radius:8px;
    padding:12px 16px;font-size:13px;
  }

  .section-head-left{display:flex;align-items:center;gap:12px;}
  .section-logo{
    width:44px;height:44px;border-radius:12px;object-fit:contain;padding:5px;
    background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-card);flex-shrink:0;
  }
  .section-logo.wide{width:auto;max-width:132px;}
  .section-controls{display:flex;align-items:center;gap:10px;}
  .ms-dropdown{position:relative;}
  .ms-toggle{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--text);
    min-width:170px;text-align:right;cursor:pointer;box-shadow:var(--shadow-card);
  }
  .ms-toggle:hover{border-color:var(--accent-ink);}
  .ms-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:260px;max-width:340px;
    max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:8px;box-shadow:var(--shadow-pop);
  }
  .ms-search-wrap{position:sticky;top:-8px;background:var(--surface);padding:2px 2px 8px;z-index:2;}
  .ms-search{
    width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:7px 10px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);
  }
  .ms-search::placeholder{color:var(--text-faint);}
  .ms-search:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft);}
  .ms-empty{padding:10px 8px;font-size:12px;color:var(--text-muted);text-align:center;}
  .ms-option{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:12.5px;
    cursor:pointer;color:var(--text);
  }
  .ms-option:hover{background:var(--surface-2);}
  .ms-option input{accent-color:var(--accent-ink);flex-shrink:0;}
  /* .ms-option sets display:flex, which would otherwise beat the browser's
     own [hidden] rule and leave filtered-out rows on screen. */
  .ms-option[hidden]{display:none;}
  .ms-option-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-option-cost{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .ms-option-all{font-weight:700;}
  .ms-option-all span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-divider{height:1px;background:var(--border);margin:6px 2px;}

  .section-filter-bar{margin-bottom:14px;}

  .tab-bar{
    display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);flex-wrap:wrap;
    /* Pinned to the top while scrolling; the side bleed keeps content from
       showing through the wrap's own gutters as it scrolls underneath. */
    position:sticky;top:0;z-index:70;
    background:rgba(243,245,249,.94);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding-top:10px;padding-bottom:0;margin-inline:-24px;padding-inline:24px;
  }
  .tab-btn{
    display:flex;align-items:center;gap:8px;background:none;border:none;
    padding:9px 4px;margin-inline-end:18px;font-family:var(--font-ui);font-size:14px;font-weight:700;
    color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;
    transition:color .15s, border-color .15s;
  }
  .tab-btn img{width:22px;height:22px;border-radius:6px;object-fit:contain;background:#fff;flex-shrink:0;}
  .tab-btn img.wide{width:auto;max-width:72px;border-radius:4px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--tab-ink, var(--text));border-bottom-color:var(--tab-accent, var(--text));}

  .sub-tab-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;
    position:sticky;top:var(--tabbar-h, 54px);z-index:65;
    background:rgba(243,245,249,.94);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:10px 24px;margin-inline:-24px;
  }
  .sub-tab-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:7px 16px;font-family:var(--font-ui);font-size:12.5px;font-weight:600;
    color:var(--text-muted);cursor:pointer;transition:color .15s, border-color .15s, background .15s;
  }
  .sub-tab-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .sub-tab-btn.active{
    color:var(--tab-ink, var(--text));border-color:var(--tab-ink, var(--border));
    background:var(--tab-soft, var(--surface-2));
  }

  .insight-text{font-size:13.5px;line-height:1.9;color:var(--text);margin:0 0 16px;}
  .insight-chips{display:flex;flex-wrap:wrap;gap:10px;}
  .insight-chip{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;min-width:150px;flex:1 1 150px;
  }
  .insight-chip .ic-label{font-size:11px;color:var(--text-muted);margin-bottom:5px;}
  .insight-chip .ic-value{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .insight-chip.good{border-color:rgba(14,122,79,.35);background:var(--positive-soft);}
  .insight-chip.good .ic-value{color:var(--positive);}
  .insight-chip.bad{border-color:rgba(198,32,38,.3);background:var(--negative-soft);}
  .insight-chip.bad .ic-value{color:var(--negative);}

  .deep-subhead{
    font-size:13px;font-weight:700;margin:22px 0 8px;color:var(--text);
    padding-inline-start:10px;border-inline-start:3px solid var(--accent);border-radius:2px;
  }
  .deep-subhead:first-of-type{margin-top:0;}
  .deep-subtext{font-size:11.5px;color:var(--text-muted);margin:0 0 10px;line-height:1.9;}
  .deep-list{list-style:none;margin:0;padding:0;}
  .deep-item{padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;line-height:1.8;color:var(--text);}
  .deep-item:last-child{border-bottom:none;}
  .deep-item b{font-weight:700;}
  .di-date{font-family:var(--font-mono);color:var(--text-muted);font-size:11.5px;margin-inline-start:6px;}
  .di-tag{
    display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;
    font-size:11px;font-weight:700;font-family:var(--font-mono);margin-inline-end:8px;
  }
  .di-tag.good{background:var(--positive-soft);color:var(--positive);}
  .di-tag.bad{background:var(--negative-soft);color:var(--negative);}
  .deep-empty{font-size:12.5px;color:var(--text-muted);padding:10px 12px;background:var(--surface-2);border-radius:var(--radius-sm);}
  .budget-bar{padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .budget-bar:last-child{border-bottom:none;}
  .budget-bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-bottom:7px;}
  .budget-bar-foot{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono);}
  .pos-text{color:var(--positive);}
  .neg-text{color:var(--negative);}
  .cpa-table tfoot td{border-top:1px solid var(--border);font-weight:700;}
  .cpa-table-wrap{
    overflow-x:auto;overflow-y:auto;max-height:420px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
  }
  .cpa-table thead th{position:sticky;top:0;background:var(--surface-2);z-index:1;}
  .cpa-table{width:100%;border-collapse:collapse;font-size:12px;}
  .cpa-table th{
    text-align:right;font-weight:700;font-size:11px;color:var(--text-muted);
    padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .cpa-table td{
    padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);
    white-space:nowrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  }
  .cpa-table tbody tr:nth-child(even){background:#FBFCFE;}
  .cpa-table tbody tr:hover{background:var(--accent-soft);}
  .cpa-table td.campaign{font-family:var(--font-ui);font-weight:700;white-space:normal;min-width:150px;}
  .filter-name{
    background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:right;
    font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;
    border-bottom:1px dashed var(--text-faint);transition:color .15s, border-color .15s;
  }
  .filter-name:hover{color:var(--accent-ink);border-bottom-color:var(--accent-ink);}
  .filter-name.active{color:var(--accent-ink);border-bottom-style:solid;border-bottom-color:var(--accent-ink);}
  .filter-name.active::before{content:'✓ ';font-weight:700;}
  .copy-name{
    background:none;border:none;padding:0;margin:0;cursor:pointer;position:relative;
    font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;text-align:right;
    border-bottom:1px dashed var(--text-faint);transition:color .15s, border-color .15s;
  }

<script>
(function(){
"use strict";

async function fetchSheetData(spreadsheetId, sheet){
  const res = await fetch(`/api/sheet-data?spreadsheetId=${encodeURIComponent(spreadsheetId)}&sheet=${encodeURIComponent(sheet)}`);
  const json = await res.json();

}

function setStatus(kind, text){

  const t = document.getElementById('statusText');
  dot.className = 'dot' + (kind==='live'?' live':kind==='err'?' err':' loading');

// Google Sheets hands us whatever the cell *displays*, so numbers arrive in
// whatever locale/format the sheet is using: Persian or Arabic-Indic digits,
// "٬" or a space as thousands separator, "٫" as decimal separator, RTL marks,
// a currency suffix, "(1,234)" for negatives. Anything we fail to read here
// silently becomes 0 and a day's cost comes out short, so parse defensively.
const DIGIT_MAP = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
                   '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function latinizeDigits(str){
  return String(str).replace(/[۰-۹٠-٩]/g, ch => DIGIT_MAP[ch]);
}
function toNumber(v){
  if(v===null||v===undefined) return 0;
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  let s = latinizeDigits(String(v)).replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,'').trim();
  if(!s) return 0;
  s = s.replace(/[−–—]/g, '-');                   // unicode minus variants
  // Only a leading/trailing sign or wrapping parens mean negative — the "-" in
  // an exponent like 1.48E-08 must not flip the whole number.
  const negative = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
  s = s.replace(/٫/g, '.');                       // Persian decimal separator
  s = s.replace(/[\s\u00A0\u066C٬،']/g, '');      // thousands separators
  // Scientific notation: a narrow or Scientific-formatted Cost column makes
  // Sheets display "1.48E+08", which stripped of its letters would read as 1.48.
  const sci = s.match(/(\d+(?:[.,]\d+)?)[eE]([+-]?\d+)/);
  if(sci){
    const n = parseFloat(sci[1].replace(',', '.')) * Math.pow(10, parseInt(sci[2], 10));
    if(!isFinite(n)) return 0;
    return negative ? -Math.abs(n) : n;
  }
  s = s.replace(/[^0-9.,]/g, '');                 // currency text, signs, etc.
  if(!s) return 0;
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma >= 0 && lastDot >= 0){
    // Both present: whichever comes last is the decimal separator.
    if(lastComma > lastDot) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(lastComma >= 0){
    // Only commas: repeated, or grouping exactly 3 digits => thousands.
    const parts = s.split(',');
    s = (parts.length > 2 || parts[1].length === 3) ? parts.join('') : parts.join('.');
  } else if((s.match(/\./g)||[]).length > 1){
    s = s.replace(/\./g,'');                      // 1.234.567 style thousands
  }
  const n = parseFloat(s);
  if(isNaN(n)) return 0;
  return negative ? -Math.abs(n) : n;
}
function normCampaign(c){ return String(c||'').trim().toLowerCase(); }
// Sheet cells come back as numbers when they hold one, so never call string
// methods on a raw cell — go through here.
function cellText(v){ return (v===null || v===undefined) ? '' : String(v).trim(); }
// Dates must all end up in the same YYYYMMDD shape: the date-range filter and
// the day sort compare them as plain strings, so a single row formatted as
// "2026-09-01" would sort and filter as if it were a different era and its
// cost would drop out of the chart.
function normDate(d){
  let s = latinizeDigits(String(d||'')).replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,'').trim();
  if(!s) return '';
  const ymd = s.match(/^(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})/);
  if(ymd) return ymd[1] + String(ymd[2]).padStart(2,'0') + String(ymd[3]).padStart(2,'0');
  // Month-first dates, the shape Sheets exports in an en-US locale
  // ("7/5/2026", "7/15/26"). Two-digit years are this century.
  const mdy = s.match(/^(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{2,4})$/);
  if(mdy){
    const year = mdy[3].length === 2 ? '20' + mdy[3] : mdy[3];
    return year + String(mdy[1]).padStart(2,'0') + String(mdy[2]).padStart(2,'0');
  }
  const digitsOnly = s.replace(/\D/g,'');
  if(digitsOnly.length === 8) return digitsOnly;
  if(digitsOnly.length === 14) return digitsOnly.slice(0,8); // timestamp
  // A true date cell read unformatted comes back as a Sheets serial number
  // (days since 1899-12-30). 8-digit YYYYMMDD values are far above this range.
  if(/^\d{5}$/.test(s)){
    const d = new Date(Date.UTC(1899,11,30) + Number(s)*86400000);
    return String(d.getUTCFullYear()) + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0');
  }
  return s;
}

  const s = String(yyyymmdd);
  if(s.length !== 8) return s;
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fmtNum(n, digits){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{maximumFractionDigits: digits===undefined?0:digits, minimumFractionDigits: digits===undefined?0:digits});
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return fmtNum(n,0) + ' تومان';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function todayStr(){
  const d = new Date();
  return String(d.getFullYear()) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

  const s = String(yyyymmdd);

}

// A hidden project is dropped here, before anything else sees it: no tab, no
// section, and none of its sheets are fetched, so it costs nothing at load.
const PROJECTS = ALL_PROJECTS.filter(p => !p.hidden);

const projectState = {}; // { [id]: { campaigns: 'ALL' | Set(keys), from, to } }
const chartInstances = {};

// extraCols are further conversion columns the section reports a cost-per for
// (Deposit, Purchase…). They ride along as `extras` so the join and the range
// filter treat them exactly like the main conversion.
function normalizeRefRows(rows, conversionCol, installsCol, adgroupCol, creativeCol, extraCols){
  adgroupCol = adgroupCol || 'Adgroup';
  creativeCol = creativeCol || 'Creative';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaignRaw = r['Campaign'];
    const campaign = normCampaign(campaignRaw);
    if(!date || !campaign) return null;
    return {
      date, campaign, campaignLabel: cellText(campaignRaw),
      adgroup: cellText(r[adgroupCol]) || '(بدون Adgroup)',
      creative: cellText(r[creativeCol]) || '(بدون Creative)',
      installs: installsCol ? toNumber(r[installsCol]) : 0,
      conversion: toNumber(r[conversionCol]),
      extras: (extraCols||[]).reduce((acc,col)=>{ acc[col] = toNumber(r[col]); return acc; }, {})
    };
  }).filter(Boolean);
}
function addExtras(target, extras){
  Object.entries(extras||{}).forEach(([k,v])=>{ target[k] = (target[k]||0) + v; });
  return target;
}
function normalizeCostRows(rows, impressionsCol, clicksCol, diag){
  impressionsCol = impressionsCol || 'Impressions';
  clicksCol = clicksCol || 'Clicks';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    const cost = toNumber(r['Cost']);
    const rawCost = String(r['Cost']===undefined||r['Cost']===null ? '' : r['Cost']).trim();
    if(!date || !campaign){
      // A total row, a stray note, or a row whose Date/Campaign cell is empty.
      // Its cost never reaches the chart, so count it instead of losing it.
      if(diag && (rawCost || date || campaign)){ diag.skippedRows++; diag.skippedCost += cost; }
      return null;
    }
    // Cell had something in it but we read 0 — an unsupported number format.
    if(diag && rawCost && !/^[0-]*$/.test(latinizeDigits(rawCost).replace(/\D/g,'')||'0') && cost===0) diag.unreadableCost++;
    return {date, campaign, campaignLabel: cellText(r['Campaign']),
            cost, impressions: toNumber(r[impressionsCol]), clicks: toNumber(r[clicksCol])};
  }).filter(Boolean);
}
// ---------- Budget/profit sections ----------
// Blend Data: one row per day + campaign, carrying what the panel really cost
// (Cost R) and what was declared to the client (Cost).
function normalizeBlendRows(rows){
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    if(!date || !campaign) return null;
    return {
      date, campaign,
      campaignLabel: cellText(r['Campaign']),
      campaignName: cellText(r['Campaign Name']) || '(بدون نام)',
      sessions: toNumber(r['Sessions']),
      impressions: toNumber(r['Impression']),
      clicks: toNumber(r['Click']),
      costReal: toNumber(r['Cost R']),
      cost: toNumber(r['Cost'])
    };
  }).filter(Boolean);
}
// Budgeting: one row per campaign. Total Budget is the only figure that isn't
// derived from Blend Data, but the rest is read from here too so the dashboard
// agrees with the sheet the client is shown.
function normalizeBudgetRows(rows){
  return rows.map(r=>{
    const campaign = normCampaign(r['Campaign']);
    if(!campaign) return null;
    return {
      campaign,
      campaignLabel: cellText(r['Campaign']),
      campaignName: cellText(r['Campaign Name']) || '(بدون نام)',
      totalBudget: toNumber(r['Total Budget']),
      spent: toNumber(r['Spent']),
      remaining: toNumber(r['Remaining Budget']),
      spentPanel: toNumber(r['Spent (Panel)']),
      profit: toNumber(r['Profit'])
    };
  }).filter(Boolean);
}

// Profit only accrues on declared cost that is still inside the campaign's
// budget: profit = min(declared so far, budget) - real cost. Walking each
// campaign's days in order turns that into a daily number whose total matches
// the Budgeting sheet's Profit column.
function budgetNameFilter(project){
  const st = projectState[project.id];
  if(!st || st.campaigns === 'ALL') return () => true;
  return name => st.campaigns.has(normCampaign(name));
}
// The second slot: a campaign key inside the selected Campaign Names.
function budgetCampaignFilter(project){
  const st = projectState[project.id];
  if(!st || !st.subCampaigns || st.subCampaigns === 'ALL') return () => true;
  return key => st.subCampaigns.has(key);
}
function buildBudgetDaily(project){
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inName = budgetNameFilter(project);
  const inCampaign = budgetCampaignFilter(project);
  const byCampaign = {};
  // The cumulative walk needs every day of a campaign, but only the selected
  // Campaign Names and campaigns take part at all.
  (project.rawBlend||[]).filter(r=>inName(r.campaignName) && inCampaign(r.campaign))
    .forEach(r=>{ (byCampaign[r.campaign] = byCampaign[r.campaign] || []).push(r); });

  const byDate = {};
  Object.entries(byCampaign).forEach(([key, rows])=>{
    rows.sort((a,b)=>a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const budgetRow = project.budgetByCampaign[key];
    const budget = budgetRow ? budgetRow.totalBudget : Infinity;
    let declared = 0;
    rows.forEach(r=>{
      const before = Math.min(declared, budget);
      declared += r.cost;
      const billable = Math.min(declared, budget) - before;  // today's part still inside the budget
      if(!inRange(r.date)) return;
      const d = byDate[r.date] = byDate[r.date] || {cost:0, costReal:0, profit:0};
      d.cost += r.cost;
      d.costReal += r.costReal;
      d.profit += billable - r.costReal;
    });
  });

  const keys = Object.keys(byDate).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>byDate[k].cost),
    costReal: keys.map(k=>byDate[k].costReal),
    profit: keys.map(k=>byDate[k].profit),
    totals: keys.reduce((t,k)=>({cost:t.cost+byDate[k].cost, costReal:t.costReal+byDate[k].costReal, profit:t.profit+byDate[k].profit}),
                        {cost:0, costReal:0, profit:0}),
    dayCount: keys.length
  };
}

// Budget figures are lifetime by nature, so they ignore the date filter.
function buildBudgetTable(project){
  const inName = budgetNameFilter(project);
  const inCampaign = budgetCampaignFilter(project);
  const rows = (project.rawBudget||[]).filter(r=>inName(r.campaignName) && inCampaign(r.campaign))
    .sort((a,b)=>b.totalBudget - a.totalBudget);
  const totals = rows.reduce((t,r)=>({
    totalBudget: t.totalBudget + r.totalBudget, spent: t.spent + r.spent,
    remaining: t.remaining + r.remaining, spentPanel: t.spentPanel + r.spentPanel, profit: t.profit + r.profit
  }), {totalBudget:0, spent:0, remaining:0, spentPanel:0, profit:0});

  const byName = {};
  rows.forEach(r=>{
    const g = byName[r.campaignName] = byName[r.campaignName] ||
      {name:r.campaignName, totalBudget:0, spent:0, remaining:0, profit:0, campaigns:0};
    g.totalBudget += r.totalBudget; g.spent += r.spent; g.remaining += r.remaining;
    g.profit += r.profit; g.campaigns++;
  });
  const groups = Object.values(byName).map(g=>({
    ...g,
    remainingPct: g.totalBudget>0 ? Math.max(0, Math.min(100, g.remaining/g.totalBudget*100)) : 0,
    spentPct: g.totalBudget>0 ? Math.max(0, Math.min(100, g.spent/g.totalBudget*100)) : 0
  })).sort((a,b)=>b.totalBudget - a.totalBudget);

  return {rows, totals, groups};
}

// A tab that counts one metric against one dimension (Source / Term / Content)
// and nothing else — no campaign, so nothing to join on; the date is the only
// thing the dashboard needs from it.
function normalizeDimensionRows(rows, dimCol, metricCol){
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const label = cellText(r[dimCol]);
    if(!date || !label) return null;
    return {date, label, value: toNumber(r[metricCol])};
  }).filter(Boolean);
}
function normalizeCompareRows(rows, sessionsCol){
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    if(!date || !campaign) return null;
    return {date, campaign, sessions: toNumber(r[sessionsCol])};
  }).filter(Boolean);
}
function aggregateRef(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {date:r.date, campaign:r.campaign, campaignLabel:r.campaignLabel, installs:0, conversion:0, extras:{}};
    map[key].installs += r.installs;
    map[key].conversion += r.conversion;
    addExtras(map[key].extras, r.extras);
  });
  return map;
}
function aggregateCost(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {date:r.date, campaign:r.campaign, campaignLabel:r.campaignLabel, cost:0, impressions:0, clicks:0};
    map[key].cost += r.cost;
    map[key].impressions += r.impressions;
    map[key].clicks += r.clicks;
  });
  return map;
}
// With includeUnmatchedCost, a day+campaign that spent but has no row in the
// conversion sheet still contributes its cost — an overview reports the whole
// spend of the cost sheet, not only the part that joined.
function buildJoinedRows(refMap, costMap, includeUnmatchedCost){
  const joined = [];
  let matchedCost = 0;
  const keys = includeUnmatchedCost
    ? Array.from(new Set([...Object.keys(refMap), ...Object.keys(costMap)]))
    : Object.keys(refMap);
  keys.forEach(key=>{
    const base = refMap[key];
    const costRow = costMap[key];
    const cost = costRow ? costRow.cost : 0;
    if(costRow && base) matchedCost += costRow.cost;
    const conversion = base ? base.conversion : 0;
    joined.push({
      date: base ? base.date : costRow.date,
      campaign: base ? base.campaign : costRow.campaign,
      campaignLabel: base ? base.campaignLabel : (costRow.campaignLabel || costRow.campaign),
      installs: base ? base.installs : 0,
      conversion,
      extras: base ? base.extras : {},
      cost, cpa: conversion>0 ? (cost/conversion) : null
    });
  });
  const totalCostInSheet = Object.values(costMap).reduce((s,r)=>s+r.cost,0);
  return {joined, matchedCost, totalCostInSheet, unmatchedCost: totalCostInSheet - matchedCost};
}
function groupByDateGeneric(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {cost:0, conversion:0};
    map[r.date].cost += r.cost; map[r.date].conversion += r.conversion;
  });
  const keys = Object.keys(map).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>map[k].cost),
    cpaSeries: keys.map(k=> map[k].conversion>0 ? (map[k].cost/map[k].conversion) : null)
  };
}

// Sessions as Yektanet reports them vs. sessions as GA4 reports them, per day.
// This is a pure day-to-day comparison: campaign names are ignored on both
// sides — no matching between the tabs, and neither the campaign multi-select
// nor the project's own campaign filter applies, since the two sources don't
// name campaigns the same way. Each day is simply the whole tab's total for
// that day. The section's date range still applies.
// The gap is measured against GA4: (Yektanet − GA4) / GA4.
function buildSessionsComparison(project){
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const byDate = {};
  const bucket = d => (byDate[d] = byDate[d] || {own:0, other:0});
  (project.allRef||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.date).own += r.installs; });
  (project.rawCompare||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.date).other += r.sessions; });
  const keys = Object.keys(byDate).sort();
  return {
    labels: keys.map(fmtDateLabel),
    own: keys.map(k=>byDate[k].own),
    other: keys.map(k=>byDate[k].other),
    diffPct: keys.map(k=> byDate[k].other>0 ? ((byDate[k].own - byDate[k].other)/byDate[k].other*100) : null)
  };
}

// A budget section filters by Campaign Name, listing each group's total budget.
function getBudgetNameOptions(project){
  const byKey = {};
  (project.rawBudget||[]).forEach(r=>{

// The campaigns themselves (not their Campaign Name group), so a budget
// section can be narrowed to one campaign the same way the others are.
function getBudgetCampaignOptions(project){
  const byKey = {};

    o.cost += r.totalBudget;
  });

// Campaign options sorted by total cost (desc); label falls back to the raw key.
function getCampaignOptionsSortedByCost(project){
  const costByCampaign = {};
  project.rawCost.forEach(r=>{ costByCampaign[r.campaign] = (costByCampaign[r.campaign]||0) + r.cost; });
  const labelByCampaign = {};
  project.rawRef.forEach(r=>{ if(!labelByCampaign[r.campaign]) labelByCampaign[r.campaign] = r.campaignLabel; });
  const allKeys = new Set([...Object.keys(costByCampaign), ...Object.keys(labelByCampaign)]);
  return Array.from(allKeys).map(k=>({

  })).sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}

// ---------- Global date range (applies to projects without their own filter) ----------
let sheetMinDate = null;
let sheetMaxDate = null;
let currentFrom = null;
let currentTo = null;

function sectionRange(project){
  const st = projectState[project.id];
  return project.ownDateFilter ? {from: st.from, to: st.to} : {from: currentFrom, to: currentTo};
}
function computeSection(project){
  const st = projectState[project.id];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const refFiltered = project.rawRef.filter(r=>inRange(r.date) && inCampaign(r.campaign));
  const costFiltered = project.rawCost.filter(r=>inRange(r.date) && inCampaign(r.campaign));
  const refMap = aggregateRef(refFiltered);
  const costMap = aggregateCost(costFiltered);
  return buildJoinedRows(refMap, costMap, project.includeUnmatchedCost);
}

// ---------- Global filter bar (for projects without their own date filter) ----------
// toISOString() would answer in UTC, which is the day before for anyone east
// of Greenwich for part of the evening — these dates are calendar days as the
// person reading the screen sees them, so they are built from local parts.
function localIso(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// "Yesterday" means yesterday, but a sheet that hasn't been filled in yet would
// leave an empty page; when the data stops earlier, this lands on the newest
// day it has, and the date inputs show which day that was.
function yesterdayWithin(minDate, maxDate){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  let iso = localIso(d);
  if(maxDate && iso > toInputDate(maxDate)) iso = toInputDate(maxDate);
  if(minDate && iso < toInputDate(minDate)) iso = toInputDate(minDate);
  return iso;
}

// The Persian week opens on Saturday, so "this week" runs from the last
// Saturday up to the newest day the sheet has. Anchoring on that day rather
// than on today keeps the range non-empty when a sheet lags a few days.
function weekStartFor(yyyymmdd){
  const d = new Date(toInputDate(yyyymmdd));
  d.setDate(d.getDate() - ((d.getDay() + 1) % 7));   // Sat=6 -> 0 days back
  return localIso(d);
}

function setGlobalPreset(days, btn){
  document.querySelectorAll('#mainContent .preset-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(days === null){
    document.getElementById('fromDate').value = toInputDate(sheetMinDate);
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  } else if(days === 'yesterday'){
    const iso = yesterdayWithin(sheetMinDate, sheetMaxDate);
    document.getElementById('fromDate').value = iso;
    document.getElementById('toDate').value = iso;
  } else if(days === 'week'){
    const minIso = toInputDate(sheetMinDate);
    const weekIso = weekStartFor(sheetMaxDate);
    document.getElementById('fromDate').value = weekIso < minIso ? minIso : weekIso;
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  } else {
    const maxD = new Date(toInputDate(sheetMaxDate));
    const fromD = new Date(maxD);
    fromD.setDate(fromD.getDate() - (days - 1));
    const minD = new Date(toInputDate(sheetMinDate));
    const clampedFrom = fromD < minD ? minD : fromD;
    document.getElementById('fromDate').value = localIso(clampedFrom);
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  }
  applyGlobalFilter();
}
function applyGlobalFilter(){
  const fromVal = document.getElementById('fromDate').value;
  const toVal = document.getElementById('toDate').value;
  currentFrom = fromVal ? fromInputDate(fromVal) : sheetMinDate;
  currentTo = toVal ? fromInputDate(toVal) : sheetMaxDate;
  PROJECTS.filter(p=>!p.ownDateFilter && !p.error).forEach(p=>updateSection(p));
  setStatus('live', 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

// ---------- Per-section date filter (for projects with ownDateFilter) ----------
function applyOwnDateFilter(project){
  const fromVal = document.getElementById(`ownFrom-${project.id}`).value;
  const toVal = document.getElementById(`ownTo-${project.id}`).value;
  projectState[project.id].from = fromVal ? fromInputDate(fromVal) : project.minDate;
  projectState[project.id].to = toVal ? fromInputDate(toVal) : project.maxDate;
  updateSection(project);
}
function setOwnPreset(project, days, btn){
  const wrap = document.getElementById(`section-${project.id}`);
  if(!wrap) return;
  if(!project.minDate || !project.maxDate){ updateSection(project); return; }
  wrap.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const fromInput = document.getElementById(`ownFrom-${project.id}`);
  const toInput = document.getElementById(`ownTo-${project.id}`);
  if(days === null){
    fromInput.value = toInputDate(project.minDate);
    toInput.value = toInputDate(project.maxDate);
  } else if(days === 'yesterday'){
    const iso = yesterdayWithin(project.minDate, project.maxDate);
    fromInput.value = iso;
    toInput.value = iso;
  } else if(days === 'week'){
    const minIso = toInputDate(project.minDate);
    const weekIso = weekStartFor(project.maxDate);
    fromInput.value = weekIso < minIso ? minIso : weekIso;
    toInput.value = toInputDate(project.maxDate);
  } else {
    const maxD = new Date(toInputDate(project.maxDate));
    const fromD = new Date(maxD);
    fromD.setDate(fromD.getDate() - (days - 1));
    const minD = new Date(toInputDate(project.minDate));
    const clampedFrom = fromD < minD ? minD : fromD;
    fromInput.value = localIso(clampedFrom);
    toInput.value = toInputDate(project.maxDate);
  }
  applyOwnDateFilter(project);
}

// ---------- Multi-select campaign filter ----------
// A section carries one multi-select per filter slot. Most have a single one
// (the campaign); the budget sections filter by Campaign Name and, inside it,
// by the campaign itself, so they have two.
function filterSlots(project){
  const slots = [{
    key:'main', stateKey:'campaigns', suffix:'',
    unit: project.filterUnit || 'کمپین',
    allLabel: project.filterAllLabel || 'همه کمپین‌ها',
    options: () => project.campaignOptions || []
  }];
  if(project.kind === 'budget'){
    slots.push({
      key:'sub', stateKey:'subCampaigns', suffix:'2',
      unit:'کمپین', allLabel:'همه کمپین‌ها',
      options: () => project.subCampaignOptions || []
    });
  }
  return slots;
}
function slotState(project, slot){ return projectState[project.id][slot.stateKey]; }

function campaignButtonLabel(project, slot){
  const sel = slotState(project, slot);
  const opts = slot.options();
  if(sel === 'ALL' || sel.size === opts.length) return slot.allLabel;
  if(sel.size === 0) return 'هیچ‌کدوم';
  if(sel.size === 1){
    const only = opts.find(o=>sel.has(o.key));
    return only ? only.label : `۱ ${slot.unit}`;
  }
  return `${sel.size} ${slot.unit} انتخاب شده`;
}
// Campaign names are typed in two alphabets and two sets of digits, so a
// search compares them flattened: Latin digits, lowercase, and the Arabic
// letters that stand in for Persian ones folded together.
function searchKey(str){
  return latinizeDigits(String(str == null ? '' : str))
    .toLowerCase()
    .replace(/[\u064A\u0649]/g, '\u06CC')   // ي / ى -> ی
    .replace(/\u0643/g, '\u06A9')           // ك -> ک
    .replace(/[\u200c\u200f\u200e]/g, ' ')  // zero-width and direction marks
    .trim();
}
// Typing in one panel must survive the re-render that every tick causes, so
// the query lives next to the selection rather than in the DOM.
function slotQuery(project, slot){
  const st = projectState[project.id];
  if(!st.search) st.search = {};
  return st.search[slot.key] || '';
}
// The options the current query leaves on screen — every option when the
// search box is empty.
function slotMatches(project, slot){
  const q = searchKey(slotQuery(project, slot));
  const opts = slot.options();
  if(!q) return opts;
  return opts.filter(o => searchKey(o.label + ' ' + o.key).includes(q));
}
function applySlotSearch(project, slot){
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!panel) return;
  const q = searchKey(slotQuery(project, slot));
  let shown = 0;
  panel.querySelectorAll('.ms-option[data-search]').forEach(row=>{
    const hit = !q || row.dataset.search.includes(q);
    row.hidden = !hit;
    if(hit) shown++;
  });
  const empty = panel.querySelector('.ms-empty');
  if(empty) empty.hidden = shown > 0;

  // While a search is on, the top row means "all the matches", not "all the
  // campaigns" — so it says so, and its tick follows only what's on screen.
  const matches = slotMatches(project, slot);
  const sel = slotState(project, slot);
  const isPicked = key => sel === 'ALL' || sel.has(key);
  const allCb = document.getElementById(`msAll${slot.suffix}-${project.id}`);
  const allLabel = document.getElementById(`msAllLabel${slot.suffix}-${project.id}`);
  if(allCb){
    const picked = matches.filter(o=>isPicked(o.key)).length;
    allCb.checked = matches.length > 0 && picked === matches.length;
    allCb.indeterminate = picked > 0 && picked < matches.length;
    allCb.disabled = matches.length === 0;
  }
  if(allLabel){
    allLabel.textContent = q
      ? `همه‌ی ${fmtNum(matches.length)} نتیجه‌ی «${slotQuery(project, slot).trim()}»`
      : slot.allLabel;
  }
}

function renderCampaignDropdown(project, slot){
  if(!slot) return filterSlots(project).forEach(sl=>renderCampaignDropdown(project, sl));
  const opts = slot.options();
  const sel = slotState(project, slot);
  const allSelected = sel === 'ALL' || sel.size === opts.length;
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!panel) return;
  const searchId = `msSearch${slot.suffix}-${project.id}`;
  const hadFocus = document.activeElement && document.activeElement.id === searchId;
  panel.innerHTML = `
    <div class="ms-search-wrap">
      <input type="search" class="ms-search" id="${searchId}" placeholder="جست‌وجوی ${escapeHtml(slot.unit)}…"
             value="${escapeHtml(slotQuery(project, slot))}" autocomplete="off">
    </div>
    <label class="ms-option ms-option-all">
      <input type="checkbox" id="msAll${slot.suffix}-${project.id}" ${allSelected?'checked':''}>
      <span id="msAllLabel${slot.suffix}-${project.id}">${escapeHtml(slot.allLabel)}</span>
    </label>
    <div class="ms-divider"></div>
    ${opts.map(o=>`
      <label class="ms-option" data-search="${escapeHtml(searchKey(o.label + ' ' + o.key))}">
        <input type="checkbox" class="ms-item${slot.suffix}-${project.id}" value="${escapeHtml(o.key)}" ${allSelected || (sel!=='ALL' && sel.has(o.key)) ? 'checked':''}>
        <span class="ms-option-label">${escapeHtml(o.label)}</span>
        <span class="ms-option-cost">${fmtMoney(o.cost)}</span>
      </label>`).join('')}
    <div class="ms-empty" hidden>چیزی پیدا نشد</div>
  `;
  document.getElementById(`msToggle${slot.suffix}-${project.id}`).textContent = campaignButtonLabel(project, slot) + ' ▾';

  const search = document.getElementById(searchId);
  search.addEventListener('input', ()=>{
    projectState[project.id].search[slot.key] = search.value;
    applySlotSearch(project, slot);
  });
  // Escape clears the query rather than closing the panel mid-typing.
  search.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      e.stopPropagation();
      search.value = '';
      projectState[project.id].search[slot.key] = '';
      applySlotSearch(project, slot);
    }
  });
  applySlotSearch(project, slot);
  if(hadFocus){
    search.focus();
    const end = search.value.length;
    try{ search.setSelectionRange(end, end); }catch(err){ /* type=search may refuse */ }
  }

  const allCb = document.getElementById(`msAll${slot.suffix}-${project.id}`);
  allCb.addEventListener('change', ()=>{
    const q = searchKey(slotQuery(project, slot));
    if(!q){
      projectState[project.id][slot.stateKey] = allCb.checked ? 'ALL' : new Set();
    } else {
      // With a search on, this row is about the matches: ticking it shows
      // exactly the campaigns containing the query, unticking drops them and
      // leaves anything picked outside the search alone.
      const matchKeys = slotMatches(project, slot).map(o=>o.key);
      let cur;
      if(allCb.checked){
        cur = new Set(matchKeys);
      } else {
        cur = slotState(project, slot);
        cur = cur === 'ALL' ? new Set(opts.map(o=>o.key)) : new Set(cur);
        matchKeys.forEach(k=>cur.delete(k));
      }
      projectState[project.id][slot.stateKey] = cur.size === opts.length ? 'ALL' : cur;
    }
    renderCampaignDropdown(project, slot);
    updateSection(project);
  });
  panel.querySelectorAll(`.ms-item${slot.suffix}-${project.id}`).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      let cur = projectState[project.id][slot.stateKey];
      if(cur === 'ALL') cur = new Set(opts.map(o=>o.key));
      if(cb.checked) cur.add(cb.value); else cur.delete(cb.value);
      if(cur.size === opts.length) cur = 'ALL';
      projectState[project.id][slot.stateKey] = cur;
      renderCampaignDropdown(project, slot);
      updateSection(project);
    });
  });
}
function wireCampaignToggle(project, slot){
  if(!slot) return filterSlots(project).forEach(sl=>wireCampaignToggle(project, sl));
  const toggle = document.getElementById(`msToggle${slot.suffix}-${project.id}`);
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!toggle || !panel) return;
  toggle.addEventListener('click', (e)=>{
    e.stopPropagation();
    const isOpen = !panel.hidden;
    document.querySelectorAll('.ms-panel').forEach(p=>p.hidden = true);
    panel.hidden = isOpen;
    if(!panel.hidden){
      const search = document.getElementById(`msSearch${slot.suffix}-${project.id}`);
      if(search) search.focus();
    }
  });
  panel.addEventListener('click', e=>e.stopPropagation());
}

// A campaign name printed in a table doubles as a filter: clicking it narrows
// the section to that campaign, clicking the selected one again clears it.
function filterableName(project, slotKey, key, label){
  const slot = filterSlots(project).find(s=>s.key===slotKey);
  const sel = slot ? slotState(project, slot) : 'ALL';
  const isOnly = sel !== 'ALL' && sel.size === 1 && sel.has(key);
  return `<button type="button" class="filter-name${isOnly?' active':''}"
    data-project="${escapeHtml(project.id)}" data-slot="${escapeHtml(slotKey)}" data-key="${escapeHtml(key)}"
    title="${isOnly ? 'کلیک کن تا فیلتر برداشته بشه' : 'کلیک کن تا داشبورد روی همین فیلتر بشه'}"
    >${escapeHtml(label)}</button>`;
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-name');
  if(!btn) return;
  const project = PROJECTS.find(p=>p.id === btn.dataset.project);
  if(!project) return;
  const slot = filterSlots(project).find(s=>s.key === btn.dataset.slot);
  if(!slot) return;
  const sel = slotState(project, slot);
  const isOnly = sel !== 'ALL' && sel.size === 1 && sel.has(btn.dataset.key);
  projectState[project.id][slot.stateKey] = isOnly ? 'ALL' : new Set([btn.dataset.key]);
  renderCampaignDropdown(project, slot);
  updateSection(project);
});
document.addEventListener('click', ()=>{
  document.querySelectorAll('.ms-panel').forEach(p=>p.hidden = true);
});

       + `--accent-soft:${t.accentSoft}; --accent-grad:${grad};`;

      document.getElementById(`ownPreset7-${p.id}`).addEventListener('click', e=>setOwnPreset(p, 7, e.target));
      document.getElementById(`ownPreset30-${p.id}`).addEventListener('click', e=>setOwnPreset(p, 30, e.target));
      // Default: last {defaultRangeDays} days
      setOwnPreset(p, p.defaultRangeDays || 30, document.getElementById(`ownPreset30-${p.id}`));
    }
  });
}

function pivotByDateCampaign(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {};
    if(!map[r.date][r.campaign]) map[r.date][r.campaign] = {cost:0, conversion:0, label:r.campaignLabel};
    map[r.date][r.campaign].cost += r.cost;
    map[r.date][r.campaign].conversion += r.conversion;
  });
  return map;
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stdev(arr, m){
  if(arr.length < 2) return 0;
  const v = arr.reduce((a,b)=>a+Math.pow(b-m,2),0)/arr.length;
  return Math.sqrt(v);
}

// For each day, is the day-over-day cost change large enough (relative to this
// section's own normal day-to-day noise) to be worth explaining? If so, find
// which single campaign's own cost delta best explains the total delta.
// Only compares the most recent available day against the one before it (not
// the whole range), and lists every campaign that contributed to the change
// in spend, ranked by the size of its own contribution.
function computeLatestCostBreakdown(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = pivot[d], yesterday = pivot[prevD];
  const totalToday = Object.values(today).reduce((s,c)=>s+c.cost,0);
  const totalYesterday = Object.values(yesterday).reduce((s,c)=>s+c.cost,0);
  const totalDelta = totalToday - totalYesterday;
  const pctChange = totalYesterday>0 ? (totalDelta/totalYesterday*100) : null;

  const allKeys = new Set([...Object.keys(today), ...Object.keys(yesterday)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = today[k] ? today[k].cost : 0;
    const c0 = yesterday[k] ? yesterday[k].cost : 0;
    const delta = c1-c0;
    if(Math.abs(delta) < 1) return; // ignore true zero / rounding noise
    contributions.push({
      campaign: (today[k]||yesterday[k]).label,
      delta, todayCost:c1, yesterdayCost:c0,
      share: totalDelta!==0 ? (delta/totalDelta*100) : 0
    });
  });
  contributions.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {date:d, prevDate:prevD, totalToday, totalYesterday, totalDelta, pctChange, contributions};
}

// Same idea for CPA, but attribution uses a leave-one-out counterfactual: "if
// only this campaign's cost/conversion had stayed at yesterday's level, what
// would today's overall CPA have been?" The campaign whose reversal moves CPA
// the most is the one driving the change.
// Only compares the most recent available day's CPA against the day before —
// not the whole range. Only reports a cause if that change is clearly bigger
// than this section's normal day-to-day CPA noise; otherwise says so plainly.
// Attribution uses leave-one-out: "if only this campaign's cost/conversion
// had stayed at yesterday's level, what would today's CPA have been?" — the
// gap between that counterfactual and today's real CPA is the campaign's
// contribution, and only the main contributor(s) (~80% of the shift) are shown.
function computeLatestCpaChange(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const dayAgg = d => {
    const cost = Object.values(pivot[d]).reduce((s,c)=>s+c.cost,0);
    const conv = Object.values(pivot[d]).reduce((s,c)=>s+c.conversion,0);
    return {cost, conv, cpa: conv>0 ? cost/conv : null};
  };
  const totals = dates.map(d=>({date:d, ...dayAgg(d)}));

  const cpaChanges = [];
  for(let i=1;i<totals.length;i++){
    if(totals[i-1].cpa!==null && totals[i].cpa!==null) cpaChanges.push((totals[i].cpa-totals[i-1].cpa)/totals[i-1].cpa*100);
  }
  const m = mean(cpaChanges), sd = stdev(cpaChanges, m);

  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = totals[totals.length-1], yesterday = totals[totals.length-2];
  if(today.cpa===null || yesterday.cpa===null) return {date:d, prevDate:prevD, significant:false, pctChange:null};

  const pctChange = (today.cpa-yesterday.cpa)/yesterday.cpa*100;
  const zLike = sd>0 ? Math.abs(pctChange-m)/sd : (Math.abs(pctChange)>=25 ? 2 : 0);
  const significant = zLike >= 1.5 && Math.abs(pctChange) >= 10;

  const base = {date:d, prevDate:prevD, pctChange, todayCpa:today.cpa, yesterdayCpa:yesterday.cpa, significant};
  if(!significant) return base;

  const todayC = pivot[d], yesterdayC = pivot[prevD];
  const allKeys = new Set([...Object.keys(todayC), ...Object.keys(yesterdayC)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = todayC[k] ? todayC[k].cost : 0;
    const v1 = todayC[k] ? todayC[k].conversion : 0;
    const c0 = yesterdayC[k] ? yesterdayC[k].cost : 0;
    const v0 = yesterdayC[k] ? yesterdayC[k].conversion : 0;
    const cfCost = today.cost - c1 + c0;
    const cfConv = today.conv - v1 + v0;
    if(cfConv<=0) return;
    const contribution = today.cpa - (cfCost/cfConv);
    if(Math.abs(contribution) < 1) return;
    contributions.push({campaign:(todayC[k]||yesterdayC[k]).label, contribution});
  });
  contributions.sort((a,b)=>Math.abs(b.contribution)-Math.abs(a.contribution));

  const totalAbs = contributions.reduce((s,c)=>s+Math.abs(c.contribution),0);
  const target = totalAbs*0.8;
  const main = [];
  let cum = 0;
  for(const c of contributions){ main.push(c); cum += Math.abs(c.contribution); if(cum>=target || main.length>=3) break; }

  base.contributors = main;
  return base;
}

// CPA per Adgroup and per Creative.
//
// Cost is only known per Date + Campaign, and installs are what the money
// actually buys, so the campaign is priced per install over the selected range:
//
//   cost per install = campaign cost / campaign installs
//   segment cost     = segment installs x cost per install
//   segment CPA      = segment cost / segment conversions
//
// Installs and conversions are the sheet's real numbers; only the cost is
// apportioned, and since a campaign's segment installs add back up to its own
// installs, each table accounts for exactly that campaign's spend. Adgroups and
// Creatives are priced independently of each other.
//
// A campaign with no installs in the range can't be priced this way at all, so
// its rows are left out rather than guessed at.
const SEG_MIN_INSTALLS = 5;           // an absolute floor for a meaningful CPA
const SEG_MIN_INSTALL_SHARE = 0.001; // and at least 0.1% of the section's installs
function computeSegmentCpa(project, joined, keyFn){
  const st = projectState[project.id];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const refRows = project.rawRef.filter(r=>inRange(r.date) && inCampaign(r.campaign));
  if(!refRows.length) return null;

  // Per campaign over the whole range: what the sheet spent, and what it bought.
  const byCampaign = {};
  joined.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] || {cost:0, installs:0, label:r.campaignLabel || r.campaign};
    c.cost += r.cost;
  });
  refRows.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] || {cost:0, installs:0, label:r.campaignLabel || r.campaign};
    c.installs += r.installs;
  });

  const segments = {};
  let pricedInstalls = 0, unpricedCampaigns = 0;
  Object.entries(byCampaign).forEach(([key, c])=>{
    if(c.installs <= 0){ if(c.cost > 0) unpricedCampaigns++; return; }
    const costPerInstall = c.cost / c.installs;
    refRows.filter(r=>r.campaign===key).forEach(r=>{
      const segKey = key + '||' + keyFn(r);
      const seg = segments[segKey] = segments[segKey] ||
        {label: keyFn(r), campaign: c.label, cost:0, conversion:0, installs:0, costPerInstall};
      seg.installs += r.installs;
      seg.conversion += r.conversion;
      seg.cost += r.installs * costPerInstall;
    });
    pricedInstalls += c.installs;
  });

  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const benchmark = totalConversion>0 ? totalCost/totalConversion : null;

  const minInstalls = Math.max(SEG_MIN_INSTALLS, pricedInstalls*SEG_MIN_INSTALL_SHARE);
  const rows = Object.values(segments).map(seg=>({
    ...seg,
    cpa: seg.conversion>0 ? seg.cost/seg.conversion : null,
    installShare: pricedInstalls>0 ? seg.installs/pricedInstalls*100 : 0,
    vsBenchmark: (benchmark && seg.conversion>0) ? ((seg.cost/seg.conversion)-benchmark)/benchmark*100 : null
  }));

  // Enough install volume for a CPA to mean something. "Spent and never
  // converted" leads the table, so it needs twice that volume behind it.
  const hasVolume = r => r.installs >= (r.conversion>0 ? minInstalls : minInstalls*2);
  // Everything costing more than the section's own average, most expensive
  // first; a segment that spent without converting has no CPA to compare and
  // belongs at the top. The rest are counted, not listed.
  const withVolume = rows.filter(hasVolume);
  const aboveAverage = withVolume.filter(r => r.cpa === null || (benchmark !== null && r.cpa > benchmark))
    .sort((a,b)=>{
      if(a.cpa===null && b.cpa===null) return b.cost - a.cost;
      if(a.cpa===null) return -1;
      if(b.cpa===null) return 1;
      return b.cpa - a.cpa;
    });

  return {rows: aboveAverage, benchmark, totalCost, minInstalls, unpricedCampaigns,
          candidateCount: rows.length, belowAverageCount: withVolume.length - aboveAverage.length};
}

// Ad group and creative names are long ids people paste into the panel, and
// selecting one by hand inside a scrolling table is fiddly — so clicking the
// name copies it whole.
function copyableName(name, copyValue){
  const value = (copyValue === undefined || copyValue === '') ? name : copyValue;
  const title = value === name ? 'کلیک کن تا کپی بشه' : `کلیک کن تا «${value}» کپی بشه`;
  return `<button type="button" class="copy-name" data-copy="${escapeHtml(value)}" title="${escapeHtml(title)}">${escapeHtml(name)}</button>`;
}
// What people actually paste into the panel for a creative is the number
// inside its name (yn_mob_646179 -> 646179), so that's what a creative name
// copies. Names with no digits at all — the Cafe Bazaar creatives are plain
// Persian words — copy whole, since there's no number to pick out.
function creativeCopyValue(name){
  const runs = String(name == null ? '' : name).match(/\d+/g);
  if(!runs) return name;
  return runs.reduce((best, r) => r.length >= best.length ? r : best, '');
}
function flashCopied(btn){
  btn.classList.add('copied');
  setTimeout(()=>btn.classList.remove('copied'), 1200);
}
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.copy-name');
  if(!btn) return;
  const text = btn.getAttribute('data-copy') || '';
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      // http://localhost and older browsers don't get the async clipboard
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    flashCopied(btn);
  }catch(err){
    console.error('copy failed', err);
    btn.classList.add('copy-failed');
    setTimeout(()=>btn.classList.remove('copy-failed'), 1200);
  }
});

function computeCampaignCpaTable(project, joined){
  if(!joined.length) return null;
  const dates = Array.from(new Set(joined.map(r=>r.date))).sort();
  const recentWindow = Math.min(7, dates.length);
  const recentFrom = dates[dates.length - recentWindow];

  const byCampaign = {};
  joined.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] ||
      {label: r.campaignLabel || r.campaign, cost:0, conversion:0, days:new Set(), recentCost:0, recentConversion:0};
    c.cost += r.cost;
    c.conversion += r.conversion;
    if(r.cost > 0) c.days.add(r.date);
    if(r.date >= recentFrom){ c.recentCost += r.cost; c.recentConversion += r.conversion; }
  });

  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const benchmark = totalConversion>0 ? totalCost/totalConversion : null;

  const rows = Object.entries(byCampaign).map(([key,c])=>{
    const cpa = c.conversion>0 ? c.cost/c.conversion : null;
    return {
      key, label:c.label, cost:c.cost, conversion:c.conversion, activeDays:c.days.size,
      share: totalCost>0 ? c.cost/totalCost*100 : 0,
      cpa,
      recentCpa: c.recentConversion>0 ? c.recentCost/c.recentConversion : null,
      recentCost: c.recentCost,
      vsBenchmark: (benchmark && cpa!==null) ? (cpa-benchmark)/benchmark*100 : null
    };
  }).filter(r=>r.cost>0 || r.conversion>0);
  rows.sort((a,b)=>b.cost-a.cost);

  return {rows, totalCost, totalConversion, benchmark, recentWindow,
          dayCount:dates.length, from:dates[0], to:dates[dates.length-1]};
}

function renderCostDrivers(project, joined){
  const b = computeLatestCostBreakdown(joined);
  const el = document.getElementById(`costDrivers-${project.id}`);
  if(!el) return;
  if(!b){ el.innerHTML = `<div class="deep-empty">برای مقایسه‌ی آخرین روز با روز قبلش، حداقل ۲ روز داده لازمه.</div>`; return; }
  const headline = `
    <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
      <span class="di-tag ${b.totalDelta>=0?'good':'bad'}">${b.totalDelta>=0?'▲':'▼'} ${b.pctChange!==null?Math.abs(b.pctChange).toFixed(0)+'٪':'—'}</span>
      <span class="di-date">${fmtDateLabel(b.prevDate)} ← ${fmtDateLabel(b.date)}</span><br>
      هزینه از <b>${fmtMoney(b.totalYesterday)}</b> به <b>${fmtMoney(b.totalToday)}</b> ${b.totalDelta>=0?'رسیده (افزایش':'رسیده (کاهش'} ${fmtMoney(Math.abs(b.totalDelta))})
    </div>`;
  if(!b.contributions.length){
    el.innerHTML = headline + `<div class="deep-empty">هیچ کمپینی تغییر هزینه‌ی قابل‌ثبتی نداشته.</div>`;
    return;
  }
  // Only surface the main driver(s): keep adding the next-largest contributor
  // until they cumulatively explain ~80% of the total change, capped at 3 —
  // this is "the main factor(s)", not an exhaustive list of every campaign.
  const targetAbs = Math.abs(b.totalDelta) * 0.8;
  const mainContributors = [];
  let cum = 0;
  for(const c of b.contributions){
    mainContributors.push(c);
    cum += Math.abs(c.delta);
    if(cum >= targetAbs || mainContributors.length >= 3) break;
  }
  const rows = mainContributors.map(c=>`
    <li class="deep-item">
      <span class="di-tag ${c.delta>=0?'good':'bad'}">${c.delta>=0?'+':''}${fmtMoney(c.delta)}</span>
      <b>${escapeHtml(c.campaign)}</b>
      <span class="di-date">${fmtMoney(c.yesterdayCost)} ← ${fmtMoney(c.todayCost)}</span>

function computeSessionGapDrivers(project){
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const byCampaign = {};
  const bucket = (key, label) => {
    if(!byCampaign[key]) byCampaign[key] = {label: label || key, own:0, other:0};
    return byCampaign[key];
  };
  (project.allRef||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.campaign, r.campaignLabel).own += r.installs; });
  (project.rawCompare||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.campaign, r.campaign).other += r.sessions; });

  const entries = Object.entries(byCampaign);
  if(!entries.length) return null;
  const totalOwn = entries.reduce((s,[,v])=>s+v.own,0);
  const totalOther = entries.reduce((s,[,v])=>s+v.other,0);
  const totalGap = totalOwn - totalOther;
  const overallPct = totalOther>0 ? (totalGap/totalOther*100) : null;

  const drivers = entries.map(([key,v])=>({
    key, label:v.label, own:v.own, other:v.other,
    gap: v.own - v.other,
    // Percentage points of the overall gap that this campaign is responsible for.
    contributionPct: totalOther>0 ? ((v.own - v.other)/totalOther*100) : null,
    // Share of the net gap, so "this one campaign is most of it" reads clearly.
    share: totalGap!==0 ? ((v.own - v.other)/totalGap*100) : 0,
    missingFrom: v.other===0 && v.own>0 ? 'other' : (v.own===0 && v.other>0 ? 'own' : null)
  })).filter(d=>d.gap !== 0);
  drivers.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));

  // Keep the campaigns that make up the bulk (~90%) of the total movement.
  const totalAbs = drivers.reduce((s,d)=>s+Math.abs(d.gap),0);
  const main = [];
  let cum = 0;
  for(const d of drivers){
    main.push(d);
    cum += Math.abs(d.gap);
    if(totalAbs>0 && cum/totalAbs >= 0.9) break;
    if(main.length >= 6) break;
  }
  return {totalOwn, totalOther, totalGap, overallPct, drivers: main, driverCount: drivers.length};
}

function renderSessionGaps(project){
  const el = document.getElementById(`sessionGaps-${project.id}`);
  if(!el) return;
  const cfg = project.sessionsCompare;

  if(!r){ el.innerHTML = `<div class="deep-empty">توی این بازه دیتایی برای مقایسه نیست.</div>`; return; }
  if(r.overallPct===null){ el.innerHTML = `<div class="deep-empty">توی این بازه ${escapeHtml(cfg.otherLabel)} سشنی ثبت نکرده، پس درصد اختلاف قابل محاسبه نیست.</div>`; return; }

  const headline = `
    <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
      <span class="di-tag ${r.overallPct>=0?'bad':'good'}">${r.overallPct>=0?'▲':'▼'} ${Math.abs(r.overallPct).toFixed(1)}٪</span>

    return;
  }

  const rows = r.drivers.map(d=>{
    const note = d.missingFrom === 'other' ? ` <span class="di-date">(توی ${escapeHtml(cfg.otherLabel)} با این اسم نیست)</span>`

    return `

  el.innerHTML = headline

}

// What this section's numbers are built on: how much of the cost sheet found
// a conversion row, and every row the normalizers had to drop.
// Every chart reads its neutrals from here, so the page has one chart ink.
const CHART_INK = {
  grid:'#EAEEF5', tick:'#6B7280', tooltipBg:'#FFFFFF', tooltipBorder:'#DFE5EE',
  tooltipTitle:'#111827', tooltipBody:'#5A6577', pointRing:'#FFFFFF'
};
// Columns take a soft vertical wash of the brand color — or the brand's own
// gradient where it has one. Falls back to a flat fill before the canvas has
// been laid out.
function barFill(ctx, theme, alpha){
  const area = ctx.chartArea;
  const hi = theme.grad ? theme.grad[1] : theme.accent;
  const lo = theme.grad ? theme.grad[0] : theme.accent;
  if(!area) return hexToRgba(lo, alpha);
  const g = ctx.ctx.createLinearGradient(0, area.bottom, 0, area.top);
  g.addColorStop(0, hexToRgba(lo, alpha));
  g.addColorStop(1, hexToRgba(hi, Math.min(1, alpha + 0.22)));
  return g;
}

function renderCoverageNote(project, joined, matchedCost, totalCostInSheet, totalCost){
  const matchPct = totalCostInSheet>0 ? Math.round(matchedCost/totalCostInSheet*100) : 0;
  if(!project.minDate || !project.maxDate){
    document.getElementById(`coverageNote-${project.id}`).innerHTML =
      'توی شیت‌های این بخش ردیفی پیدا نشد که با فیلتر کمپین‌هاش بخونه — اسم شیت و فیلتر کمپین رو چک کن.';
  }
  const d = project.diag || {};
  // With includeUnmatchedCost the whole sheet's cost is already in the numbers,
  // so "coverage" would read as if something were missing — say what it means.
  const notes = [project.includeUnmatchedCost
    ? `کل هزینه‌ی شیت لحاظ شده: <b>${fmtMoney(totalCost)}</b> — ${matchPct}٪ از این هزینه به ردیف‌های ${escapeHtml(project.conversionLabel)} مچ شد`
    : `پوشش join: <b>${matchPct}%</b> هزینه (${fmtMoney(matchedCost)} از ${fmtMoney(totalCostInSheet)} تطبیق یافت)`];
  if(d.excludedCost > 0) notes.push(`${fmtMoney(d.excludedCost)} هزینه‌ی کمپین‌های خارج از فیلتر این پروژه (کل بازه‌ی شیت)`);
  if(d.skippedRows > 0) notes.push(`<b>${fmtNum(d.skippedRows)}</b> ردیف بدون Date یا Campaign نادیده گرفته شد (${fmtMoney(d.skippedCost)})`);
  if(d.unreadableCost > 0) notes.push(`<b>${fmtNum(d.unreadableCost)}</b> سلول Cost با فرمت غیرقابل‌خوندن`);
  if(d.futureRows > 0) notes.push(`<b>${fmtNum(d.futureRows)}</b> ردیف با تاریخ آینده نادیده گرفته شد`);
  if(d.refNoCostCampaign > 0) notes.push(`<b>${fmtNum(d.refNoCostCampaign)}</b> ردیف کانورژن کنار گذاشته شد چون کمپینش توی شیت هزینه نیست`);
  // Cost in the range with nothing to join it to reads as an empty section;
  // say which side ran out and when, instead of showing zeroes.
  if(!joined.length && totalCostInSheet > 0){
    const lastRef = (project.rawRef||[]).reduce((m,r)=> r.date > m ? r.date : m, '');
    notes.push(`<b>توی این بازه هیچ ردیف ${escapeHtml(project.conversionLabel)} وجود نداره</b>` +
      (lastRef ? ` — آخرین روزی که شیت مرجع دیتا داره: ${fmtDateLabel(lastRef)}` : ''));
  }
  document.getElementById(`coverageNote-${project.id}`).innerHTML = notes.join(' — ');
}

// ---------- CPI sections (cost and cost per install only) ----------
// A campaign group is either everything, or the campaigns whose name starts
// with a prefix (inapp- for in-app, cb- for Cafe Bazaar).
function cpiGroupFilter(group){
  return group.prefix ? (key => key.startsWith(group.prefix)) : (() => true);
}

// Cost lives on the campaign, never on the creative, so a creative's cost is
// its share of that day's campaign installs. Two creatives of one campaign
// therefore differ only by the days and campaigns they ran on — a creative
// that kept running on the expensive days ends up with the higher CPI.
function computeCreativeCpi(project, group, keyFn){
  const st = projectState[project.id];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const inGroup = cpiGroupFilter(group);
  const keep = r => inRange(r.date) && inCampaign(r.campaign) && inGroup(r.campaign);

  const refRows = project.rawRef.filter(keep);
  if(!refRows.length) return null;

  const costByDay = {};
  project.rawCost.filter(keep).forEach(r=>{
    const key = r.date + '||' + r.campaign;
    costByDay[key] = (costByDay[key] || 0) + r.cost;
  });
  const installsByDay = {};
  refRows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    installsByDay[key] = (installsByDay[key] || 0) + r.installs;
  });

  const segments = {};
  let pricedInstalls = 0, unpricedInstalls = 0;
  refRows.forEach(r=>{
    const label = keyFn(r);
    const key = r.date + '||' + r.campaign;
    const dayInstalls = installsByDay[key];
    const seg = segments[label] = segments[label] ||
      {label, installs:0, cost:0, campaigns:new Set()};
    seg.installs += r.installs;
    seg.campaigns.add(r.campaignLabel || r.campaign);
    if(dayInstalls > 0){
      seg.cost += (costByDay[key] || 0) * (r.installs / dayInstalls);
      pricedInstalls += r.installs;
    } else {
      unpricedInstalls += r.installs;
    }
  });

  const totalCost = Object.values(costByDay).reduce((a,b)=>a+b, 0);
  const totalInstalls = Object.values(installsByDay).reduce((a,b)=>a+b, 0);
  const benchmark = totalInstalls > 0 ? totalCost/totalInstalls : null;

  const all = Object.values(segments);
  const rows = all.filter(seg=>seg.installs > 0).map(seg=>({
    label: seg.label,
    campaigns: Array.from(seg.campaigns),
    installs: seg.installs,
    cost: seg.cost,
    cpi: seg.installs>0 ? seg.cost/seg.installs : null,
    installShare: totalInstalls>0 ? seg.installs/totalInstalls*100 : 0,
    vsBenchmark: benchmark ? ((seg.cost/seg.installs)-benchmark)/benchmark*100 : null
  })).sort((a,b)=>b.cost - a.cost);

  return {rows, benchmark, totalCost, totalInstalls, unpricedInstalls,
          noInstallCount: all.length - rows.length};
}

// A dimension tab totalled over the section's date range: the dimension and
// its metric, biggest first. Nothing is attributed or derived here — these are
// the sheet's own numbers added up, which is why the table can stay this bare.
function computeDimensionTable(project, index){
  const rows = (project.rawDims || [])[index] || [];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const byLabel = {};
  let total = 0, days = new Set();
  rows.filter(r=>inRange(r.date)).forEach(r=>{
    byLabel[r.label] = (byLabel[r.label] || 0) + r.value;
    total += r.value;
    days.add(r.date);
  });
  const out = Object.entries(byLabel).map(([label, value])=>({label, value}))
    .sort((a,b)=> b.value - a.value || a.label.localeCompare(b.label));
  return {rows: out, total, dayCount: days.size, hasData: rows.length > 0};
}

}
