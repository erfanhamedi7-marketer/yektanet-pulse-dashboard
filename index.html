function pivotByDateCampaign(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {};
    if(!map[r.date][r.campaign]) map[r.date][r.campaign] = {cost:0, conversion:0, label:r.campaignLabel};
    map[r.date][r.campaign].cost += r.cost;
    map[r.date][r.campaign].conversion += r.conversion;
  });
  return map;
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stdev(arr, m){
  if(arr.length < 2) return 0;
  const v = arr.reduce((a,b)=>a+Math.pow(b-m,2),0)/arr.length;
  return Math.sqrt(v);
}

// For each day, is the day-over-day cost change large enough (relative to this
// section's own normal day-to-day noise) to be worth explaining? If so, find
// which single campaign's own cost delta best explains the total delta.
// Only compares the most recent available day against the one before it (not
// the whole range), and lists every campaign that contributed to the change
// in spend, ranked by the size of its own contribution.
function computeLatestCostBreakdown(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = pivot[d], yesterday = pivot[prevD];
  const totalToday = Object.values(today).reduce((s,c)=>s+c.cost,0);
  const totalYesterday = Object.values(yesterday).reduce((s,c)=>s+c.cost,0);
  const totalDelta = totalToday - totalYesterday;
  const pctChange = totalYesterday>0 ? (totalDelta/totalYesterday*100) : null;

  const allKeys = new Set([...Object.keys(today), ...Object.keys(yesterday)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = today[k] ? today[k].cost : 0;
    const c0 = yesterday[k] ? yesterday[k].cost : 0;
    const delta = c1-c0;
    if(Math.abs(delta) < 1) return; // ignore true zero / rounding noise
    contributions.push({
      campaign: (today[k]||yesterday[k]).label,
      delta, todayCost:c1, yesterdayCost:c0,
      share: totalDelta!==0 ? (delta/totalDelta*100) : 0
    });
  });
  contributions.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {date:d, prevDate:prevD, totalToday, totalYesterday, totalDelta, pctChange, contributions};
}

// Same idea for CPA, but attribution uses a leave-one-out counterfactual: "if
// only this campaign's cost/conversion had stayed at yesterday's level, what
// would today's overall CPA have been?" The campaign whose reversal moves CPA
// the most is the one driving the change.
// Only compares the most recent available day's CPA against the day before —
// not the whole range. Only reports a cause if that change is clearly bigger
// than this section's normal day-to-day CPA noise; otherwise says so plainly.
// Attribution uses leave-one-out: "if only this campaign's cost/conversion
// had stayed at yesterday's level, what would today's CPA have been?" — the
// gap between that counterfactual and today's real CPA is the campaign's
// contribution, and only the main contributor(s) (~80% of the shift) are shown.
function computeLatestCpaChange(joined){
  const pivot = pivotByDateCampaign(joined);
  const dates = Object.keys(pivot).sort();
  if(dates.length < 2) return null;
  const dayAgg = d => {
    const cost = Object.values(pivot[d]).reduce((s,c)=>s+c.cost,0);
    const conv = Object.values(pivot[d]).reduce((s,c)=>s+c.conversion,0);
    return {cost, conv, cpa: conv>0 ? cost/conv : null};
  };
  const totals = dates.map(d=>({date:d, ...dayAgg(d)}));

  const cpaChanges = [];
  for(let i=1;i<totals.length;i++){
    if(totals[i-1].cpa!==null && totals[i].cpa!==null) cpaChanges.push((totals[i].cpa-totals[i-1].cpa)/totals[i-1].cpa*100);
  }
  const m = mean(cpaChanges), sd = stdev(cpaChanges, m);

  const d = dates[dates.length-1], prevD = dates[dates.length-2];
  const today = totals[totals.length-1], yesterday = totals[totals.length-2];
  if(today.cpa===null || yesterday.cpa===null) return {date:d, prevDate:prevD, significant:false, pctChange:null};

  const pctChange = (today.cpa-yesterday.cpa)/yesterday.cpa*100;
  const zLike = sd>0 ? Math.abs(pctChange-m)/sd : (Math.abs(pctChange)>=25 ? 2 : 0);
  const significant = zLike >= 1.5 && Math.abs(pctChange) >= 10;

  const base = {date:d, prevDate:prevD, pctChange, todayCpa:today.cpa, yesterdayCpa:yesterday.cpa, significant};
  if(!significant) return base;

  const todayC = pivot[d], yesterdayC = pivot[prevD];
  const allKeys = new Set([...Object.keys(todayC), ...Object.keys(yesterdayC)]);
  const contributions = [];
  allKeys.forEach(k=>{
    const c1 = todayC[k] ? todayC[k].cost : 0;
    const v1 = todayC[k] ? todayC[k].conversion : 0;
    const c0 = yesterdayC[k] ? yesterdayC[k].cost : 0;
    const v0 = yesterdayC[k] ? yesterdayC[k].conversion : 0;
    const cfCost = today.cost - c1 + c0;
    const cfConv = today.conv - v1 + v0;
    if(cfConv<=0) return;
    const contribution = today.cpa - (cfCost/cfConv);
    if(Math.abs(contribution) < 1) return;
    contributions.push({campaign:(todayC[k]||yesterdayC[k]).label, contribution});
  });
  contributions.sort((a,b)=>Math.abs(b.contribution)-Math.abs(a.contribution));

  const totalAbs = contributions.reduce((s,c)=>s+Math.abs(c.contribution),0);
  const target = totalAbs*0.8;
  const main = [];
  let cum = 0;
  for(const c of contributions){ main.push(c); cum += Math.abs(c.contribution); if(cum>=target || main.length>=3) break; }

  base.contributors = main;
  return base;
}

// CPA per Adgroup and per Creative.
//
// Cost is only known per Date + Campaign, and installs are what the money
// actually buys, so the campaign is priced per install over the selected range:
//
//   cost per install = campaign cost / campaign installs
//   segment cost     = segment installs x cost per install
//   segment CPA      = segment cost / segment conversions
//
// Installs and conversions are the sheet's real numbers; only the cost is
// apportioned, and since a campaign's segment installs add back up to its own
// installs, each table accounts for exactly that campaign's spend. Adgroups and
// Creatives are priced independently of each other.
//
// A campaign with no installs in the range can't be priced this way at all, so
// its rows are left out rather than guessed at.
const SEG_MIN_INSTALLS = 5;           // an absolute floor for a meaningful CPA
const SEG_MIN_INSTALL_SHARE = 0.001; // and at least 0.1% of the section's installs
const SEG_MIN_COST_SHARE = 0.001;    // and of its spend
const SEG_TABLE_ROWS = 25;           // rows shown before "show all"
function computeSegmentCpa(project, joined, keyFn){
  const st = projectState[project.id];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const refRows = project.rawRef.filter(r=>inRange(r.date) && inCampaign(r.campaign)).filter(segKeep(project));
  if(!refRows.length) return null;

  // Per campaign over the whole range: what the sheet spent, and what it bought.
  const byCampaign = {};
  joined.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] || {cost:0, installs:0, label:r.campaignLabel || r.campaign};
    c.cost += r.cost;
  });
  refRows.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] || {cost:0, installs:0, label:r.campaignLabel || r.campaign};
    c.installs += r.installs;
  });

  const segments = {};
  let pricedInstalls = 0, unpricedCampaigns = 0;
  Object.entries(byCampaign).forEach(([key, c])=>{
    if(c.installs <= 0){ if(c.cost > 0) unpricedCampaigns++; return; }
    const costPerInstall = c.cost / c.installs;
    refRows.filter(r=>r.campaign===key).forEach(r=>{
      const segKey = key + '||' + keyFn(r);
      const seg = segments[segKey] = segments[segKey] ||
        {label: keyFn(r), campaign: c.label, campaignKey: key, cost:0, conversion:0, installs:0, costPerInstall};
      seg.installs += r.installs;
      seg.conversion += r.conversion;
      seg.cost += r.installs * costPerInstall;
    });
    pricedInstalls += c.installs;
  });

  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const benchmark = totalConversion>0 ? totalCost/totalConversion : null;

  const minInstalls = Math.max(SEG_MIN_INSTALLS, pricedInstalls*SEG_MIN_INSTALL_SHARE);
  const rows = Object.values(segments).map(seg=>({
    ...seg,
    cpa: seg.conversion>0 ? seg.cost/seg.conversion : null,
    installShare: pricedInstalls>0 ? seg.installs/pricedInstalls*100 : 0,
    vsBenchmark: (benchmark && seg.conversion>0) ? ((seg.cost/seg.conversion)-benchmark)/benchmark*100 : null
  }));

  // Every ad group / creative with enough installs and enough spend behind
  // it for its CPA to mean something — cheap or expensive alike — most
  // expensive first: those that spent without converting lead (biggest spend
  // first), then by CPA, highest first.
  const pricedCost = rows.reduce((t,r)=>t+r.cost, 0);
  const minCost = pricedCost * SEG_MIN_COST_SHARE;
  const significant = rows.filter(r => r.installs >= minInstalls && r.cost >= minCost)
    .sort((a,b)=>{
      if(a.cpa===null && b.cpa===null) return b.cost - a.cost;
      if(a.cpa===null) return -1;
      if(b.cpa===null) return 1;
      return b.cpa - a.cpa;
    });
  return {rows: significant, benchmark, totalCost, minInstalls, minCost, unpricedCampaigns,
          candidateCount: rows.length, smallCount: rows.length - significant.length};

}

// Ad group and creative names are long ids people paste into the panel, and
// selecting one by hand inside a scrolling table is fiddly — so clicking the
// name copies it whole.
function copyableName(name, copyValue){
  const value = (copyValue === undefined || copyValue === '') ? name : copyValue;
  const title = value === name ? 'کلیک کن تا کپی بشه' : `کلیک کن تا «${value}» کپی بشه`;
  return `<button type="button" class="copy-name" data-copy="${escapeHtml(value)}" title="${escapeHtml(title)}">${escapeHtml(name)}</button>`;
}
// Projects that break campaigns down by ad group / creative are the ones where
// a campaign name is also something people paste into the panel.
function copiesCampaigns(project){
  return !!(project.adgroupCol || project.creativeCol);
}
// A small copy button beside a name that already does something else on click
// (the campaign tables' names filter the dashboard).
function copyIcon(value){
  return `<button type="button" class="copy-name copy-icon" data-copy="${escapeHtml(value)}"
    title="${escapeHtml(`کپی «${value}»`)}" aria-label="${escapeHtml(`کپی «${value}»`)}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg></button>`;
}
// What people actually paste into the panel for a creative is the number
// inside its name (yn_mob_646179 -> 646179), so that's what a creative name
// copies. Names with no digits at all — the Cafe Bazaar creatives are plain
// Persian words — copy whole, since there's no number to pick out.
function creativeCopyValue(name){
  const runs = String(name == null ? '' : name).match(/\d+/g);
  if(!runs) return name;
  return runs.reduce((best, r) => r.length >= best.length ? r : best, '');
}
function flashCopied(btn){
  btn.classList.add('copied');
  setTimeout(()=>btn.classList.remove('copied'), 1200);
}
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.copy-name');
  if(!btn) return;
  const text = btn.getAttribute('data-copy') || '';
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      // http://localhost and older browsers don't get the async clipboard
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    flashCopied(btn);
  }catch(err){
    console.error('copy failed', err);
    btn.classList.add('copy-failed');
    setTimeout(()=>btn.classList.remove('copy-failed'), 1200);
  }
});

function computeCampaignCpaTable(project, joined){
  if(!joined.length) return null;
  const dates = Array.from(new Set(joined.map(r=>r.date))).sort();
  const recentWindow = Math.min(7, dates.length);
  const recentFrom = dates[dates.length - recentWindow];

  // Further conversions (Signup…) a project asks to see per campaign. Each is
  // read only from the day its column was first filled in, so its rate and
  // its cost are both measured over the days it was actually tracked.
  const extras = (project.costPerMetrics||[]).filter(m=>m.campaignTable).map(m=>({
    ...m, name: m.label || m.col, since: m.sinceFirst ? extraSinceDate(project, m.col) : null
  }));
  const byCampaign = {};
  joined.forEach(r=>{
    const c = byCampaign[r.campaign] = byCampaign[r.campaign] ||
      {label: r.campaignLabel || r.campaign, cost:0, conversion:0, days:new Set(), recentCost:0, recentConversion:0,
       extra: extras.map(()=>({count:0, cost:0, conversion:0}))};
    c.cost += r.cost;
    c.conversion += r.conversion;
    c.costExtras = addExtras(c.costExtras || {}, r.costExtras);
    if(r.cost > 0) c.days.add(r.date);
    if(r.date >= recentFrom){ c.recentCost += r.cost; c.recentConversion += r.conversion; }
    extras.forEach((m, i)=>{
      if(m.since && r.date < m.since) return;
      const e = c.extra[i];
      e.count += (r.extras && r.extras[m.col]) || 0;
      e.cost += r.cost;
      e.conversion += r.conversion;
    });
  });

  const totalCost = joined.reduce((s,r)=>s+r.cost,0);
  const totalConversion = joined.reduce((s,r)=>s+r.conversion,0);
  const benchmark = totalConversion>0 ? totalCost/totalConversion : null;

  const rows = Object.entries(byCampaign).map(([key,c])=>{
    const cpa = c.conversion>0 ? c.cost/c.conversion : null;
    return {
      key, label:c.label, cost:c.cost, conversion:c.conversion, activeDays:c.days.size,
      share: totalCost>0 ? c.cost/totalCost*100 : 0,
      cpa,
      recentCpa: c.recentConversion>0 ? c.recentCost/c.recentConversion : null,
      recentConversion: c.recentConversion,
      recentCost: c.recentCost,
      vsBenchmark: (benchmark && cpa!==null) ? (cpa-benchmark)/benchmark*100 : null,
      costExtra: (project.costExtraCols||[]).map(m=>{
        const n = (c.costExtras || {})[m.col] || 0;
        return {count: n, per: n > 0 ? c.cost / n : null};
      }),
      extra: c.extra.map(e=>({
        count: e.count, cost: e.cost, conversion: e.conversion,
        rate: e.conversion>0 ? e.count/e.conversion*100 : null,
        per: e.count>0 ? e.cost/e.count : null,
        tracked: e.cost>0 || e.conversion>0
      }))
    };
  }).filter(r=>r.cost>0 || r.conversion>0);
  rows.sort((a,b)=>b.cost-a.cost);

  // A second source's count of the conversion, per campaign, for comparison.
  let cmp = null;
  if(project.compareConversion){
    const byC = {};
    const window = {from: dates[0], to: dates[dates.length-1]};
    cmpConvRows(project, window).forEach(r=>{ byC[r.campaign] = (byC[r.campaign] || 0) + r.value; });
    rows.forEach(r=>{ r.cmp = byC[r.key] || 0; r.cmpDiff = cmpDiffPct(r.conversion, r.cmp); });
    const total = Object.values(byC).reduce((a,b)=>a+b, 0);
    const missing = Object.keys(byC).filter(k=>!byCampaign[k] && byC[k] > 0);
    cmp = {...project.compareConversion, total, diff: cmpDiffPct(totalConversion, total),
           missing: missing.length, missingTotal: missing.reduce((t,k)=>t+byC[k], 0)};
  }
  return {rows, extras, cmp, totalCost, totalConversion, benchmark, recentWindow,
          dayCount:dates.length, from:dates[0], to:dates[dates.length-1]};
}

const CPA_TABLE_MAX_ROWS = 12;
function renderCampaignCpaTable(project, joined, elId){
  const el = document.getElementById(elId || `cpaTable-${project.id}`);
  if(!el) return;
  const t = computeCampaignCpaTable(project, joined);
  if(!t){ el.innerHTML = `<div class="deep-empty">توی این بازه دیتایی نیست.</div>`; return; }
  const label = project.conversionLabel;
  const cpaLabel = project.cpaLabel || 'CPA';

  const head = `
    <div class="deep-subtext intro">
      ${fmtDateLabel(t.from)} تا ${fmtDateLabel(t.to)} (${fmtNum(t.dayCount)} روز) —
      میانگین ${escapeHtml(cpaLabel)} در همین بازه: <b>${t.benchmark!==null?fmtMoney(t.benchmark):'—'}</b>.
      ستون «نسبت به میانگین» اختلاف هر کمپین با همین عدده.
      ${t.cmp ? `<br>${escapeHtml(t.cmp.col)} از ${escapeHtml(t.cmp.source)} کنار ${escapeHtml(t.cmp.col)} ${escapeHtml(t.cmp.ownSource)}؛
        «اختلاف» = (${escapeHtml(t.cmp.source)} − ${escapeHtml(t.cmp.ownSource)}) ÷ ${escapeHtml(t.cmp.ownSource)}.
        کل بازه: ${escapeHtml(t.cmp.ownSource)} <b>${fmtNum(t.totalConversion)}</b>، ${escapeHtml(t.cmp.source)} <b>${fmtNum(t.cmp.total)}</b> (<bdi dir="ltr">${fmtDiffPct(t.cmp.diff)}</bdi>).
        ${t.cmp.missing ? `${fmtNum(t.cmp.missingTotal)} ${escapeHtml(t.cmp.col)} از ${escapeHtml(t.cmp.source)} مال ${fmtNum(t.cmp.missing)} کمپینیه که توی ${escapeHtml(t.cmp.ownSource)} نیست.` : ''}` : ''}
      ${t.extras.map(m=>`<br>${escapeHtml(m.name)}: تعداد، نرخ (${escapeHtml(m.name)} ÷ ${escapeHtml(label)}) و هزینه به ازای ${escapeHtml(m.name)}${
        m.since ? ` — فقط از ${fmtDateLabel(m.since)} که این ستون توی شیت پر شده؛ نرخ و هزینه‌اش هم فقط روی همین روزها حساب شده` : ''}.`).join('')}
    </div>`;

  const shown = t.rows.slice(0, CPA_TABLE_MAX_ROWS);
  const body = shown.map(r=>{
    const cpaCell = r.cpa!==null
      ? `<td>${fmtNum(r.cpa)}</td>`
      : `<td class="neg">بدون ${escapeHtml(label)}</td>`;
    const recentCell = r.recentCost<=0
      ? `<td class="muted">بدون هزینه</td>`
      : r.recentCpa!==null ? `<td>${fmtNum(r.recentCpa)}</td>`
      : `<td class="neg">بدون ${escapeHtml(label)}</td>`;
    const vsCell = r.vsBenchmark===null
      ? `<td class="muted">—</td>`
      : `<td class="${r.vsBenchmark>0?'neg':'pos'}">${r.vsBenchmark>0?'▲':'▼'} ${Math.abs(r.vsBenchmark).toFixed(0)}٪</td>`;
    return `
      <tr>
        <td class="campaign">${filterableName(project, 'main', r.key, r.label)}${copiesCampaigns(project) ? copyIcon(r.label) : ''}</td>
        <td>${fmtNum(r.cost)}</td>
        <td class="muted">${r.share.toFixed(0)}٪</td>
        <td>${fmtNum(r.conversion)}</td>
        ${cpaCell}
        ${recentCell}
        ${vsCell}
        ${r.costExtra.map((e, i)=>`<td>${fmtNum(e.count)}</td>${e.per!==null ? `<td>${fmtNum(e.per)}</td>`
          : `<td class="${r.cost>0 ? 'neg' : 'muted'}">${r.cost>0 ? `بدون ${escapeHtml(project.costExtraCols[i].label || project.costExtraCols[i].col)}` : '—'}</td>`}`).join('')}
        ${t.cmp ? `<td>${fmtNum(r.cmp)}</td>
          <td class="${r.cmpDiff===null ? 'muted' : Math.abs(r.cmpDiff) >= 20 ? 'neg' : 'muted'}">${
            r.cmpDiff===null ? '—' : `<bdi dir="ltr">${fmtDiffPct(r.cmpDiff)}</bdi>`}</td>` : ''}
        ${r.extra.map((e, i)=> !e.tracked
          ? `<td class="muted">—</td><td class="muted">—</td><td class="muted">—</td>`
          : `<td>${fmtNum(e.count)}</td>
             <td class="muted">${e.rate!==null ? e.rate.toFixed(1)+'٪' : '—'}</td>
             ${e.per!==null ? `<td>${fmtNum(e.per)}</td>` : `<td class="neg">بدون ${escapeHtml(t.extras[i].name)}</td>`}`).join('')}
        <td class="muted">${fmtNum(r.activeDays)}</td>
      </tr>`;
  }).join('');

  const more = t.rows.length > shown.length
    ? `<div class="deep-subtext" style="margin-top:8px;">${fmtNum(t.rows.length - shown.length)} کمپین دیگه با هزینه‌ی کمتر نمایش داده نشدن.</div>` : '';

  // The total row covers every campaign in the range, including the ones past
  // the shown rows. Counts and costs add up; every rate is the combined one
  // (total cost ÷ total conversions), not an average of the rows' rates.
  const sumOf = (list, f) => list.reduce((a, r) => a + (f(r) || 0), 0);
  const all = t.rows;
  const tCost = sumOf(all, r=>r.cost), tConv = sumOf(all, r=>r.conversion);
  const tRecentCost = sumOf(all, r=>r.recentCost);
  const tRecentConv = sumOf(all, r=>r.recentConversion);
  const foot = `

            <td>${fmtNum(tCost)}</td>
            <td class="muted">100٪</td>
            <td>${fmtNum(tConv)}</td>
            <td>${tConv > 0 ? fmtNum(tCost / tConv) : '—'}</td>
            <td>${tRecentConv > 0 ? fmtNum(tRecentCost / tRecentConv) : '—'}</td>
            <td class="muted">—</td>
            ${(project.costExtraCols||[]).map((m, i)=>{
              const n = sumOf(all, r=>r.costExtra[i].count);
              return `<td>${fmtNum(n)}</td><td>${n > 0 ? fmtNum(tCost / n) : '—'}</td>`;
            }).join('')}
            ${t.cmp ? (()=>{
              const n = sumOf(all, r=>r.cmp), d = cmpDiffPct(tConv, n);
              return `<td>${fmtNum(n)}</td><td class="muted">${d===null ? '—' : `<bdi dir="ltr">${fmtDiffPct(d)}</bdi>`}</td>`;
            })() : ''}
            ${t.extras.map((m, i)=>{
              const n = sumOf(all, r=>r.extra[i].count), c = sumOf(all, r=>r.extra[i].cost), v = sumOf(all, r=>r.extra[i].conversion);
              return `<td>${fmtNum(n)}</td><td class="muted">${v > 0 ? (n / v * 100).toFixed(1) + '٪' : '—'}</td><td>${n > 0 ? fmtNum(c / n) : '—'}</td>`;
            }).join('')}
            <td class="muted">${fmtNum(t.dayCount)} روز</td>
          </tr>
        </tfoot>`;

  el.innerHTML = head + `
    <div class="cpa-table-wrap">
      <table class="cpa-table">
        <thead>
          <tr>
            <th>کمپین</th><th>هزینه (تومان)</th><th>سهم هزینه</th><th>${escapeHtml(label)}</th>
            <th>${escapeHtml(cpaLabel)} کل بازه (تومان)</th><th>${escapeHtml(cpaLabel)} ${fmtNum(t.recentWindow)} روز اخیر</th>
            <th>نسبت به میانگین</th>
            ${(project.costExtraCols||[]).map(m=>`<th>${escapeHtml(m.label || m.col)}</th><th>هزینه به ازای ${escapeHtml(m.label || m.col)} (تومان)</th>`).join('')}
            ${t.cmp ? `<th>${escapeHtml(t.cmp.col)} (${escapeHtml(t.cmp.source)})</th><th>اختلاف ${escapeHtml(t.cmp.source)} با ${escapeHtml(t.cmp.ownSource)}</th>` : ''}
            ${t.extras.map(m=>`<th>${escapeHtml(m.name)}</th><th>نرخ ${escapeHtml(m.name)}</th><th>هزینه به ازای ${escapeHtml(m.name)} (تومان)</th>`).join('')}
            <th>روز فعال</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>${foot}
      </table>
    </div>` + more;
}

function renderCostDrivers(project, joined){
  const b = computeLatestCostBreakdown(joined);
  const el = document.getElementById(`costDrivers-${project.id}`);
  if(!el) return;
  if(!b){ el.innerHTML = `<div class="deep-empty">برای مقایسه‌ی آخرین روز با روز قبلش، حداقل ۲ روز داده لازمه.</div>`; return; }
  const headline = `
    <div class="deep-item" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
      <span class="di-tag ${b.totalDelta>=0?'good':'bad'}">${b.totalDelta>=0?'▲':'▼'} ${b.pctChange!==null?Math.abs(b.pctChange).toFixed(0)+'٪':'—'}</span>
      <span class="di-date">${fmtDateLabel(b.prevDate)} ← ${fmtDateLabel(b.date)}</span><br>
      هزینه از <b>${fmtMoney(b.totalYesterday)}</b> به <b>${fmtMoney(b.totalToday)}</b> ${b.totalDelta>=0?'رسیده (افزایش':'رسیده (کاهش'} ${fmtMoney(Math.abs(b.totalDelta))})
    </div>`;
  if(!b.contributions.length){
    el.innerHTML = headline + `<div class="deep-empty">هیچ کمپینی تغییر هزینه‌ی قابل‌ثبتی نداشته.</div>`;
    return;
  }
  // Only surface the main driver(s): keep adding the next-largest contributor
  // until they cumulatively explain ~80% of the total change, capped at 3 —
  // this is "the main factor(s)", not an exhaustive list of every campaign.
  const targetAbs = Math.abs(b.totalDelta) * 0.8;
  const mainContributors = [];
  let cum = 0;
  for(const c of b.contributions){
    mainContributors.push(c);
    cum += Math.abs(c.delta);
    if(cum >= targetAbs || mainContributors.length >= 3) break;
  }
  const rows = mainContributors.map(c=>`
    <li class="deep-item">
      <span class="di-tag ${c.delta>=0?'good':'bad'}">${c.delta>=0?'+':''}${fmtMoney(c.delta)}</span>
      <b>${escapeHtml(c.campaign)}</b>
      <span class="di-date">${fmtMoney(c.yesterdayCost)} ← ${fmtMoney(c.todayCost)}</span>
      ${b.totalDelta!==0?` — ${Math.abs(c.share).toFixed(0)}٪ از کل تغییر`:''}
    </li>`).join('');
  el.innerHTML = headline + `<ul class="deep-list">${rows}</ul>`;
}

function computeSessionGapDrivers(project){
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const byCampaign = {};
  const bucket = (key, label) => {
    if(!byCampaign[key]) byCampaign[key] = {label: label || key, own:0, other:0};
    return byCampaign[key];
  };
  (project.allRef||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.campaign, r.campaignLabel).own += r.installs; });
  (project.rawCompare||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.campaign, r.campaign).other += r.sessions; });

  const entries = Object.entries(byCampaign);
  if(!entries.length) return null;
  const totalOwn = entries.reduce((s,[,v])=>s+v.own,0);
  const totalOther = entries.reduce((s,[,v])=>s+v.other,0);
  const totalGap = totalOwn - totalOther;
  const overallPct = totalOther>0 ? (totalGap/totalOther*100) : null;

  const drivers = entries.map(([key,v])=>({
    key, label:v.label, own:v.own, other:v.other,
    gap: v.own - v.other,
    // Percentage points of the overall gap that this campaign is responsible for.
    contributionPct: totalOther>0 ? ((v.own - v.other)/totalOther*100) : null,
    // Share of the net gap, so "this one campaign is most of it" reads clearly.
    share: totalGap!==0 ? ((v.own - v.other)/totalGap*100) : 0,
    missingFrom: v.other===0 && v.own>0 ? 'other' : (v.own===0 && v.other>0 ? 'own' : null)
  })).filter(d=>d.gap !== 0);
  drivers.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));

  // Keep the campaigns that make up the bulk (~90%) of the total movement.
  const totalAbs = drivers.reduce((s,d)=>s+Math.abs(d.gap),0);
  const main = [];
  let cum = 0;
  for(const d of drivers){
    main.push(d);
    cum += Math.abs(d.gap);
    if(totalAbs>0 && cum/totalAbs >= 0.9) break;
    if(main.length >= 6) break;
  }
  return {totalOwn, totalOther, totalGap, overallPct, drivers: main, driverCount: drivers.length};
}

  const el = document.getElementById(`sessionGaps-${project.id}`);

  el.innerHTML = headline

// What this section's numbers are built on: how much of the cost sheet found
// a conversion row, and every row the normalizers had to drop.
// Every chart reads its neutrals from here, so the page has one chart ink.
const CHART_INK = {
  grid:'#EAEEF5', tick:'#6B7280', tooltipBg:'#FFFFFF', tooltipBorder:'#DFE5EE',
  tooltipTitle:'#111827', tooltipBody:'#5A6577', pointRing:'#FFFFFF'
};

// On a phone a chart is ~340px wide. Ten-digit axis labels on both sides left
// the bars about half of that, and 45° dates took another 90px underneath. So
// below the phone breakpoint the axes say 120M / 1.2B, the days read 09-14
// flat, and there are fewer of each. Tooltips keep the full figures.
const NARROW = window.matchMedia('(max-width: 640px)');
function fmtCompact(v){
  const a = Math.abs(v);
  const cut = (n, unit) => (Math.round(n * 10) / 10).toLocaleString('en-US') + unit;
  if(a >= 1e9) return cut(v / 1e9, 'B');
  if(a >= 1e6) return cut(v / 1e6, 'M');
  if(a >= 1e4) return cut(v / 1e3, 'K');
  return fmtNum(v);
}
function axisNum(v){ return NARROW.matches ? fmtCompact(v) : fmtNum(v); }
// Called by Chart.js with the scale as `this`, so it has to be a function.
function axisDay(v){
  const label = String(this.getLabelForValue(v));
  return NARROW.matches && /^\d{4}-\d{2}-\d{2}$/.test(label) ? label.slice(5) : label;
}
// Tick density is plain configuration, not a callback, so it is set on the
// options before the chart is built and again whenever the screen crosses the
// breakpoint (a phone turned sideways, a window dragged narrow).
function densifyScales(options){
  const narrow = NARROW.matches;
  const sc = (options && options.scales) || {};
  ['y', 'y1'].forEach(k=>{ if(sc[k] && sc[k].ticks) sc[k].ticks.maxTicksLimit = narrow ? 5 : 11; });
  if(sc.x && sc.x.ticks){
    Object.assign(sc.x.ticks, narrow
      ? {maxRotation:0, minRotation:0, maxTicksLimit:5}
      : {maxRotation:45, minRotation:45, maxTicksLimit:12});
  }
  return options;
}
function makeChart(canvas, config){
  densifyScales(config.options);
  return new Chart(canvas, config);
}
NARROW.addEventListener('change', ()=>{
  Object.values(chartInstances).forEach(c=>{
    if(!c || !c.canvas) return;
    densifyScales(c.options);
    c.update('none');
  });
});
// Columns take a soft vertical wash of the brand color — or the brand's own
// gradient where it has one. Falls back to a flat fill before the canvas has
// been laid out.
function barFill(ctx, theme, alpha){
  const area = ctx.chartArea;
  const hi = theme.grad ? theme.grad[1] : theme.accent;
  const lo = theme.grad ? theme.grad[0] : theme.accent;
  if(!area) return hexToRgba(lo, alpha);
  const g = ctx.ctx.createLinearGradient(0, area.bottom, 0, area.top);
  g.addColorStop(0, hexToRgba(lo, alpha));
  g.addColorStop(1, hexToRgba(hi, Math.min(1, alpha + 0.22)));
  return g;
}

      'توی شیت‌های این بخش ردیفی پیدا نشد که با فیلتر کمپین‌هاش بخونه — اسم شیت و فیلتر کمپین رو چک کن.';
  }
  const d = project.diag || {};
  // With includeUnmatchedCost the whole sheet's cost is already in the numbers,
  // so "coverage" would read as if something were missing — say what it means.
  const notes = [project.includeUnmatchedCost
    ? `کل هزینه‌ی شیت لحاظ شده: <b>${fmtMoney(totalCost)}</b> — ${matchPct}٪ از این هزینه به ردیف‌های ${escapeHtml(project.conversionLabel)} مچ شد`
    : `پوشش join: <b>${matchPct}%</b> هزینه (${fmtMoney(matchedCost)} از ${fmtMoney(totalCostInSheet)} تطبیق یافت)`];
  if(d.excludedCost > 0) notes.push(`${fmtMoney(d.excludedCost)} هزینه‌ی کمپین‌های خارج از فیلتر این پروژه (کل بازه‌ی شیت)`);
  if(d.skippedRows > 0) notes.push(`<b>${fmtNum(d.skippedRows)}</b> ردیف بدون Date یا Campaign نادیده گرفته شد (${fmtMoney(d.skippedCost)})`);
  if(d.unreadableCost > 0) notes.push(`<b>${fmtNum(d.unreadableCost)}</b> سلول Cost با فرمت غیرقابل‌خوندن`);
  if(d.futureRows > 0) notes.push(`<b>${fmtNum(d.futureRows)}</b> ردیف مربوط به امروز یا بعد از اون نادیده گرفته شد (روز جاری هنوز کامل نیست)`);
  if(d.refNoCostCampaign > 0) notes.push(`<b>${fmtNum(d.refNoCostCampaign)}</b> ردیف کانورژن کنار گذاشته شد چون کمپینش توی شیت هزینه نیست`);
  // Cost in the range with nothing to join it to reads as an empty section;
  // say which side ran out and when, instead of showing zeroes.
  if(!joined.length && totalCostInSheet > 0){
    const lastRef = (project.rawRef||[]).reduce((m,r)=> r.date > m ? r.date : m, '');
    notes.push(`<b>توی این بازه هیچ ردیف ${escapeHtml(project.conversionLabel)} وجود نداره</b>` +
      (lastRef ? ` — آخرین روزی که شیت مرجع دیتا داره: ${fmtDateLabel(lastRef)}` : ''));
  }
  document.getElementById(`coverageNote-${project.id}`).innerHTML = notes.join(' — ');
}

// The same number of days ending the day before the current range starts.
// Comparing a range with the stretch right before it is the question people
// actually ask of a dashboard — "is this better than it was?" — and it costs
// one more pass over rows that are already in memory.
function previousWindow(project){
  const {from, to} = sectionRange(project);
  if(!from || !to) return null;
  const start = new Date(toInputDate(from)), end = new Date(toInputDate(to));
  const days = Math.round((end - start) / 86400000) + 1;
  if(days < 1) return null;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate() - 1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate() - (days - 1));
  return {from: fromInputDate(localIso(prevStart)), to: fromInputDate(localIso(prevEnd)), days};
}
// A change is good or bad depending on the metric: spending more is neither,
// a higher CPA is worse, more conversions is better. `good` says which way is
// up so the colour doesn't have to be decided at each call site.
function deltaOf(now, before, good){
  if(before === null || before === undefined || !isFinite(before) || before === 0) return null;
  if(now === null || now === undefined || !isFinite(now)) return null;
  const pct = (now - before) / Math.abs(before) * 100;
  if(!isFinite(pct)) return null;
  return {pct, good};
}

// A sparkline is the cheapest way to say "and here is how it got there".
// Drawn as inline SVG stretched to the card's width; nulls (a day with no CPA)
// break the line rather than dragging it to zero.
function sparkline(series, opts){
  const pts = (series || []).map((v, i) => ({i, v: (v === null || v === undefined || !isFinite(v)) ? null : v}));
  const real = pts.filter(p=>p.v !== null);
  if(real.length < 2) return '';
  const min = Math.min(...real.map(p=>p.v)), max = Math.max(...real.map(p=>p.v));
  const span = max - min || Math.abs(max) || 1;
  // Inset by 2 so the marker on the last point isn't sliced by the card edge.
  const x = i => pts.length > 1 ? 2 + (i / (pts.length - 1)) * 96 : 50;
  const y = v => 26 - ((v - min) / span) * 22;   // 2px of breathing room top and bottom
  let d = '', open = false;
  pts.forEach(p=>{
    if(p.v === null){ open = false; return; }
    d += `${open ? 'L' : 'M'}${x(p.i).toFixed(2)},${y(p.v).toFixed(2)} `;
    open = true;
  });
  const last = real[real.length - 1];
  const stroke = (opts && opts.color) || 'var(--accent-ink)';
  const area = `M${x(real[0].i).toFixed(2)},28 ` + d.replace(/^M/, 'L') + `L${x(last.i).toFixed(2)},28 Z`;
  const id = 'sp' + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${stroke}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d.trim()}" fill="none" stroke="${stroke}" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last.i).toFixed(2)}" cy="${y(last.v).toFixed(2)}" r="2"
            fill="${stroke}" stroke="var(--surface)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// Short form of a figure: 1.01B, 447.2M, 51.5K. Two decimals below 10, one
// above, trailing zeros dropped.
// `tight` keeps three significant figures (972M, 12.7M, 1.01B) for a card
// where even the one-decimal form does not fit.
function fmtShort(n, tight){
  const units = [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const a = Math.abs(n);
  let i = a >= 1e9 ? 0 : a >= 1e6 ? 1 : 2;
  const scaled = a / units[i][0];
  let str = (n / units[i][0]).toFixed(scaled < 10 ? 2 : (tight && scaled >= 100) ? 0 : 1);
  // 999,999 rounds to 1000.0K; that is 1M.
  if(Math.abs(Number(str)) >= 1000 && i > 0){ i--; str = (n / units[i][0]).toFixed(2); }
  // Trailing zeros go only after a decimal point: 1.50 -> 1.5, but 480 stays 480.
  return (str.includes('.') ? str.replace(/\.?0+$/, '') : str) + units[i][1];
}
// A card's figure, with its short form alongside when it has one. Both are in
// the page and a class on the value picks which shows, so the choice can be
// made again whenever the card changes width.
function kpiValueHtml(value){
  const text = String(value);
  const unit = ' <span class="unit">تومان</span>';
  const full = text.replace(/\s*تومان$/, unit);
  const m = text.match(/^\s*(-?)([\d,]+(?:\.\d+)?)(\s*تومان)?\s*$/);
  const n = m ? Number(m[1] + m[2].replace(/,/g, '')) : NaN;
  if(!isFinite(n) || Math.abs(n) < 1e4) return full;
  const tail = m[3] ? unit : '';
  const short = fmtShort(n), tight = fmtShort(n, true);
  return `<span class="v-full">${full}</span><span class="v-short">${short}${tail}</span>`
       + (tight !== short ? `<span class="v-tight">${tight}${tail}</span>` : '');
}
// Full figure if it fits its card at the fixed size, short form if not.
function fitKpiValue(v){
  v.classList.remove('short', 'tight');
  // A card in a hidden section measures zero; switchTab re-fits it the
  // moment the section is shown.
  if(!v.clientWidth || !v.querySelector('.v-short')) return;
  const overflows = () => v.scrollWidth > v.clientWidth + 1;
  if(!overflows()) return;
  v.classList.add('short');
  if(overflows() && v.querySelector('.v-tight')) v.classList.replace('short', 'tight');
}
function fitKpiValues(root){
  (root || document).querySelectorAll('.kpi .value').forEach(fitKpiValue);
}

// Every section's cards go through here, so a card looks the same whichever
// page it is on: the change in the corner, the figure large, then its name
// and the trend underneath.
function renderKpiCards(project, cards){
  const el = document.getElementById(`kpis-${project.id}`);
  if(!el) return;
  el.style.gridTemplateColumns = `repeat(${cards.length}, minmax(0, 1fr))`;
  el.innerHTML = cards.map(c=>{
    const d = c.delta;
    const dir = d ? (d.pct > 0.5 ? 'up' : d.pct < -0.5 ? 'down' : 'flat') : null;
    // Spending more is neither good nor bad — only metrics with a direction
    // ('up' or 'down' is better) get a colour; the rest stay neutral.
    const tone = !d || dir === 'flat' || d.good === 'none' ? 'flat'
               : (d.good === 'up') === (dir === 'up') ? 'pos' : 'neg';
    const chip = d
      ? `<span class="kpi-delta ${tone}" title="نسبت به ${fmtNum(d.days || 0)} روز قبل از این بازه">
           ${dir === 'flat' ? '≈' : dir === 'up' ? '▲' : '▼'} ${Math.abs(d.pct).toFixed(0)}٪
         </span>`
      : '';
    const m = c.metric;
    return `
    <div class="kpi${m ? ' pickable' : ''}"${m ? ` data-metric="${m.id}" role="button" tabindex="0" title="نمایش روی نمودار"` : ''}>
      <div class="kpi-top">${chip}</div>
      <div class="value ${c.accent ? 'accent' : ''}" title="${escapeHtml(String(c.value))}">${kpiValueHtml(c.value)}</div>
      <div class="label">${c.key ? `<i class="kpi-key" style="background:${c.key}"></i>` : ''}${c.label}</div>
      ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ''}
      <div class="kpi-foot">${sparkline(c.series, {color: c.accent ? 'var(--accent-ink)' : 'var(--text-faint)'})}</div>
    </div>`;
  }).join('');
  fitKpiValues(el);
  // A card that carries a daily series is also the switch for that series on
  // the chart below it (see renderMetricChart).
  el.onclick = e => { const k = e.target.closest('.kpi.pickable'); if(k) toggleChartMetric(project, k.dataset.metric); };
  el.onkeydown = e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const k = e.target.closest('.kpi.pickable');
    if(k){ e.preventDefault(); toggleChartMetric(project, k.dataset.metric); }
  };
  paintChartPicks(project);
}

// ---------- Metric chart (cards pick what it draws) ----------
// Like the scorecards above a Google Ads chart: each card with a daily series
// can be put on the chart or taken off it, up to four at once, and the card
// wears the colour its series is drawn in. Spend is drawn as columns, every
// other metric as a line; each metric scales on its own axis, as in Google
// Ads, except the spend columns, which share one so they compare directly
// (declared cost against real cost and profit). The first two
// axes are labelled, left and right; a third or fourth still scales on its
// own but keeps its ticks hidden so the plot isn't squeezed.
const CHART_MAX_METRICS = 4;
function slotColors(project){
  const t = project.theme;
  const hue = hex => {
    const h = hex.replace('#','');
    const [r,g,b] = [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    if(!d) return null;
    const x = mx === r ? ((g-b)/d) % 6 : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    return (x * 60 + 360) % 360;
  };
  const taken = [t.accent, t.accent2].map(hue).filter(h=>h!==null);
  const far = c => taken.every(h => { const d = Math.abs(hue(c) - h); return Math.min(d, 360-d) > 35; });
  const pool = ['#2563EB', '#16A34A', '#9333EA', '#DC2626', '#0891B2', '#EA580C'].filter(far);
  return [t.accent, t.accent2, pool[0], pool[1]];
}
function toggleChartMetric(project, id){
  const st = projectState[project.id];
  const ctx = project._chart;
  if(!ctx || !ctx.metrics.some(m=>m.id===id)) return;
  let sel = (st.chartPicks || ctx.defaults).filter(x => ctx.metrics.some(m=>m.id===x));
  if(sel.includes(id)){
    if(sel.length === 1) return;          // the chart always shows something
    sel = sel.filter(x=>x!==id);
  } else {
    sel = [...sel, id];
    if(sel.length > CHART_MAX_METRICS) sel = sel.slice(-CHART_MAX_METRICS);
  }
  st.chartPicks = sel;
  drawMetricChart(project);
  paintChartPicks(project);
}
function chartPicks(project){
  const ctx = project._chart;
  if(!ctx) return [];
  const avail = id => ctx.metrics.some(m=>m.id===id);
  const sel = (projectState[project.id].chartPicks || ctx.defaults).filter(avail);
  return sel.length ? sel : ctx.defaults.filter(avail).slice(0, 1);
}
// The selected cards carry their series' colour along their top edge.
function paintChartPicks(project){
  const el = document.getElementById(`kpis-${project.id}`);
  if(!el || !project._chart) return;
  const sel = chartPicks(project), colors = slotColors(project);
  el.querySelectorAll('.kpi.pickable').forEach(k=>{
    const i = sel.indexOf(k.dataset.metric);
    k.classList.toggle('picked', i >= 0);
    k.setAttribute('aria-pressed', i >= 0 ? 'true' : 'false');
    k.style.setProperty('--pick', i >= 0 ? colors[i] : 'transparent');
  });
}
// The section hands over every metric it can draw (with its day series) and
// which ones show by default; the cards decide the rest.
function renderMetricChart(project, key, canvasId, chart){
  project._chart = {key, canvasId, ...chart};
  drawMetricChart(project);
}
function drawMetricChart(project){
  const c = project._chart;
  const canvas = document.getElementById(c.canvasId);
  if(!canvas) return;
  if(chartInstances[c.key]) chartInstances[c.key].destroy();
  const sel = chartPicks(project);
  const colors = slotColors(project);
  const metrics = sel.map(id => c.metrics.find(m=>m.id===id));
  const axisIds = [];
  metrics.forEach(m=>{ const a = m.axis || m.id; if(!axisIds.includes(a)) axisIds.push(a); });
  const many = c.labels.length > 24;
  const datasets = metrics.map((m, i)=>{
    const color = colors[i];
    const yAxisID = 'ax' + axisIds.indexOf(m.axis || m.id);
    if(m.bar) return {
      type:'bar', label:m.label, data:m.data, yAxisID, order:2, maxBarThickness:22,
      borderRadius:4, borderSkipped:false,
      // The brand's own columns keep their gradient; other colours go flat.
      backgroundColor: i === 0 ? (ctx=>barFill(ctx, project.theme, 0.78)) : hexToRgba(color, 0.72),
      hoverBackgroundColor: i === 0 ? (ctx=>barFill(ctx, project.theme, 0.95)) : hexToRgba(color, 0.92),
      borderColor: i === 0 ? (project.theme.ink || color) : color,
      borderWidth:{top:1.5, right:0, bottom:0, left:0}
    };
    const solo = metrics.filter(x=>!x.bar).length === 1;
    return {
      type:'line', label:m.label, data:m.data, yAxisID, order:1, borderColor:color,
      // One line gets the soft wash beneath it; several stay bare so they
      // don't muddy each other.
      backgroundColor: ctx => {
        const area = ctx.chart.chartArea;
        if(!solo || !area) return hexToRgba(color, 0.07);
        const g = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
        g.addColorStop(0, hexToRgba(color, 0.16));
        g.addColorStop(1, hexToRgba(color, 0));
        return g;
      },
      fill: solo, tension:.32, borderWidth:2,
      pointRadius: many ? 0 : 4, pointHoverRadius:5,
      pointBackgroundColor: color, pointBorderColor:CHART_INK.pointRing, pointBorderWidth:2
    };
  });
  const scales = {
    x:{grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, color:CHART_INK.tick, maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12, callback:axisDay}}
  };
  axisIds.forEach((a, i)=>{
    const spendLike = metrics.some(m => (m.axis || m.id) === a && m.bar);
    scales['ax' + i] = {
      position: i === 1 ? 'right' : 'left',
      display: i < 2,
      beginAtZero: spendLike,
      grid: i === 0 ? {color:CHART_INK.grid, drawTicks:false} : {display:false},
      border:{display:false},
      ticks:{font:{size:10}, color:CHART_INK.tick, padding:6, callback:axisNum}
    };
  });
  const shown = new Set(sel);
  chartInstances[c.key] = makeChart(canvas, {
    type:'bar',
    data:{labels:c.labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:CHART_INK.tooltipBg, borderColor:CHART_INK.tooltipBorder, borderWidth:1,
          titleColor:CHART_INK.tooltipTitle, bodyColor:CHART_INK.tooltipBody, padding:12, boxPadding:5, cornerRadius:10,
          displayColors:true, usePointStyle:true,
          titleFont:{family:"'IBM Plex Mono', monospace", size:11},
          bodyFont:{family:"'IBM Plex Mono', monospace", size:11.5},
          callbacks:{
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y === null ? '—' : fmtNum(ctx.parsed.y, 0)}`,
            // The day's own conversion count rides along whenever it isn't
            // already one of the drawn series.
            afterBody: items => (items.length && c.tooltipExtra && !shown.has(c.tooltipExtra.id))
              ? `${c.tooltipExtra.label}: ${fmtNum(c.tooltipExtra.data[items[0].dataIndex])}` : ''
          }
        }
      },
      scales
    }
  });
  const legend = document.getElementById(`legend-${c.canvasId}`);
  if(legend) legend.innerHTML = metrics.map((m, i)=>
    `<span><i class="${m.bar ? '' : 'ln'}" style="background:${colors[i]}"></i>${escapeHtml(m.label)}</span>`).join('');
}

// Daily cost as columns with the cost per conversion as a line: the standard
// section chart, and the one the CPI page draws once per campaign group.
function renderCostCpaChart(project, key, canvasId, joined, cpaLabel){
  const canvas = document.getElementById(canvasId);

  const {labels, cost, conversion, cpaSeries} = groupByDateGeneric(joined);

  chartInstances[key] = makeChart(canvas, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar', label:'هزینه', data:cost,
         backgroundColor: ctx=>barFill(ctx, project.theme, 0.78),
         hoverBackgroundColor: ctx=>barFill(ctx, project.theme, 0.95),
         borderColor: inkHex, borderWidth:{top:1.5, right:0, bottom:0, left:0},
         borderRadius:4, borderSkipped:false, yAxisID:'y', order:2, maxBarThickness:22},
        {type:'line', label:cpaLabel, data:cpaSeries, borderColor: accent2Hex,
         // A wash that fades out downwards gives the line a body without
         // competing with the columns it sits over.
         backgroundColor: ctx => {
           const area = ctx.chart.chartArea;
           if(!area) return hexToRgba(accent2Hex, 0.07);
           const g = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
           g.addColorStop(0, hexToRgba(accent2Hex, 0.16));
           g.addColorStop(1, hexToRgba(accent2Hex, 0));
           return g;
         },
         fill:true, tension:.32, yAxisID:'y1',
         pointRadius: labels.length > 24 ? 0 : 4, pointHoverRadius:5,
         pointBackgroundColor: accent2Hex, pointBorderColor:CHART_INK.pointRing, pointBorderWidth:2,
         borderWidth:2, order:1}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:CHART_INK.tooltipBg, borderColor:CHART_INK.tooltipBorder, borderWidth:1,
          titleColor:CHART_INK.tooltipTitle, bodyColor:CHART_INK.tooltipBody, padding:12, boxPadding:5, cornerRadius:10,
          displayColors:true, usePointStyle:true,
          titleFont:{family:"'IBM Plex Mono', monospace", size:11},
          bodyFont:{family:"'IBM Plex Mono', monospace", size:11.5},
          callbacks:{
            label: ctx => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y,0)}`,
            // Cost and CPA are both made of the day's conversion count, so the
            // hovered day states it rather than leaving it to be divided back
            // out — without spending a third series on the chart.
            afterBody: items => items.length
              ? `${project.conversionLabel || 'کانورژن'}: ${fmtNum(conversion[items[0].dataIndex])}`
              : ''
          }
        }
      },
      scales:{
        y:{position:'left', grid:{color:CHART_INK.grid, drawTicks:false}, border:{display:false}, ticks:{font:{size:10}, color:CHART_INK.tick, padding:6, callback:axisNum}},
        y1:{position:'right', grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, color:CHART_INK.tick, padding:6, callback:axisNum}},
        x:{grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, color:CHART_INK.tick, maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12, callback:axisDay}}
      }
    }
  });


}

// ---------- CPI sections (cost and cost per install only) ----------
// A campaign group is either everything, or the campaigns whose name starts
// with a prefix (inapp- for in-app, cb- for Cafe Bazaar).
function cpiGroupFilter(group){
  return group.prefix ? (key => key.startsWith(group.prefix)) : (() => true);
}

// Cost lives on the campaign, never on the creative, so a creative's cost is
// its share of that day's campaign installs. Two creatives of one campaign
// therefore differ only by the days and campaigns they ran on — a creative
// that kept running on the expensive days ends up with the higher CPI.
function computeCreativeCpi(project, group, keyFn){
  const st = projectState[project.id];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const inGroup = cpiGroupFilter(group);
  const keep = r => inRange(r.date) && inCampaign(r.campaign) && inGroup(r.campaign);

  const refAll = project.rawRef.filter(keep);
  const refRows = refAll.filter(segKeep(project));
  if(!refRows.length) return null;

  const costByDay = {};
  project.rawCost.filter(keep).forEach(r=>{
    const key = r.date + '||' + r.campaign;
    costByDay[key] = (costByDay[key] || 0) + r.cost;
  });
  // A day's campaign cost splits over every creative that day, picked or not.
  const installsByDay = {};
  refAll.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    installsByDay[key] = (installsByDay[key] || 0) + r.installs;
  });

  const segments = {};
  let pricedInstalls = 0, unpricedInstalls = 0;
  refRows.forEach(r=>{
    const label = keyFn(r);
    const key = r.date + '||' + r.campaign;
    const dayInstalls = installsByDay[key];
    const seg = segments[label] = segments[label] ||
      {label, installs:0, cost:0, campaigns:new Set()};
    seg.installs += r.installs;
    seg.campaigns.add(r.campaignLabel || r.campaign);
    if(dayInstalls > 0){
      seg.cost += (costByDay[key] || 0) * (r.installs / dayInstalls);
      pricedInstalls += r.installs;
    } else {
      unpricedInstalls += r.installs;
    }
  });

  // With an ad group / creative picked, the totals are the picked share only.
  const picked = segActive(project);
  const totalCost = picked ? Object.values(segments).reduce((a,g)=>a+g.cost, 0)
                           : Object.values(costByDay).reduce((a,b)=>a+b, 0);
  const totalInstalls = picked ? Object.values(segments).reduce((a,g)=>a+g.installs, 0)
                               : Object.values(installsByDay).reduce((a,b)=>a+b, 0);
  const benchmark = totalInstalls > 0 ? totalCost/totalInstalls : null;

  const all = Object.values(segments);
  const rows = all.filter(seg=>seg.installs > 0).map(seg=>({
    label: seg.label,
    campaigns: Array.from(seg.campaigns),
    installs: seg.installs,
    cost: seg.cost,
    cpi: seg.installs>0 ? seg.cost/seg.installs : null,
    installShare: totalInstalls>0 ? seg.installs/totalInstalls*100 : 0,
    vsBenchmark: benchmark ? ((seg.cost/seg.installs)-benchmark)/benchmark*100 : null
  })).sort((a,b)=>b.cost - a.cost);

  return {rows, benchmark, totalCost, totalInstalls, unpricedInstalls,
          noInstallCount: all.length - rows.length};
}

// A dimension tab totalled over the section's date range: the dimension and
// its metric, biggest first. Nothing is attributed or derived here — these are
// the sheet's own numbers added up, which is why the table can stay this bare.
// Each dimension table has a filter of its own: which of its values to show.
// The three tabs share no column, so one table's filter can't reach another.
function dimSelection(project, index){
  const st = projectState[project.id];
  st.dimSel = st.dimSel || {};
  return st.dimSel[index] || 'ALL';
}
// The values the date range leaves, each with its metric total, biggest first
// — the list the table's filter offers.
function dimOptions(project, index){
  const rows = (project.rawDims || [])[index] || [];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const by = {};
  rows.forEach(r=>{ if(inRange(r.date)) by[r.label] = (by[r.label] || 0) + r.value; });
  const sel = dimSelection(project, index);
  // A hand-picked value stays listed even when the range has none of it.
  if(sel !== 'ALL') sel.forEach(v=>{ if(!(v in by)) by[v] = 0; });
  return Object.entries(by).map(([label, value])=>({label, value}))
    .sort((a,b)=> b.value - a.value || a.label.localeCompare(b.label));
}
function computeDimensionTable(project, index){
  const rows = (project.rawDims || [])[index] || [];
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const sel = dimSelection(project, index);
  const picked = l => sel === 'ALL' || sel.has(l);
  const byLabel = {};
  let total = 0, days = new Set();
  rows.filter(r=>inRange(r.date) && picked(r.label)).forEach(r=>{
    byLabel[r.label] = (byLabel[r.label] || 0) + r.value;
    total += r.value;
    days.add(r.date);
  });
  const out = Object.entries(byLabel).map(([label, value])=>({label, value}))
    .sort((a,b)=> b.value - a.value || a.label.localeCompare(b.label));
  return {rows: out, total, dayCount: days.size, hasData: rows.length > 0};
}

function renderDimFilter(project, index){
  const cfg = project.dimensionTables[index];
  const panel = document.getElementById(`dimPanel-${project.id}-${index}`);
  const toggle = document.getElementById(`dimToggle-${project.id}-${index}`);
  if(!panel || !toggle) return;
  const st = projectState[project.id];
  st.dimQuery = st.dimQuery || {};
  const q = st.dimQuery[index] || '';
  const opts = dimOptions(project, index);
  const sel = dimSelection(project, index);
  const isOn = l => sel === 'ALL' || sel.has(l);
  const allLabel = `همه‌ی ${cfg.dimCol}‌ها`;
  toggle.textContent = (sel === 'ALL' ? allLabel
    : sel.size === 0 ? 'هیچ‌کدوم'
    : sel.size === 1 ? [...sel][0]
    : `${fmtNum(sel.size)} ${cfg.dimCol} انتخاب شده`) + ' ▾';
  const hit = o => !q || searchKey(o.label).includes(searchKey(q));
  const shown = opts.filter(hit);
  const allOn = shown.length > 0 && shown.every(o=>isOn(o.label));
  const searchId = `dimSearch-${project.id}-${index}`;
  const hadFocus = document.activeElement && document.activeElement.id === searchId;
  panel.innerHTML = `
    <div class="ms-search-wrap">
      <input type="search" class="ms-search" id="${searchId}" placeholder="جست‌وجوی ${escapeHtml(cfg.dimCol)}…" value="${escapeHtml(q)}" autocomplete="off">
    </div>
    <label class="ms-option ms-option-all">
      <input type="checkbox" data-dim-all ${allOn ? 'checked' : ''} ${shown.length ? '' : 'disabled'}>
      <span>${q ? `همه‌ی ${fmtNum(shown.length)} نتیجه‌ی «${escapeHtml(q.trim())}»` : escapeHtml(allLabel)}</span>
    </label>
    <div class="ms-divider"></div>
    ${shown.map(o=>`
      <label class="ms-option">
        <input type="checkbox" data-dim-val="${escapeHtml(o.label)}" ${isOn(o.label) ? 'checked' : ''}>
        <span class="ms-option-label">${escapeHtml(o.label)}</span>
        <span class="ms-option-cost">${fmtNum(o.value)}</span>
      </label>`).join('')}
    ${shown.length ? '' : '<div class="ms-empty">چیزی پیدا نشد</div>'}`;
  const search = document.getElementById(searchId);
  if(hadFocus){ search.focus(); try{ search.setSelectionRange(q.length, q.length); }catch(err){} }
  search.oninput = ()=>{ st.dimQuery[index] = search.value; renderDimFilter(project, index); };
  search.onkeydown = e=>{ if(e.key === 'Escape'){ e.stopPropagation(); st.dimQuery[index] = ''; renderDimFilter(project, index); } };
  const commit = next => {
    st.dimSel[index] = (next !== 'ALL' && opts.every(o=>next.has(o.label)) && !q) ? 'ALL' : next;
    renderDimFilter(project, index);
    renderDimensionTable(project, index, true);
  };
  panel.onchange = e=>{
    const cb = e.target;
    const cur = sel === 'ALL' ? new Set(opts.map(o=>o.label)) : new Set(sel);
    if(cb.hasAttribute('data-dim-all')){
      // Without a search this row is everything; with one, it is the matches.
      if(!q) return commit(cb.checked ? 'ALL' : new Set());
      // As in the campaign filter: ticking it shows exactly the matches,
      // unticking drops them and leaves the rest of the choice alone.
      if(cb.checked) return commit(new Set(shown.map(o=>o.label)));
      shown.forEach(o=>cur.delete(o.label));
      return commit(cur);
    }
    const v = cb.getAttribute('data-dim-val');
    if(cb.checked) cur.add(v); else cur.delete(v);
    commit(cur);
  };
  panel.onclick = e=>e.stopPropagation();
  toggle.onclick = e=>{
    e.stopPropagation();
    const open = !panel.hidden;
    document.querySelectorAll('.ms-panel').forEach(p=>p.hidden = true);
    panel.hidden = open;
    if(!panel.hidden) search.focus();
  };
}
function renderDimensionTable(project, index, skipFilter){
  const cfg = (project.dimensionTables || [])[index];
  const el = document.getElementById(`dimTable-${project.id}-${index}`);
  if(!cfg || !el) return;

  const t = computeDimensionTable(project, index);
  if(!t.rows.length){

      ? 'توی این بازه ردیفی برای این تب نبود.'
      : `تب «${escapeHtml(cfg.sheet)}» خونده نشد یا خالیه.`}</div>`;
    return;
  }
  const body = t.rows.map(r=>`
    <tr>
      <td class="campaign">${copyableName(r.label)}</td>
      <td>${fmtNum(r.value)}</td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="cpa-table-wrap">
      <table class="cpa-table">
        <thead>
          <tr><th>${escapeHtml(cfg.dimCol)}</th><th>${escapeHtml(cfg.metricCol)}</th></tr>
        </thead>

        </tfoot>

    </div>`;
}
function renderDimensionTables(project){
