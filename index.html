<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7F3EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* Warm paper: the page is a cream wash, every panel is plain white, and
       one card per page is near-black so the eye has somewhere to land. */
    --bg:#F7F3EA;
    --bg-elev:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#FAF7F0;
    --surface-3:#F2ECE1;
    --border:#EAE3D5;
    --border-soft:#F2EDE3;
    --text:#15171C;
    --text-muted:#5E6270;
    --text-faint:#8A8C99;
    --warm:#F5D13B;
    /* Per-project brand colors override these three on each section. */
    --accent:#2563EB;
    --accent-ink:#1D4ED8;          /* the brand color stepped dark enough for text */
    --accent-2:#1B1F27;
    --accent-soft:rgba(37,99,235,0.10);
    --accent-grad:linear-gradient(90deg,var(--accent),var(--accent-2));
    --positive:#0E7A4F;
    --positive-soft:rgba(14,122,79,0.10);
    --negative:#C62026;
    --negative-soft:rgba(198,32,38,0.09);
    --amber:#B45309;
    --amber-soft:rgba(180,83,9,0.12);
    --radius:24px;
    --radius-sm:16px;
    --radius-xs:12px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --border-strong:#DCD2C0;
    --shadow-card:0 1px 2px rgba(58,46,24,.04), 0 14px 30px -22px rgba(58,46,24,.26);
    --shadow-lift:0 2px 4px rgba(58,46,24,.05), 0 22px 40px -22px rgba(58,46,24,.30);
    --shadow-pop:0 16px 40px -14px rgba(58,46,24,.24), 0 2px 6px rgba(58,46,24,.07);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);color-scheme:light;}
  body{
    margin:0;
    /* Cream paper with a pale-yellow sunrise in the corner; the tint over it
       follows the open project's colour (see paintPageAccent). */
    background:
      radial-gradient(1000px 470px at 88% -12%, color-mix(in srgb, var(--page-accent, #F5D13B) 15%, transparent), transparent 62%),
      radial-gradient(900px 460px at 12% -10%, rgba(245,209,59,.34), transparent 58%),
      linear-gradient(180deg,#FCF8EF 0%, var(--bg) 42%, #F2EDE1 100%);
    background-attachment:fixed;
    transition:background .5s ease;
    color:var(--text);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px;}
  :root{--gutter:24px;}
  .wrap{max-width:1280px;margin:0 auto;padding:28px var(--gutter) 72px;}

  /* Topbar */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:14px;flex-shrink:0;
    background:linear-gradient(135deg,#FFFFFF,#F7F1E4);
    border:1px solid #E7DECB;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -10px rgba(58,46,24,.4);
  }
  .brand-mark svg{width:18px;height:18px;color:var(--text);}
  .topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--text-muted);
    box-shadow:var(--shadow-card);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .dot.live{background:var(--positive);box-shadow:0 0 0 4px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 4px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Coverage meter */
  .coverage-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 26px;margin-bottom:22px;box-shadow:var(--shadow-card);
  }
  .coverage-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .coverage-top .title{font-size:13px;font-weight:700;color:var(--text);}
  .coverage-top .pct{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent-ink);}
  .meter-track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
  .meter-fill{height:100%;border-radius:99px;background:var(--accent-grad);transition:width .6s ease;}
  .coverage-legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .coverage-legend b{color:var(--text);font-family:var(--font-mono);font-weight:600;}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .kpi{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 20px 14px;overflow:hidden;box-shadow:var(--shadow-card);
    display:flex;flex-direction:column;gap:3px;min-height:162px;
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
  }
  /* A card lifting under the cursor is the cheapest way to say the surface is
     alive; it moves 2px, which reads as depth without becoming a bounce. */
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong);}
  /* A card that switches its series on the chart: clickable, and while its
     series is drawn it carries that series' colour along the top edge. */
  .kpi.pickable{cursor:pointer;}
  .kpi.pickable::before{
    content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pick, transparent);
    transition:background .18s;
  }
  .kpi.pickable.picked{border-color:var(--border-strong);}
  .kpi.pickable:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
  /* The change chip sits in the corner on its own line; the figure then gets
     the whole width of the card, which is what makes it able to be this big. */
  .kpi .kpi-top{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:19px;}
  .kpi .label{
    font-size:12.5px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;min-width:0;
    margin-top:1px;
  }
  .kpi-key{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:7px;flex-shrink:0;}
  .kpi-delta{
    font-family:var(--font-mono);font-size:10.5px;font-weight:700;white-space:nowrap;flex-shrink:0;
    padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-muted);
  }
  .kpi-delta.pos{background:var(--positive-soft);color:var(--positive);}
  .kpi-delta.neg{background:var(--negative-soft);color:var(--negative);}
  .kpi-sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* The trend runs the width of the card and sits on its lower edge, so the
     figure above it reads as "this number, arrived at like this". */
  .kpi-foot{margin-top:auto;margin-inline:-20px;margin-bottom:-14px;height:36px;}
  .spark{display:block;width:100%;height:36px;opacity:.8;transition:opacity .18s;}
  .kpi:hover .spark{opacity:1;}
  .kpi .icon{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex-shrink:0;}
  .kpi .icon svg{width:15px;height:15px;}
  /* Every figure on the screen is set at one size — a card never grows or
     shrinks its number to make it fit. A figure too long for its card is
     shown in short form instead (1.01B, 447.2M; see fitKpiValue), with the
     exact figure in its tooltip. */
  .kpi .value{
    font-family:var(--font-mono);font-size:32px;font-weight:700;letter-spacing:-0.025em;
    color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .kpi .value .v-short, .kpi .value .v-tight{display:none;}
  .kpi .value.short .v-full, .kpi .value.tight .v-full{display:none;}
  .kpi .value.short .v-short, .kpi .value.tight .v-tight{display:inline;}
  .kpi .value.accent{color:var(--accent-ink);}
  .kpi .value .unit{font-size:.36em;font-weight:500;color:var(--text-faint);letter-spacing:0;}
  .kpi .ctx{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* Cards */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow-card);
    transition:box-shadow .2s, border-color .2s;
  }
  .card:hover{box-shadow:var(--shadow-lift);border-color:var(--border-strong);}
  /* The reading-heavy analysis card is set on warm paper rather than white,
     so the page still has an anchor without going dark anywhere. */
  .card.soft{
    --surface:#FCFAF5;
    --surface-2:#F7F2E8;
    --surface-3:#F1EADC;
    background:linear-gradient(180deg,#FDFBF7,#FAF6ED);
    border-color:#EDE4D3;
  }
  .card.soft .cpa-table{--stripe:#FEFDFA;}
  .card.soft .cpa-table thead th{background:#F5F0E5;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .card.collapsed .card-body{display:none;}
  .card.collapsed .card-head{margin-bottom:0;}
  .collapse-toggle{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--accent-ink);
    background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:6px 14px;
    transition:border-color .15s;
  }
  .collapse-toggle:hover{border-color:var(--accent-ink);}
  .collapse-toggle i{font-style:normal;display:inline-block;transition:transform .18s;}
  .card:not(.collapsed) .collapse-toggle i{transform:rotate(180deg);}
  .card.collapsed .collapse-toggle .ct-close, .card:not(.collapsed) .collapse-toggle .ct-open{display:none;}
  .card h2{font-size:16px;font-weight:700;margin:0 0 3px;color:var(--text);letter-spacing:-0.015em;}
  .card .card-sub{font-size:12px;color:var(--text-muted);max-width:70ch;line-height:1.7;}
  .legend-dots{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .legend-dots span{display:flex;align-items:center;gap:6px;}
  .legend-dots i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0;}
  .legend-dots i.bar{background:var(--accent-grad);}
  .legend-dots i.line{height:3px;border-radius:2px;background:var(--accent-2);}
  .legend-dots i.ln{height:3px;border-radius:2px;}
  .chart-box{position:relative;height:320px;}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:var(--text-muted);font-weight:700;font-size:11.5px;
    letter-spacing:.02em;
    padding:0 12px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  thead th .arrow{opacity:.5;font-size:9px;margin-inline-start:4px;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text);}
  tbody td.num{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  }
  .badge.good{background:var(--positive-soft);color:var(--positive);}
  .badge.bad{background:var(--negative-soft);color:var(--negative);}
  .badge.neutral{background:var(--surface-3);color:var(--text-muted);}

  .skeleton-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;}
  .sk-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .sk{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    position:relative;overflow:hidden;
  }
  .sk-card{height:162px;}
  .sk-chart{height:320px;}
  /* One sweep of light travelling across the placeholders — the page looks
     like it is working rather than stuck. */
  .sk::after{
    content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(16,24,40,.05), transparent);
    animation:sheen 1.4s infinite;
  }
  @keyframes sheen{100%{transform:translateX(100%);}}
  .sk-note{
    display:flex;align-items:center;gap:10px;justify-content:center;
    font-size:13px;color:var(--text-muted);padding:2px 0 6px;
  }
  .sk-note .spinner{width:16px;height:16px;border-width:2px;margin:0;}
  @media (prefers-reduced-motion:reduce){ .sk::after{animation:none;} }

  .loading-state, .error-state{
    text-align:center;padding:80px 20px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text-muted);font-size:13.5px;box-shadow:var(--shadow-card);
  }
  .error-state{color:var(--negative);}
  .spinner{
    width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);
    margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .filter-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow-card);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    position:sticky;top:var(--sticky-top, 60px);z-index:30;
  }
  .filter-group{display:flex;align-items:center;gap:8px;}
  .filter-group label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .filter-bar input[type="date"]{
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:8px 11px;font-family:var(--font-mono);font-size:12.5px;color:var(--text);
    color-scheme:light;
  }
  .filter-bar input[type="date"]:hover{border-color:var(--text-faint);}
  .filter-bar input[type="date"]:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft);}
  .filter-presets{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;}
  .preset-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;font-size:12px;color:var(--text-muted);font-family:var(--font-ui);font-weight:600;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .preset-btn:hover{border-color:var(--accent-ink);color:var(--text);}
  .preset-btn.active{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink);}
  .filter-range-label{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

  .section{margin-bottom:28px;}
  .section:not(:last-child){padding-bottom:24px;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .section-title{
    font-size:21px;font-weight:800;margin:0 0 4px;color:var(--text);letter-spacing:-0.025em;
    display:inline-flex;align-items:center;gap:9px;
  }
  .section-title::after{
    content:'';height:3px;width:26px;border-radius:2px;background:var(--accent-grad);flex-shrink:0;
  }
  .section-sub{font-size:12px;color:var(--text-muted);}

  /* Descriptions under headings stay in the page (the renderers keep writing
     them) but are not shown; a "?" beside the heading opens them in a popup
     instead (see syncHints / showHint). */
  .topbar .sub, .section-sub, .card-sub, .deep-subtext.intro, .coverage-note{display:none !important;}
  .hint{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:18px;height:18px;border-radius:50%;margin-inline-start:8px;vertical-align:middle;
    font-family:var(--font-ui);font-size:11px;font-weight:700;line-height:1;letter-spacing:0;
    color:var(--text-muted);background:var(--surface-3);border:1px solid var(--border-strong);
    cursor:help;user-select:none;-webkit-user-select:none;
    transition:background .15s, color .15s, border-color .15s;
  }
  .section-title .hint{margin-inline-start:0;}   /* the title's own flex gap spaces it */
  /* On touch screens the "?" is a thing to tap; iOS also needs the pointer
     cursor before it will report the tap at all. A bigger target helps too. */
  @media (hover:none){ .hint{cursor:pointer;width:22px;height:22px;font-size:12px;} }
  .hint:hover, .hint:focus-visible, .hint.open{
    outline:none;background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-ink);
  }
  #hintPop{
    position:fixed;top:0;left:0;z-index:300;max-width:min(360px, calc(100vw - 24px));
    background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow-pop);padding:10px 14px;
    font-family:var(--font-ui);font-size:12px;font-weight:400;line-height:1.9;text-align:right;
    pointer-events:none;visibility:hidden;opacity:0;transform:translateY(4px);
    transition:opacity .12s, transform .12s, visibility 0s linear .12s;
  }
  #hintPop.show{visibility:visible;opacity:1;transform:none;transition:opacity .12s, transform .12s;}
  #hintPop b{font-family:var(--font-mono);font-weight:700;}
  #hintPop .hint-sep{border:none;border-top:1px solid var(--border);margin:8px 0;}
  .campaign-select{
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:8px 11px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);
    min-width:180px;color-scheme:light;
  }
  .campaign-select:focus{outline:none;border-color:var(--accent-ink);}
  .coverage-note{
    font-size:11.5px;color:var(--text-muted);margin-bottom:14px;background:var(--surface-2);
    border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:9px 12px;line-height:1.9;
  }
  .coverage-note b{color:var(--text);font-family:var(--font-mono);}
  .error-inline{
    grid-column:1/-1;background:var(--negative-soft);color:var(--negative);border-radius:var(--radius-xs);
    padding:12px 16px;font-size:13px;
  }

  .section-head-left{display:flex;align-items:center;gap:13px;}
  .section-logo{
    width:48px;height:48px;border-radius:16px;object-fit:contain;padding:6px;
    background:#fff;border:1px solid var(--border);flex-shrink:0;
    box-shadow:0 6px 18px -8px var(--accent), 0 1px 2px rgba(16,24,40,.06);
    transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s;
  }
  .section-head:hover .section-logo{transform:translateY(-1px) scale(1.02);box-shadow:0 10px 22px -8px var(--accent), 0 1px 2px rgba(16,24,40,.08);}
  .section-logo.wide{width:auto;max-width:132px;}
  .section-controls{display:flex;align-items:center;gap:10px;}
  .ms-dropdown{position:relative;}
  .dim-filter{display:inline-block;margin:2px 0 10px;}
  .seg-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;}
  .seg-chips[hidden]{display:none;}
  .seg-chips-label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .seg-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);
    background:var(--accent-soft);border:1px solid var(--accent-ink);border-radius:999px;padding:4px 6px 4px 12px;
  }
  .seg-chip b{font-weight:700;}
  .seg-chip-x{border:none;background:none;cursor:pointer;color:var(--accent-ink);font-size:12px;padding:0 6px;line-height:1;}
  .seg-more{
    margin-top:10px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:6px 14px;
  }
  .seg-more:hover{border-color:var(--accent-ink);}
  .ms-toggle{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:8px 15px;font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--text);

  .ms-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:280px;max-width:420px;
    max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);

  .ms-search-wrap{position:sticky;top:-8px;background:var(--surface);padding:2px 2px 8px;z-index:2;}

    border-radius:8px;padding:7px 10px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);

  .ms-empty{padding:10px 8px;font-size:12px;color:var(--text-muted);text-align:center;}
  .ms-option{
    display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:6px;font-size:12.5px;

  .ms-option:hover{background:var(--surface-2);}

  /* .ms-option sets display:flex, which would otherwise beat the browser's
     own [hidden] rule and leave filtered-out rows on screen. */
  .ms-option[hidden]{display:none;}
  /* Campaign names are long and the end of one is often the part that tells
     them apart, so a name wraps onto a second line rather than being cut. */
  .ms-option-label{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.6;}

  .section-filter-bar{margin-bottom:14px;}

  /* The project switcher is one pill floating on the cream. The pill is drawn
     by ::before rather than by the bar itself, because the bar has to bleed to
     the window edges to hide content scrolling under it while the pill stays
     inset. The buttons are position:relative, so they paint over it. */
  .tab-bar{
    display:flex;gap:3px;margin-bottom:18px;border-bottom:none;flex-wrap:wrap;align-items:stretch;
    position:sticky;top:0;z-index:70;
    background:linear-gradient(180deg, var(--bg) 74%, rgba(247,243,234,.93));

  .tab-bar::before{
    content:'';position:absolute;inset:12px var(--gutter);border-radius:28px;

    border:1px solid #E7DECB;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);

  .tab-btn{
    position:relative;display:flex;align-items:center;gap:8px;background:none;border:none;

    color:var(--text-muted);cursor:pointer;
    transition:color .18s, background .18s, box-shadow .18s;
  }
  /* The chosen project is the one white pill, with its brand colour as a dot. */
  .tab-btn::after{
    content:'';width:0;height:6px;border-radius:99px;flex-shrink:0;
    background:var(--tab-accent, var(--text));

  .tab-btn.active::after{width:6px;}
  .tab-btn img{width:22px;height:22px;border-radius:7px;object-fit:contain;background:#fff;padding:1px;flex-shrink:0;}
  .tab-btn img.wide{width:auto;max-width:72px;border-radius:5px;}

  .sub-tab-bar{

  /* display:flex would otherwise beat the browser's own [hidden] rule and

  .sub-tab-bar[hidden]{display:none;}
  .sub-tab-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;

  }
  .sub-tab-btn:hover{color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-card);}

  .filter-name{

  .copy-name.copy-icon{
    border-bottom:none;margin-inline-start:6px;width:20px;height:20px;border-radius:6px;

  .copy-name.copy-failed::after{content:'کپی نشد';background:var(--negative);color:#fff;opacity:1;transform:translateY(0);}
  .cpa-table tr:last-child td{border-bottom:none;}
  .cpa-table td.muted{color:var(--text-muted);}

  @media (max-width:900px){

    .tab-bar{

      padding-top:8px;padding-bottom:8px;

      border-bottom:1px solid #E7DECB;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;

    .tab-bar::-webkit-scrollbar{display:none;}
    .tab-bar::before{display:none;}
    .tab-btn{flex-shrink:0;white-space:nowrap;padding:8px 12px;font-size:13px;gap:7px;scroll-snap-align:center;}

    .sub-tab-bar{

    .filter-bar input[type="date"]{width:100%;min-width:0;padding:8px 8px;font-size:12px;}
    .filter-presets{

    .filter-range-label{width:100%;}

    .section{margin-bottom:20px;}
    .section:not(:last-child){padding-bottom:12px;}
    .section-head{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:12px;}
    .section-head-left{gap:11px;}
    .section-logo{width:42px;height:42px;border-radius:14px;padding:5px;}
    .section-logo.wide{max-width:96px;}
    .section-title{font-size:18px;}
    .section-sub{font-size:11.5px;line-height:1.7;}
    .section-controls{flex-wrap:wrap;gap:8px;width:100%;}

  }
</style>

<div class="wrap">

      </div>
      <div>
        <h1>Management Dashboard</h1>

    <div class="skeleton-wrap">
      <div class="sk-row">
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
        <div class="sk sk-card"></div><div class="sk sk-card"></div>

<script>
(function(){
"use strict";

async function fetchSheetData(spreadsheetId, sheet){
  const res = await fetch(`/api/sheet-data?spreadsheetId=${encodeURIComponent(spreadsheetId)}&sheet=${encodeURIComponent(sheet)}`);
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'sheet not accessible');
  return json.data;
}

function setStatus(kind, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (kind==='live'?' live':kind==='err'?' err':' loading');
  t.textContent = text;
}

// Google Sheets hands us whatever the cell *displays*, so numbers arrive in
// whatever locale/format the sheet is using: Persian or Arabic-Indic digits,
// "٬" or a space as thousands separator, "٫" as decimal separator, RTL marks,
// a currency suffix, "(1,234)" for negatives. Anything we fail to read here
// silently becomes 0 and a day's cost comes out short, so parse defensively.
const DIGIT_MAP = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
                   '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function latinizeDigits(str){
  return String(str).replace(/[۰-۹٠-٩]/g, ch => DIGIT_MAP[ch]);
}
function toNumber(v){
  if(v===null||v===undefined) return 0;
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  let s = latinizeDigits(String(v)).replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,'').trim();
  if(!s) return 0;
  s = s.replace(/[−–—]/g, '-');                   // unicode minus variants
  // Only a leading/trailing sign or wrapping parens mean negative — the "-" in
  // an exponent like 1.48E-08 must not flip the whole number.
  const negative = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
  s = s.replace(/٫/g, '.');                       // Persian decimal separator
  s = s.replace(/[\s\u00A0\u066C٬،']/g, '');      // thousands separators
  // Scientific notation: a narrow or Scientific-formatted Cost column makes
  // Sheets display "1.48E+08", which stripped of its letters would read as 1.48.
  const sci = s.match(/(\d+(?:[.,]\d+)?)[eE]([+-]?\d+)/);
  if(sci){
    const n = parseFloat(sci[1].replace(',', '.')) * Math.pow(10, parseInt(sci[2], 10));
    if(!isFinite(n)) return 0;
    return negative ? -Math.abs(n) : n;
  }
  s = s.replace(/[^0-9.,]/g, '');                 // currency text, signs, etc.
  if(!s) return 0;
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma >= 0 && lastDot >= 0){
    // Both present: whichever comes last is the decimal separator.
    if(lastComma > lastDot) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(lastComma >= 0){
    // Only commas: repeated, or grouping exactly 3 digits => thousands.
    const parts = s.split(',');
    s = (parts.length > 2 || parts[1].length === 3) ? parts.join('') : parts.join('.');
  } else if((s.match(/\./g)||[]).length > 1){
    s = s.replace(/\./g,'');                      // 1.234.567 style thousands
  }
  const n = parseFloat(s);
  if(isNaN(n)) return 0;
  return negative ? -Math.abs(n) : n;
}
function normCampaign(c){ return String(c||'').trim().toLowerCase(); }
// Sheet cells come back as numbers when they hold one, so never call string
// methods on a raw cell — go through here.
function cellText(v){ return (v===null || v===undefined) ? '' : String(v).trim(); }
// Dates must all end up in the same YYYYMMDD shape: the date-range filter and
// the day sort compare them as plain strings, so a single row formatted as
// "2026-09-01" would sort and filter as if it were a different era and its
// cost would drop out of the chart.
function normDate(d){
  let s = latinizeDigits(String(d||'')).replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,'').trim();
  if(!s) return '';
  const ymd = s.match(/^(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})/);
  if(ymd) return ymd[1] + String(ymd[2]).padStart(2,'0') + String(ymd[3]).padStart(2,'0');
  // Month-first dates, the shape Sheets exports in an en-US locale
  // ("7/5/2026", "7/15/26"). Two-digit years are this century.
  const mdy = s.match(/^(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{2,4})$/);
  if(mdy){
    const year = mdy[3].length === 2 ? '20' + mdy[3] : mdy[3];
    return year + String(mdy[1]).padStart(2,'0') + String(mdy[2]).padStart(2,'0');
  }
  const digitsOnly = s.replace(/\D/g,'');
  if(digitsOnly.length === 8) return digitsOnly;
  if(digitsOnly.length === 14) return digitsOnly.slice(0,8); // timestamp
  // A true date cell read unformatted comes back as a Sheets serial number
  // (days since 1899-12-30). 8-digit YYYYMMDD values are far above this range.
  if(/^\d{5}$/.test(s)){
    const d = new Date(Date.UTC(1899,11,30) + Number(s)*86400000);
    return String(d.getUTCFullYear()) + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0');
  }
  return s;
}
function fmtDateLabel(yyyymmdd){
  const s = String(yyyymmdd);
  if(s.length !== 8) return s;
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fmtNum(n, digits){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{maximumFractionDigits: digits===undefined?0:digits, minimumFractionDigits: digits===undefined?0:digits});
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return fmtNum(n,0) + ' تومان';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function todayStr(){
  const d = new Date();
  return String(d.getFullYear()) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function toInputDate(yyyymmdd){
  const s = String(yyyymmdd);
  return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
}
function fromInputDate(isoDate){
  return isoDate.replace(/-/g,'');
}

// Each project paints with its own brand: `accent` is the brand color itself
// (cost columns, rules, meters), `ink` is that same color stepped dark enough
// to read as text on white (tab labels, KPI figures), and `accent2` is the
// second series — the CPA/CPI line. Where a brand's second color is black or
// white, the line takes a near-black ink instead: white is the page here, and
// a neutral line next to a colored column keeps the two series far apart.
const BRAND_INK = '#1B1F27';
function brandTheme(accent, ink, accent2, softAlpha, grad){
  const h = accent.replace('#','');
  const rgb = [0,2,4].map(i=>parseInt(h.substring(i,i+2),16)).join(',');
  return {accent, ink, accent2, accentSoft:`rgba(${rgb},${softAlpha})`, ...(grad?{grad}:{})};
}

// extraCols are further conversion columns the section reports a cost-per for
// (Deposit, Purchase…). They ride along as `extras` so the join and the range
// filter treat them exactly like the main conversion.
function normalizeRefRows(rows, conversionCol, installsCol, adgroupCol, creativeCol, extraCols){
  adgroupCol = adgroupCol || 'Adgroup';
  creativeCol = creativeCol || 'Creative';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaignRaw = r['Campaign'];
    const campaign = normCampaign(campaignRaw);
    if(!date || !campaign) return null;
    return {
      date, campaign, campaignLabel: cellText(campaignRaw),
      adgroup: cellText(r[adgroupCol]) || '(بدون Adgroup)',
      creative: cellText(r[creativeCol]) || '(بدون Creative)',
      installs: installsCol ? toNumber(r[installsCol]) : 0,
      conversion: toNumber(r[conversionCol]),
      extras: (extraCols||[]).reduce((acc,col)=>{ acc[col] = toNumber(r[col]); return acc; }, {})
    };
  }).filter(Boolean);
}
function addExtras(target, extras){
  Object.entries(extras||{}).forEach(([k,v])=>{ target[k] = (target[k]||0) + v; });
  return target;
}
function normalizeCostRows(rows, impressionsCol, clicksCol, diag, extraCols){
  impressionsCol = impressionsCol || 'Impressions';
  clicksCol = clicksCol || 'Clicks';
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    const cost = toNumber(r['Cost']);
    const rawCost = String(r['Cost']===undefined||r['Cost']===null ? '' : r['Cost']).trim();
    if(!date || !campaign){
      // A total row, a stray note, or a row whose Date/Campaign cell is empty.
      // Its cost never reaches the chart, so count it instead of losing it.
      if(diag && (rawCost || date || campaign)){ diag.skippedRows++; diag.skippedCost += cost; }
      return null;
    }
    // Cell had something in it but we read 0 — an unsupported number format.
    if(diag && rawCost && !/^[0-]*$/.test(latinizeDigits(rawCost).replace(/\D/g,'')||'0') && cost===0) diag.unreadableCost++;
    return {date, campaign, campaignLabel: cellText(r['Campaign']),
            cost, impressions: toNumber(r[impressionsCol]), clicks: toNumber(r[clicksCol]),
            extras: (extraCols||[]).reduce((acc,col)=>{ acc[col] = toNumber(r[col]); return acc; }, {})};
  }).filter(Boolean);
}

// Blend Data: one row per day + campaign, carrying what the panel really cost
// (Cost R) and what was declared to the client (Cost).
function normalizeBlendRows(rows){
  return rows.map(r=>{
    const date = normDate(r['Date']);
    const campaign = normCampaign(r['Campaign']);
    if(!date || !campaign) return null;
    return {
      date, campaign,
      campaignLabel: cellText(r['Campaign']),
      campaignName: cellText(r['Campaign Name']) || '(بدون نام)',
      sessions: toNumber(r['Sessions']),
      impressions: toNumber(r['Impression']),
      clicks: toNumber(r['Click']),
      costReal: toNumber(r['Cost R']),
      cost: toNumber(r['Cost'])
    };
  }).filter(Boolean);
}
// Budgeting: one row per campaign. Total Budget is the only figure that isn't
// derived from Blend Data, but the rest is read from here too so the dashboard
// agrees with the sheet the client is shown.
function normalizeBudgetRows(rows){
  return rows.map(r=>{
    const campaign = normCampaign(r['Campaign']);
    if(!campaign) return null;
    return {
      campaign,
      campaignLabel: cellText(r['Campaign']),
      campaignName: cellText(r['Campaign Name']) || '(بدون نام)',
      totalBudget: toNumber(r['Total Budget']),
      spent: toNumber(r['Spent']),
      remaining: toNumber(r['Remaining Budget']),
      spentPanel: toNumber(r['Spent (Panel)']),
      profit: toNumber(r['Profit'])
    };
  }).filter(Boolean);
}

// Profit only accrues on declared cost that is still inside the campaign's
// budget: profit = min(declared so far, budget) - real cost. Walking each
// campaign's days in order turns that into a daily number whose total matches
// the Budgeting sheet's Profit column.
function budgetNameFilter(project){
  const st = projectState[project.id];
  if(!st || st.campaigns === 'ALL') return () => true;
  return name => st.campaigns.has(normCampaign(name));
}
// The second slot: a campaign key inside the selected Campaign Names.
function budgetCampaignFilter(project){
  const st = projectState[project.id];
  if(!st || !st.subCampaigns || st.subCampaigns === 'ALL') return () => true;
  return key => st.subCampaigns.has(key);
}
function buildBudgetDaily(project, window){
  const {from, to} = window || sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inName = budgetNameFilter(project);
  const inCampaign = budgetCampaignFilter(project);
  const byCampaign = {};
  // The cumulative walk needs every day of a campaign, but only the selected
  // Campaign Names and campaigns take part at all.
  (project.rawBlend||[]).filter(r=>inName(r.campaignName) && inCampaign(r.campaign))
    .forEach(r=>{ (byCampaign[r.campaign] = byCampaign[r.campaign] || []).push(r); });

  const byDate = {};
  Object.entries(byCampaign).forEach(([key, rows])=>{
    rows.sort((a,b)=>a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const budgetRow = project.budgetByCampaign[key];
    const budget = budgetRow ? budgetRow.totalBudget : Infinity;
    let declared = 0;
    rows.forEach(r=>{
      const before = Math.min(declared, budget);
      declared += r.cost;
      const billable = Math.min(declared, budget) - before;  // today's part still inside the budget
      if(!inRange(r.date)) return;
      const d = byDate[r.date] = byDate[r.date] || {cost:0, costReal:0, profit:0, sessions:0};
      d.cost += r.cost;
      d.costReal += r.costReal;
      d.sessions += r.sessions;
      d.profit += billable - r.costReal;
    });
  });

  const keys = Object.keys(byDate).sort();
  return {
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>byDate[k].cost),
    costReal: keys.map(k=>byDate[k].costReal),
    profit: keys.map(k=>byDate[k].profit),
    sessions: keys.map(k=>byDate[k].sessions),
    totals: keys.reduce((t,k)=>({cost:t.cost+byDate[k].cost, costReal:t.costReal+byDate[k].costReal,
                                 profit:t.profit+byDate[k].profit, sessions:t.sessions+byDate[k].sessions}),
                        {cost:0, costReal:0, profit:0, sessions:0}),
    dayCount: keys.length
  };
}

// Budget figures are lifetime by nature, so they ignore the date filter.
function buildBudgetTable(project){
  const inName = budgetNameFilter(project);
  const inCampaign = budgetCampaignFilter(project);
  const rows = (project.rawBudget||[]).filter(r=>inName(r.campaignName) && inCampaign(r.campaign))
    .sort((a,b)=>b.totalBudget - a.totalBudget);
  const totals = rows.reduce((t,r)=>({
    totalBudget: t.totalBudget + r.totalBudget, spent: t.spent + r.spent,
    remaining: t.remaining + r.remaining, spentPanel: t.spentPanel + r.spentPanel, profit: t.profit + r.profit
  }), {totalBudget:0, spent:0, remaining:0, spentPanel:0, profit:0});

  const byName = {};
  rows.forEach(r=>{
    const g = byName[r.campaignName] = byName[r.campaignName] ||
      {name:r.campaignName, totalBudget:0, spent:0, remaining:0, profit:0, campaigns:0};
    g.totalBudget += r.totalBudget; g.spent += r.spent; g.remaining += r.remaining;
    g.profit += r.profit; g.campaigns++;
  });
  const groups = Object.values(byName).map(g=>({
    ...g,
    remainingPct: g.totalBudget>0 ? Math.max(0, Math.min(100, g.remaining/g.totalBudget*100)) : 0,
    spentPct: g.totalBudget>0 ? Math.max(0, Math.min(100, g.spent/g.totalBudget*100)) : 0
  })).sort((a,b)=>b.totalBudget - a.totalBudget);

  return {rows, totals, groups};
}

// The second source's conversions in a window, under the same campaign filter
// as everything else on the section — the two counts compare like for like.
function cmpConvRows(project, window){
  const st = projectState[project.id];
  const {from, to} = window || sectionRange(project);
  return (project.rawCmpConv || []).filter(r=>(!from || r.date >= from) && (!to || r.date <= to)
    && (st.campaigns === 'ALL' || st.campaigns.has(r.campaign)));
}
// How far the second source's count sits from the dashboard's own, as a share
// of the dashboard's own: (GA4 − Yektanet) ÷ Yektanet.
function cmpDiffPct(own, other){
  return own > 0 ? (other - own) / own * 100 : null;
}
function fmtDiffPct(pct){
  if(pct === null) return '—';
  return (pct > 0 ? '+' : pct < 0 ? '−' : '') + Math.abs(pct).toFixed(0) + '٪';
}

function aggregateRef(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {date:r.date, campaign:r.campaign, campaignLabel:r.campaignLabel, installs:0, conversion:0, extras:{}};
    map[key].installs += r.installs;
    map[key].conversion += r.conversion;
    addExtras(map[key].extras, r.extras);
  });
  return map;
}
function aggregateCost(rows){
  const map = {};
  rows.forEach(r=>{
    const key = r.date + '||' + r.campaign;
    if(!map[key]) map[key] = {date:r.date, campaign:r.campaign, campaignLabel:r.campaignLabel, cost:0, impressions:0, clicks:0, extras:{}};
    map[key].cost += r.cost;
    addExtras(map[key].extras, r.extras);
    map[key].impressions += r.impressions;
    map[key].clicks += r.clicks;
  });
  return map;
}
// With includeUnmatchedCost, a day+campaign that spent but has no row in the
// conversion sheet still contributes its cost — an overview reports the whole
// spend of the cost sheet, not only the part that joined.
function buildJoinedRows(refMap, costMap, includeUnmatchedCost){
  const joined = [];
  let matchedCost = 0;
  const keys = includeUnmatchedCost
    ? Array.from(new Set([...Object.keys(refMap), ...Object.keys(costMap)]))
    : Object.keys(refMap);
  keys.forEach(key=>{
    const base = refMap[key];
    const costRow = costMap[key];
    const cost = costRow ? costRow.cost : 0;
    if(costRow && base) matchedCost += costRow.cost;
    const conversion = base ? base.conversion : 0;
    joined.push({
      date: base ? base.date : costRow.date,
      campaign: base ? base.campaign : costRow.campaign,
      campaignLabel: base ? base.campaignLabel : (costRow.campaignLabel || costRow.campaign),
      installs: base ? base.installs : 0,
      conversion,
      extras: base ? base.extras : {},
      // Further columns read from the cost sheet itself (KYC on Talaeen's).
      costExtras: costRow ? costRow.extras : {},
      cost, cpa: conversion>0 ? (cost/conversion) : null
    });
  });
  const totalCostInSheet = Object.values(costMap).reduce((s,r)=>s+r.cost,0);
  return {joined, matchedCost, totalCostInSheet, unmatchedCost: totalCostInSheet - matchedCost};
}
function groupByDateGeneric(joined){
  const map = {};
  joined.forEach(r=>{
    if(!map[r.date]) map[r.date] = {cost:0, conversion:0, installs:0, extras:{}, costExtras:{}};
    map[r.date].cost += r.cost; map[r.date].conversion += r.conversion;
    map[r.date].installs += r.installs || 0;
    addExtras(map[r.date].extras, r.extras);
    addExtras(map[r.date].costExtras, r.costExtras);
  });
  const keys = Object.keys(map).sort();
  return {
    dates: keys,
    byDate: map,
    labels: keys.map(fmtDateLabel),
    cost: keys.map(k=>map[k].cost),
    conversion: keys.map(k=>map[k].conversion),
    installs: keys.map(k=>map[k].installs),
    cpaSeries: keys.map(k=> map[k].conversion>0 ? (map[k].cost/map[k].conversion) : null)
  };
}
// A daily series laid onto another day list: a campaign group's CPI drawn
// against the overall days, with a gap where the group had no row.
function seriesOn(dates, daily, fn){
  return dates.map(d => daily.byDate[d] ? fn(daily.byDate[d]) : null);
}
// Cost per an extra conversion column (Deposit, Signup…), per day and over the
// range. With `since`, cost counts only from the first day the column was ever
// filled in — before that day the sheet simply did not track it, and pricing
// those days' spend against zero conversions would only inflate the figure.
function extraSinceDate(project, col){
  const dates = (project.allRef || project.rawRef || [])
    .filter(r => r.extras && r.extras[col] > 0).map(r => r.date).sort();
  return dates[0] || null;
}
function costPerExtra(project, m, joined){
  const since = m.sinceFirst ? extraSinceDate(project, m.col) : null;
  const rows = since ? joined.filter(r => r.date >= since) : joined;
  const cost = rows.reduce((t,r)=>t+r.cost, 0);
  const total = rows.reduce((t,r)=>t + ((r.extras && r.extras[m.col]) || 0), 0);
  return {since, cost, total, per: total>0 ? cost/total : null};
}
function costPerExtraDaily(m){
  return day => day.extras[m.col] > 0 ? day.cost / day.extras[m.col] : null;
}

// Sessions as Yektanet reports them vs. sessions as GA4 reports them, per day.
// This is a pure day-to-day comparison: campaign names are ignored on both
// sides — no matching between the tabs, and neither the campaign multi-select
// nor the project's own campaign filter applies, since the two sources don't
// name campaigns the same way. Each day is simply the whole tab's total for
// that day. The section's date range still applies.
// The gap is measured against GA4: (Yektanet − GA4) / GA4.
function buildSessionsComparison(project){
  const {from, to} = sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const byDate = {};
  const bucket = d => (byDate[d] = byDate[d] || {own:0, other:0});
  (project.allRef||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.date).own += r.installs; });
  (project.rawCompare||[]).forEach(r=>{ if(inRange(r.date)) bucket(r.date).other += r.sessions; });
  const keys = Object.keys(byDate).sort();
  return {
    labels: keys.map(fmtDateLabel),
    own: keys.map(k=>byDate[k].own),
    other: keys.map(k=>byDate[k].other),
    diffPct: keys.map(k=> byDate[k].other>0 ? ((byDate[k].own - byDate[k].other)/byDate[k].other*100) : null)
  };
}

// A budget section filters by Campaign Name, listing each group's total budget.
function getBudgetNameOptions(project){
  const byKey = {};
  (project.rawBudget||[]).forEach(r=>{
    const key = normCampaign(r.campaignName);
    const o = byKey[key] = byKey[key] || {key, label:r.campaignName, cost:0};
    o.cost += r.totalBudget;
  });
  (project.rawBlend||[]).forEach(r=>{
    const key = normCampaign(r.campaignName);
    if(!byKey[key]) byKey[key] = {key, label:r.campaignName, cost:0};
  });
  return Object.values(byKey).sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}

// The campaigns themselves (not their Campaign Name group), so a budget
// section can be narrowed to one campaign the same way the others are.
function getBudgetCampaignOptions(project){
  const byKey = {};
  (project.rawBudget||[]).forEach(r=>{
    const o = byKey[r.campaign] = byKey[r.campaign] || {key:r.campaign, label:r.campaignLabel || r.campaign, cost:0};
    o.cost += r.totalBudget;
  });
  (project.rawBlend||[]).forEach(r=>{
    if(!byKey[r.campaign]) byKey[r.campaign] = {key:r.campaign, label:r.campaignLabel || r.campaign, cost:0};
  });
  return Object.values(byKey).sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}

// Campaign options sorted by total cost (desc); label falls back to the raw key.
function getCampaignOptionsSortedByCost(project){
  const costByCampaign = {};
  project.rawCost.forEach(r=>{ costByCampaign[r.campaign] = (costByCampaign[r.campaign]||0) + r.cost; });
  const labelByCampaign = {};
  project.rawRef.forEach(r=>{ if(!labelByCampaign[r.campaign]) labelByCampaign[r.campaign] = r.campaignLabel; });
  // A campaign the section can never show has no business in its filter: when
  // only matched cost counts, the conversion sheet decides what exists here,
  // so a campaign that appears solely in the cost sheet is left out.
  const allKeys = project.includeUnmatchedCost
    ? new Set([...Object.keys(costByCampaign), ...Object.keys(labelByCampaign)])
    : new Set(Object.keys(labelByCampaign));
  return Array.from(allKeys).map(k=>({
    key: k, label: labelByCampaign[k] || k, cost: costByCampaign[k] || 0
  })).sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}

function renderError(msg){
  document.getElementById('mainContent').innerHTML = `<div class="error-state">${msg}</div>`;
  setStatus('err','خطا در دریافت داده');

// ---------- Global date range (applies to projects without their own filter) ----------
let sheetMinDate = null;
let sheetMaxDate = null;
let currentFrom = null;
let currentTo = null;

function sectionRange(project){
  const st = projectState[project.id];
  return project.ownDateFilter ? {from: st.from, to: st.to} : {from: currentFrom, to: currentTo};
}
// ---------- Ad group / creative filter ----------
// Picked by clicking a name in the Ad group / Creative tables. Those live only
// on the conversion side, so filtering to one also needs its share of the
// spend: each campaign's cost for a day is split by that day's installs, the
// same way the tables price an ad group or a creative.
const SEG_DIMS = [{key:'adgroup', label:'Adgroup'}, {key:'creative', label:'Creative'}];
function segSel(project){
  const st = projectState[project.id];
  st.segSel = st.segSel || {adgroup:'ALL', creative:'ALL'};
  return st.segSel;
}
function segActive(project){
  const sel = segSel(project);
  return sel.adgroup !== 'ALL' || sel.creative !== 'ALL';
}
function segKeep(project){
  const sel = segSel(project);
  return r => (sel.adgroup === 'ALL' || sel.adgroup.has(r.adgroup))
           && (sel.creative === 'ALL' || sel.creative.has(r.creative));
}
// Narrow a range's conversion and cost rows to the picked ad groups /
// creatives: conversion rows simply filter, cost rows keep the picked share
// of each campaign-day.
function applySegFilter(project, refRows, costRows){
  if(!segActive(project)) return {refRows, costRows};
  const keep = segKeep(project);
  const dayKey = r => r.date + '||' + r.campaign;
  const all = {}, picked = {};
  refRows.forEach(r=>{ all[dayKey(r)] = (all[dayKey(r)] || 0) + r.installs; });
  const segRows = refRows.filter(keep);
  segRows.forEach(r=>{ picked[dayKey(r)] = (picked[dayKey(r)] || 0) + r.installs; });
  const scale = (obj, k) => obj ? Object.fromEntries(Object.entries(obj).map(([c,v])=>[c, v*k])) : obj;
  const segCost = costRows.map(r=>{
    const a = all[dayKey(r)] || 0, b = picked[dayKey(r)] || 0;
    const share = a > 0 ? b / a : 0;
    return share > 0 ? {...r, cost: r.cost*share, impressions: r.impressions*share, clicks: r.clicks*share,
                        extras: scale(r.extras, share)} : null;
  }).filter(Boolean);
  return {refRows: segRows, costRows: segCost};
}
// The active ad group / creative picks, as chips above the cards; each one's
// ✕ drops it.
function renderSegChips(project){
  const el = document.getElementById(`segChips-${project.id}`);
  if(!el) return;
  const sel = segSel(project);
  const chips = [];
  SEG_DIMS.forEach(d=>{
    if(sel[d.key] === 'ALL') return;
    sel[d.key].forEach(v=>chips.push(`<span class="seg-chip">${escapeHtml(d.label)}: <b>${escapeHtml(v)}</b>
      <button type="button" class="seg-chip-x" data-project="${escapeHtml(project.id)}" data-dim="${d.key}" data-key="${escapeHtml(v)}" aria-label="حذف فیلتر">✕</button></span>`));
  });
  el.hidden = !chips.length;
  el.innerHTML = chips.length ? `<span class="seg-chips-label">فیلتر:</span>${chips.join('')}` : '';
}
// An ad group / creative name in a table: clicking it narrows the section to
// it, clicking it again (while it is the only one picked) clears it.
function segFilterName(project, dim, key, label){
  const sel = segSel(project)[dim];
  const isOnly = sel !== 'ALL' && sel.size === 1 && sel.has(key);
  return `<button type="button" class="filter-name${isOnly?' active':''}"
    data-project="${escapeHtml(project.id)}" data-seg="${dim}" data-key="${escapeHtml(key)}"
    title="${isOnly ? 'کلیک کن تا فیلتر برداشته بشه' : 'کلیک کن تا داشبورد روی همین فیلتر بشه'}"
    >${escapeHtml(label == null ? key : label)}</button>`;
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-name[data-seg], .seg-chip-x');
  if(!btn) return;
  const project = PROJECTS.find(p=>p.id === btn.dataset.project);
  if(!project) return;
  const dim = btn.dataset.seg || btn.dataset.dim;
  const sel = segSel(project);
  const cur = sel[dim];
  if(btn.classList.contains('seg-chip-x')){
    const next = new Set(cur === 'ALL' ? [] : cur);
    next.delete(btn.dataset.key);
    sel[dim] = next.size ? next : 'ALL';
  } else {
    const isOnly = cur !== 'ALL' && cur.size === 1 && cur.has(btn.dataset.key);
    sel[dim] = isOnly ? 'ALL' : new Set([btn.dataset.key]);
  }
  updateSection(project);
});

function computeSection(project, window){
  const st = projectState[project.id];
  const {from, to} = window || sectionRange(project);
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const inCampaign = c => st.campaigns === 'ALL' || st.campaigns.has(c);
  const {refRows: refFiltered, costRows: costFiltered} = applySegFilter(project,
    project.rawRef.filter(r=>inRange(r.date) && inCampaign(r.campaign)),
    project.rawCost.filter(r=>inRange(r.date) && inCampaign(r.campaign)));
  const refMap = aggregateRef(refFiltered);
  const costMap = aggregateCost(costFiltered);
  return buildJoinedRows(refMap, costMap, project.includeUnmatchedCost);
}

// ---------- Global filter bar (for projects without their own date filter) ----------
// toISOString() would answer in UTC, which is the day before for anyone east
// of Greenwich for part of the evening — these dates are calendar days as the
// person reading the screen sees them, so they are built from local parts.
function localIso(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// "Yesterday" means yesterday, but a sheet that hasn't been filled in yet would
// leave an empty page; when the data stops earlier, this lands on the newest
// day it has, and the date inputs show which day that was.
function yesterdayWithin(minDate, maxDate){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  let iso = localIso(d);
  if(maxDate && iso > toInputDate(maxDate)) iso = toInputDate(maxDate);
  if(minDate && iso < toInputDate(minDate)) iso = toInputDate(minDate);
  return iso;
}

// The Persian week opens on Saturday, so "this week" runs from the last
// Saturday up to the newest day the sheet has. Anchoring on that day rather
// than on today keeps the range non-empty when a sheet lags a few days — and
// since the dashboard ends at yesterday, asking for it on a Saturday gives the
// week that just finished rather than a range of zero days.
function weekStartFor(yyyymmdd){
  const d = new Date(toInputDate(yyyymmdd));
  d.setDate(d.getDate() - ((d.getDay() + 1) % 7));   // Sat=6 -> 0 days back
  return localIso(d);
}

        <button class="preset-btn" id="presetWeek">از شنبه</button>

function setGlobalPreset(days, btn){
  document.querySelectorAll('#mainContent .preset-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(days === null){
    document.getElementById('fromDate').value = toInputDate(sheetMinDate);
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  } else if(days === 'yesterday'){
    const iso = yesterdayWithin(sheetMinDate, sheetMaxDate);
    document.getElementById('fromDate').value = iso;
    document.getElementById('toDate').value = iso;
  } else if(days === 'week'){
    const minIso = toInputDate(sheetMinDate);
    const weekIso = weekStartFor(sheetMaxDate);
    document.getElementById('fromDate').value = weekIso < minIso ? minIso : weekIso;
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  } else {
    const maxD = new Date(toInputDate(sheetMaxDate));
    const fromD = new Date(maxD);
    fromD.setDate(fromD.getDate() - (days - 1));
    const minD = new Date(toInputDate(sheetMinDate));
    const clampedFrom = fromD < minD ? minD : fromD;
    document.getElementById('fromDate').value = localIso(clampedFrom);
    document.getElementById('toDate').value = toInputDate(sheetMaxDate);
  }
  applyGlobalFilter();
}
function applyGlobalFilter(){
  const fromVal = document.getElementById('fromDate').value;
  const toVal = document.getElementById('toDate').value;
  currentFrom = fromVal ? fromInputDate(fromVal) : sheetMinDate;
  currentTo = toVal ? fromInputDate(toVal) : sheetMaxDate;
  PROJECTS.filter(p=>!p.ownDateFilter && !p.error).forEach(p=>updateSection(p));
  setStatus('live', 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
}

// ---------- Per-section date filter (for projects with ownDateFilter) ----------
function applyOwnDateFilter(project){
  const fromVal = document.getElementById(`ownFrom-${project.id}`).value;
  const toVal = document.getElementById(`ownTo-${project.id}`).value;
  projectState[project.id].from = fromVal ? fromInputDate(fromVal) : project.minDate;
  projectState[project.id].to = toVal ? fromInputDate(toVal) : project.maxDate;
  updateSection(project);
}
function setOwnPreset(project, days, btn){
  const wrap = document.getElementById(`section-${project.id}`);
  if(!wrap) return;
  if(!project.minDate || !project.maxDate){ updateSection(project); return; }
  wrap.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const fromInput = document.getElementById(`ownFrom-${project.id}`);
  const toInput = document.getElementById(`ownTo-${project.id}`);
  if(days === null){
    fromInput.value = toInputDate(project.minDate);
    toInput.value = toInputDate(project.maxDate);
  } else if(days === 'yesterday'){
    const iso = yesterdayWithin(project.minDate, project.maxDate);
    fromInput.value = iso;
    toInput.value = iso;
  } else if(days === 'week'){
    const minIso = toInputDate(project.minDate);
    const weekIso = weekStartFor(project.maxDate);
    fromInput.value = weekIso < minIso ? minIso : weekIso;
    toInput.value = toInputDate(project.maxDate);
  } else {
    const maxD = new Date(toInputDate(project.maxDate));
    const fromD = new Date(maxD);
    fromD.setDate(fromD.getDate() - (days - 1));
    const minD = new Date(toInputDate(project.minDate));
    const clampedFrom = fromD < minD ? minD : fromD;
    fromInput.value = localIso(clampedFrom);
    toInput.value = toInputDate(project.maxDate);
  }
  applyOwnDateFilter(project);

// ---------- Multi-select campaign filter ----------
// A section carries one multi-select per filter slot. Most have a single one
// (the campaign); the budget sections filter by Campaign Name and, inside it,
// by the campaign itself, so they have two.
// Each list shows only what the section's other filters leave in play (see
// slotScope); `universe` is every option the sheet has, which is what a
// selection is kept against, so narrowing the view never narrows the choice.
function filterSlots(project){
  const slots = [{
    key:'main', stateKey:'campaigns', suffix:'',
    unit: project.filterUnit || 'کمپین',
    allLabel: project.filterAllLabel || 'همه کمپین‌ها',
    universe: () => project.campaignOptions || []
  }];
  if(project.kind === 'budget'){
    slots.push({
      key:'sub', stateKey:'subCampaigns', suffix:'2',
      unit:'کمپین', allLabel:'همه کمپین‌ها',
      universe: () => project.subCampaignOptions || []
    });
  }
  slots.forEach(slot=>{ slot.options = () => scopedOptions(project, slot); });
  return slots;
}
// What the other filters leave for this list: a Map of option key -> the
// figure to show beside it (undefined keeps the option's own), or null when
// nothing narrows it.
//  - Campaign lists follow the date range: a campaign with no row in the
//    range drops out, and the figure beside each one is its spend in the range.
//  - The budget sections' two lists follow each other: picking Campaign Names
//    leaves only their campaigns, picking campaigns only their names.
function slotScope(project, slot){
  const st = projectState[project.id];
  if(!st) return null;
  if(project.kind === 'budget'){
    const pairs = [...(project.rawBudget || []), ...(project.rawBlend || [])]
      .map(r => [normCampaign(r.campaignName), r.campaign]);
    const other = slot.key === 'main' ? st.subCampaigns : st.campaigns;
    if(!other || other === 'ALL') return null;
    const scope = new Map();
    pairs.forEach(([name, camp])=>{
      if(slot.key === 'main' && other.has(camp)) scope.set(name, undefined);
      if(slot.key === 'sub' && other.has(name)) scope.set(camp, undefined);
    });
    return scope;
  }
  const {from, to} = sectionRange(project);
  if(!from && !to) return null;
  const inRange = d => (!from || d >= from) && (!to || d <= to);
  const scope = new Map();
  (project.rawRef || []).forEach(r=>{ if(inRange(r.date) && !scope.has(r.campaign)) scope.set(r.campaign, 0); });
  (project.rawCost || []).forEach(r=>{
    if(!inRange(r.date)) return;
    if(scope.has(r.campaign)) scope.set(r.campaign, scope.get(r.campaign) + r.cost);
    else if(project.includeUnmatchedCost) scope.set(r.campaign, r.cost);
  });
  return scope;
}
function scopedOptions(project, slot){
  const all = slot.universe();
  const scope = slotScope(project, slot);
  if(!scope) return all;
  const sel = slotState(project, slot);
  // A hand-picked few stay listed even out of scope, so they can be unticked.
  // A selection that holds most of the list ("all but these") is about what
  // was left out, so its inactive members drop out of view like the rest.
  const handPicked = sel !== 'ALL' && sel.size <= all.length / 2;
  const picked = k => handPicked && sel.has(k);
  return all.filter(o => scope.has(o.key) || picked(o.key))
    .map(o => {
      const v = scope.get(o.key);
      return v === undefined && scope.has(o.key) ? o : {...o, cost: v || 0};
    })
    .sort((a,b)=> b.cost - a.cost || a.label.localeCompare(b.label));
}
function slotState(project, slot){ return projectState[project.id][slot.stateKey]; }

function campaignButtonLabel(project, slot){
  const sel = slotState(project, slot);
  const opts = slot.universe();
  if(sel === 'ALL' || sel.size === opts.length) return slot.allLabel;
  if(sel.size === 0) return 'هیچ‌کدوم';
  if(sel.size === 1){
    const only = opts.find(o=>sel.has(o.key));
    return only ? only.label : `۱ ${slot.unit}`;
  }
  return `${sel.size} ${slot.unit} انتخاب شده`;
}
// Campaign names are typed in two alphabets and two sets of digits, so a
// search compares them flattened: Latin digits, lowercase, and the Arabic
// letters that stand in for Persian ones folded together.
function searchKey(str){
  return latinizeDigits(String(str == null ? '' : str))
    .toLowerCase()
    .replace(/[\u064A\u0649]/g, '\u06CC')   // ي / ى -> ی
    .replace(/\u0643/g, '\u06A9')           // ك -> ک
    .replace(/[\u200c\u200f\u200e]/g, ' ')  // zero-width and direction marks
    .trim();
}
// Typing in one panel must survive the re-render that every tick causes, so
// the query lives next to the selection rather than in the DOM.
function slotQuery(project, slot){
  const st = projectState[project.id];
  if(!st.search) st.search = {};
  return st.search[slot.key] || '';
}
// The options the current query leaves on screen — every option when the
// search box is empty.
function slotMatches(project, slot){
  const q = searchKey(slotQuery(project, slot));
  const opts = slot.options();
  if(!q) return opts;
  return opts.filter(o => searchKey(o.label + ' ' + o.key).includes(q));
}
function applySlotSearch(project, slot){
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!panel) return;
  const q = searchKey(slotQuery(project, slot));
  let shown = 0;
  panel.querySelectorAll('.ms-option[data-search]').forEach(row=>{
    const hit = !q || row.dataset.search.includes(q);
    row.hidden = !hit;
    if(hit) shown++;
  });
  const empty = panel.querySelector('.ms-empty');
  if(empty) empty.hidden = shown > 0;

  // While a search is on, the top row means "all the matches", not "all the
  // campaigns" — so it says so, and its tick follows only what's on screen.
  const matches = slotMatches(project, slot);
  const sel = slotState(project, slot);
  const isPicked = key => sel === 'ALL' || sel.has(key);
  const allCb = document.getElementById(`msAll${slot.suffix}-${project.id}`);
  const allLabel = document.getElementById(`msAllLabel${slot.suffix}-${project.id}`);
  if(allCb){
    const picked = matches.filter(o=>isPicked(o.key)).length;
    allCb.checked = matches.length > 0 && picked === matches.length;
    allCb.indeterminate = picked > 0 && picked < matches.length;
    allCb.disabled = matches.length === 0;
  }
  if(allLabel){
    allLabel.textContent = q
      ? `همه‌ی ${fmtNum(matches.length)} نتیجه‌ی «${slotQuery(project, slot).trim()}»`
      : slot.allLabel;
  }
}

function renderCampaignDropdown(project, slot){
  if(!slot) return filterSlots(project).forEach(sl=>renderCampaignDropdown(project, sl));
  const opts = slot.options();
  const universe = slot.universe();
  const sel = slotState(project, slot);
  const allSelected = sel === 'ALL' || sel.size === universe.length;
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!panel) return;
  const searchId = `msSearch${slot.suffix}-${project.id}`;
  const hadFocus = document.activeElement && document.activeElement.id === searchId;
  panel.innerHTML = `
    <div class="ms-search-wrap">
      <input type="search" class="ms-search" id="${searchId}" placeholder="جست‌وجوی ${escapeHtml(slot.unit)}…"
             value="${escapeHtml(slotQuery(project, slot))}" autocomplete="off">
    </div>
    <label class="ms-option ms-option-all">
      <input type="checkbox" id="msAll${slot.suffix}-${project.id}" ${allSelected?'checked':''}>
      <span id="msAllLabel${slot.suffix}-${project.id}">${escapeHtml(slot.allLabel)}</span>
    </label>
    <div class="ms-divider"></div>
    ${opts.map(o=>`
      <label class="ms-option" data-search="${escapeHtml(searchKey(o.label + ' ' + o.key))}">
        <input type="checkbox" class="ms-item${slot.suffix}-${project.id}" value="${escapeHtml(o.key)}" ${allSelected || (sel!=='ALL' && sel.has(o.key)) ? 'checked':''}>
        <span class="ms-option-label">${escapeHtml(o.label)}</span>
        <span class="ms-option-cost">${fmtMoney(o.cost)}</span>
      </label>`).join('')}
    <div class="ms-empty" hidden>چیزی پیدا نشد</div>
  `;
  document.getElementById(`msToggle${slot.suffix}-${project.id}`).textContent = campaignButtonLabel(project, slot) + ' ▾';

  const search = document.getElementById(searchId);
  search.addEventListener('input', ()=>{
    projectState[project.id].search[slot.key] = search.value;
    applySlotSearch(project, slot);
  });
  // Escape clears the query rather than closing the panel mid-typing.
  search.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      e.stopPropagation();
      search.value = '';
      projectState[project.id].search[slot.key] = '';
      applySlotSearch(project, slot);
    }
  });
  applySlotSearch(project, slot);
  if(hadFocus){
    search.focus();
    const end = search.value.length;
    try{ search.setSelectionRange(end, end); }catch(err){ /* type=search may refuse */ }
  }

  const allCb = document.getElementById(`msAll${slot.suffix}-${project.id}`);
  allCb.addEventListener('change', ()=>{
    const q = searchKey(slotQuery(project, slot));
    if(!q){
      projectState[project.id][slot.stateKey] = allCb.checked ? 'ALL' : new Set();
    } else {
      // With a search on, this row is about the matches: ticking it shows
      // exactly the campaigns containing the query, unticking drops them and
      // leaves anything picked outside the search alone.
      const matchKeys = slotMatches(project, slot).map(o=>o.key);
      let cur;
      if(allCb.checked){
        cur = new Set(matchKeys);
      } else {
        cur = slotState(project, slot);
        cur = cur === 'ALL' ? new Set(universe.map(o=>o.key)) : new Set(cur);
        matchKeys.forEach(k=>cur.delete(k));
      }
      projectState[project.id][slot.stateKey] = cur.size === universe.length ? 'ALL' : cur;
    }
    renderCampaignDropdown(project, slot);
    updateSection(project);
  });
  panel.querySelectorAll(`.ms-item${slot.suffix}-${project.id}`).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      let cur = projectState[project.id][slot.stateKey];
      if(cur === 'ALL') cur = new Set(universe.map(o=>o.key));
      if(cb.checked) cur.add(cb.value); else cur.delete(cb.value);
      if(cur.size === universe.length) cur = 'ALL';
      projectState[project.id][slot.stateKey] = cur;
      renderCampaignDropdown(project, slot);
      updateSection(project);
    });
  });
}
function wireCampaignToggle(project, slot){
  if(!slot) return filterSlots(project).forEach(sl=>wireCampaignToggle(project, sl));
  const toggle = document.getElementById(`msToggle${slot.suffix}-${project.id}`);
  const panel = document.getElementById(`msPanel${slot.suffix}-${project.id}`);
  if(!toggle || !panel) return;
  toggle.addEventListener('click', (e)=>{
    e.stopPropagation();

// A campaign name printed in a table doubles as a filter: clicking it narrows
// the section to that campaign, clicking the selected one again clears it.
function filterableName(project, slotKey, key, label){
  const slot = filterSlots(project).find(s=>s.key===slotKey);
  const sel = slot ? slotState(project, slot) : 'ALL';
  const isOnly = sel !== 'ALL' && sel.size === 1 && sel.has(key);
  return `<button type="button" class="filter-name${isOnly?' active':''}"
    data-project="${escapeHtml(project.id)}" data-slot="${escapeHtml(slotKey)}" data-key="${escapeHtml(key)}"
    title="${isOnly ? 'کلیک کن تا فیلتر برداشته بشه' : 'کلیک کن تا داشبورد روی همین فیلتر بشه'}"
    >${escapeHtml(label)}</button>`;
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-name');
  if(!btn || btn.dataset.seg) return;
  const project = PROJECTS.find(p=>p.id === btn.dataset.project);
  if(!project) return;
  const slot = filterSlots(project).find(s=>s.key === btn.dataset.slot);
  if(!slot) return;
  const sel = slotState(project, slot);
  const isOnly = sel !== 'ALL' && sel.size === 1 && sel.has(btn.dataset.key);
  projectState[project.id][slot.stateKey] = isOnly ? 'ALL' : new Set([btn.dataset.key]);
  renderCampaignDropdown(project, slot);
  updateSection(project);
});
document.addEventListener('click', ()=>{
  document.querySelectorAll('.ms-panel').forEach(p=>p.hidden = true);
});
// A card that starts folded (the Source / Term / Content tables) opens and
// closes from the button in its header.
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.collapse-toggle');

}
