<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Slides</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7F3EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F7F3EA;
    --surface:#FFFFFF;
    --surface-2:#FAF7F0;
    --surface-3:#F2ECE1;
    --border:#EAE3D5;
    --border-strong:#DCD2C0;
    --text:#15171C;
    --text-muted:#5E6270;
    --text-faint:#6B6E7C;
    --positive:#0E7A4F;
    --positive-soft:rgba(14,122,79,0.10);
    --negative:#C62026;
    --negative-soft:rgba(198,32,38,0.09);
    --amber:#B45309;
    --amber-soft:rgba(180,83,9,0.12);
    --accent:#2563EB;
    --accent-ink:#1D4ED8;
    --accent-soft:rgba(37,99,235,0.10);
    --radius:24px;
    --font-ui:'Vazirmatn',system-ui,-apple-system,sans-serif;
    --shadow-card:0 1px 2px rgba(58,46,24,.04), 0 14px 30px -22px rgba(58,46,24,.26);
    --shadow-pop:0 16px 40px -14px rgba(58,46,24,.24), 0 2px 6px rgba(58,46,24,.07);
    --gutter:24px;
  }
  *{box-sizing:border-box;}
  ::selection{background:rgba(245,209,59,.45);color:var(--text);}
  html{background:var(--bg);color-scheme:light;}
  body{
    margin:0;
    background:
      radial-gradient(1000px 470px at 88% -12%, color-mix(in srgb, var(--page-accent, #F5D13B) 15%, transparent), transparent 62%),
      radial-gradient(900px 460px at 12% -10%, rgba(245,209,59,.34), transparent 58%),
      linear-gradient(180deg,#FCF8EF 0%, var(--bg) 42%, #F2EDE1 100%);
    background-attachment:fixed;
    color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px;}
  [hidden]{display:none !important;}
  button{font-family:inherit;}
  .wrap{max-width:1280px;margin:0 auto;padding:28px var(--gutter) 72px;}

  /* Topbar — same family as the dashboard's */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#FFFFFF,#F7F1E4);
    border:1px solid #E7DECB;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -10px rgba(58,46,24,.4);
  }
  .brand-mark svg{width:18px;height:18px;color:var(--text);}
  .topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--text-muted);box-shadow:var(--shadow-card);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .dot.live{background:var(--positive);box-shadow:0 0 0 4px var(--positive-soft);}
  .dot.err{background:var(--negative);box-shadow:0 0 0 4px var(--negative-soft);}
  .dot.loading{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,border-color .15s,transform .15s;white-space:nowrap;text-decoration:none;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--border-strong);}
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn.primary{background:var(--text);border-color:var(--text);color:#fff;}
  .btn.primary:hover{background:#2A2D35;}
  .btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);}
  .btn.sm{padding:5px 11px;font-size:12px;}
  .btn.icon{padding:7px;}
  .btn.danger{color:var(--negative);}
  .btn:disabled{opacity:.45;cursor:default;}

  /* Customer picker */
  .home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .home-head h2{margin:0;font-size:22px;font-weight:800;}
  .home-head p{margin:4px 0 0;color:var(--text-muted);font-size:13px;}
  .search{
    border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 16px;
    font-family:inherit;font-size:13.5px;min-width:240px;color:var(--text);
  }
  .search:focus{outline:none;border-color:var(--text);}
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .client-card{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:14px 16px;cursor:pointer;text-align:right;color:var(--text);
    box-shadow:var(--shadow-card);transition:transform .15s, box-shadow .15s;font-size:14px;
  }
  .client-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);}
  .client-logo{
    width:44px;height:44px;border-radius:14px;flex-shrink:0;background:#fff;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;font-size:18px;
  }
  .client-logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
  .client-name{font-weight:700;line-height:1.35;}
  .client-group{font-size:11.5px;color:var(--text-faint);}

  /* Deck view */
  .deck-bar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);border-radius:22px;padding:10px 12px;margin-bottom:22px;box-shadow:var(--shadow-card);
  }
  .deck-id{display:flex;align-items:center;gap:10px;min-width:0;}
  .deck-id .client-logo{width:38px;height:38px;border-radius:12px;}
  .deck-id b{font-size:15px;display:block;line-height:1.3;}
  .deck-id span{font-size:12px;color:var(--text-muted);}
  .deck-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .deck{display:flex;flex-direction:column;gap:26px;}
  .slide-item{display:flex;flex-direction:column;gap:8px;}
  .slide-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;}
  .slide-tools .lbl{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .slide-tools .lbl b{color:var(--text);margin-left:6px;}
  .slide-tools .grp{display:flex;gap:4px;}
  .s-frame{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    box-shadow:0 1px 2px rgba(58,46,24,.06), 0 24px 48px -28px rgba(58,46,24,.38);background:#fff;
  }
  .s-frame > .slide{position:absolute;top:0;right:0;transform-origin:top right;transform:scale(var(--k,1));}
  .add-slide{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px;border:2px dashed var(--border-strong);border-radius:22px;}
  .add-slide span{width:100%;text-align:center;font-size:13px;color:var(--text-muted);font-weight:600;}
  .loading-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:60px 20px;text-align:center;
    color:var(--text-muted);box-shadow:var(--shadow-card);
  }
  .spinner{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--text);
    animation:spin .8s linear infinite;vertical-align:middle;margin-left:8px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{background:var(--negative-soft);color:var(--negative);border-radius:18px;padding:18px 22px;font-weight:600;}

  /* Editing affordances (only on the page, never in an export) */
  body.editing .slide [data-k]{outline:1.5px dashed transparent;outline-offset:3px;border-radius:6px;transition:outline-color .15s;cursor:text;}
  body.editing .slide [data-k]:hover{outline-color:rgba(37,99,235,.45);}
  body.editing .slide [data-k]:focus{outline:2px solid var(--accent-ink);background:rgba(255,255,255,.6);}
  body.editing .slide [data-k]:empty::before{content:attr(data-ph);color:#A3A6B1;font-weight:400;}
  body.editing .slide .s-logo-btn{cursor:pointer;}
  body.editing .slide .s-logo-btn:hover{outline:1.5px dashed rgba(37,99,235,.5);outline-offset:4px;border-radius:12px;}
  .row-x{
    display:none;position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
    border:1px solid var(--border);background:#fff;color:var(--negative);font-size:13px;line-height:1;cursor:pointer;padding:0;
  }
  body.editing .s-table tbody tr:hover .row-x, body.editing .ct-t:hover .row-x{display:block;}
  .ct-t .row-x{left:46px;top:12px;transform:none;}
  .card-grip{
    display:none;position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:9px;border:1px solid #E3DACA;
    background:#fff;color:#6B6E7C;font-size:16px;line-height:1;padding:0;cursor:grab;z-index:2;touch-action:none;
  }
  body.editing .kpi-t:hover .card-grip, body.editing .ct-t:hover .card-grip, .dragging .card-grip{display:block;}
  /* A table column moves by a handle beside its heading. */
  .s-table th{position:relative;}
  .s-table th .card-grip{position:static;width:22px;height:22px;font-size:13px;border-radius:7px;margin-left:6px;vertical-align:middle;}
  body.editing .s-table th:hover .card-grip, .s-table th.dragging .card-grip{display:inline-block;}
  .dragging{opacity:.6;outline:2px dashed var(--accent);outline-offset:2px;}
  .dragging .card-grip{cursor:grabbing;}

  /* Settings */
  .set-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-card);}
  .card h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .card .hint{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field > span{font-size:12px;font-weight:700;color:var(--text-muted);}
  .inp, select.inp{
    border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:9px 12px;font-family:inherit;
    font-size:13.5px;color:var(--text);width:100%;
  }
  .inp:focus{outline:none;border-color:var(--text);background:#fff;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > .field{flex:1 1 180px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--text);}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;}
  .check{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none;}
  .check input{width:16px;height:16px;accent-color:var(--text);margin:0;}
  .metric-checks{display:flex;flex-wrap:wrap;gap:8px 16px;}
  .camp-list{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:16px;}
  .camp-row{display:grid;grid-template-columns:auto minmax(0,1fr) 120px 160px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--surface-3);font-size:13px;}
  .camp-row:last-child{border-bottom:none;}
  .camp-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right;}
  .camp-row .cs{color:var(--text-muted);font-size:12px;text-align:left;direction:ltr;}
  .camp-row .inp{padding:6px 10px;font-size:12.5px;}
  .camp-head{background:var(--surface-2);font-weight:700;color:var(--text-muted);font-size:12px;position:sticky;top:0;z-index:1;}
  .slide-set{border:1px solid var(--border);border-radius:18px;margin-bottom:10px;background:var(--surface);}
  .slide-set[open]{box-shadow:var(--shadow-card);}
  .slide-set summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;}
  .slide-set summary::-webkit-details-marker{display:none;}
  .slide-set summary .num{width:28px;height:28px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
  .slide-set summary .t{flex:1;font-weight:700;min-width:0;}
  .slide-set summary .ty{font-size:11.5px;color:var(--text-faint);font-weight:500;margin-right:6px;}
  .slide-set .body{padding:4px 16px 16px;border-top:1px solid var(--surface-3);}
  .slide-set.off summary .t{color:var(--text-faint);text-decoration:line-through;}
  .set-foot{display:flex;gap:8px;flex-wrap:wrap;}
  .camp-list.sm{max-height:260px;margin-bottom:14px;}
  .camp-row .pt{font-size:11px;color:var(--text-faint);margin-right:6px;}
  .client-card.merged .client-logo{background:var(--surface-3);}
  .client-card.new{border-style:dashed;border-width:2px;border-color:var(--border-strong);box-shadow:none;background:transparent;justify-content:center;font-weight:700;color:var(--text-muted);}
  .client-card.new svg{width:20px;height:20px;flex-shrink:0;}
  .client-card{text-decoration:none;}
  .own-period{border:1px dashed var(--border-strong);border-radius:16px;padding:12px 14px 2px;margin-bottom:14px;background:var(--surface-2);}
  .ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 16px;}
  .ml-grid .field{margin-bottom:10px;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .sw{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 6px;
    background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text);}
  span.sw{cursor:default;}
  .sw i{width:20px;height:20px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .sw.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text);background:#fff;}
  .inp.color{height:42px;padding:4px 6px;cursor:pointer;}
  .th-preview{flex:1 1 260px;display:flex;align-items:center;gap:12px;height:64px;border:1px solid var(--border);border-radius:16px;padding:0 16px;background:#fff;overflow:hidden;}
  .tp-bar{width:6px;height:34px;border-radius:6px;background:var(--grad);flex-shrink:0;}
  .tp-title{font-weight:800;font-size:15px;}
  .tp-pill{background:var(--soft);color:var(--ink);font-weight:700;font-size:12px;border-radius:999px;padding:4px 12px;white-space:nowrap;}
  .tp-cols{position:relative;display:flex;align-items:flex-end;gap:5px;height:40px;margin-right:auto;}
  .tp-cols i{display:block;width:12px;border-radius:4px 4px 0 0;background:var(--accent);}
  .tp-cols b{position:absolute;left:-4px;right:-4px;top:12px;height:20px;border-top:3px solid;border-radius:50%;transform:rotate(-8deg);}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--text-muted);border-radius:999px;padding:1px 8px;margin-right:4px;}
  .home-sec{margin:26px 0 12px;font-size:14px;font-weight:800;color:var(--text-muted);}
  .btn.saved{background:var(--positive-soft);border-color:transparent;color:var(--positive);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:200;box-shadow:var(--shadow-pop);}

  /* Presentation */
  #present{position:fixed;inset:0;z-index:100;background:#F2EDE1;display:flex;align-items:center;justify-content:center;}
  #present .p-stage{position:relative;box-shadow:0 30px 70px -30px rgba(0,0,0,.35);background:#fff;overflow:hidden;}
  #present .p-stage > .slide{position:absolute;top:0;right:0;transform-origin:top right;}
  #present .p-ctrl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
    background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:5px 8px;font-size:13px;font-weight:700;opacity:.25;transition:opacity .2s;}
  #present:hover .p-ctrl{opacity:1;}
  #printDeck{display:none;}

  @media (max-width:640px){
    :root{--gutter:12px;}
    .wrap{padding-top:16px;}
    .topbar .sub{display:none;}
    .search{min-width:0;width:100%;}
    .client-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .client-card{padding:10px;gap:8px;font-size:13px;}
    .client-logo{width:36px;height:36px;}
    .deck-bar{position:static;border-radius:18px;}
    .deck-actions .btn .t{display:none;}
    .deck-actions .btn{padding:8px;}
    .s-frame{border-radius:10px;}
    .card{padding:18px 16px;}
    .camp-row{grid-template-columns:auto minmax(0,1fr) 110px;}
    .camp-row .cs{display:none;}
    .row-x{display:none !important;}
  }
  @media print{
    @page{size:1280px 720px;margin:0;}
    html,body{background:#fff !important;}
    body > *:not(#printDeck){display:none !important;}
    #printDeck{display:block !important;}
    #printDeck .p-page{width:1280px;height:720px;overflow:hidden;break-after:page;page-break-after:always;position:relative;}
    #printDeck .p-page:last-child{break-after:auto;page-break-after:auto;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
<!-- Everything a slide looks like. Kept in its own block so the HTML export
     carries exactly this and nothing of the page around it. -->
<style id="slideCss">
  .slide{
    width:1280px;height:720px;background:#fff;color:#15171C;position:relative;overflow:hidden;
    font-family:'Vazirmatn',system-ui,sans-serif;direction:rtl;padding:50px 64px 0;line-height:1.5;
    -webkit-font-smoothing:antialiased;box-sizing:border-box;
  }
  .slide *{box-sizing:border-box;}
  .slide::before{
    content:'';position:absolute;left:-200px;top:-260px;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle, var(--soft), transparent 68%);pointer-events:none;
  }
  .slide img{display:block;}
  .s-head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:28px;height:96px;}
  .s-titles{display:flex;gap:18px;align-items:stretch;min-width:0;}
  .s-bar{width:8px;border-radius:8px;background:var(--grad);flex-shrink:0;}
  .s-titles h2{margin:0;font-size:34px;font-weight:800;line-height:1.3;letter-spacing:-.01em;color:#15171C;}
  .s-kicker{font-size:17px;color:#6B6E7C;font-weight:500;margin-top:2px;}
  .s-logo-btn{flex-shrink:0;height:60px;display:flex;align-items:center;}
  .s-logo{height:60px;max-width:190px;object-fit:contain;}
  .s-initial{width:60px;height:60px;border-radius:18px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;}
  .s-body{position:absolute;top:166px;right:64px;left:64px;bottom:84px;}
  .s-foot{
    position:absolute;bottom:0;right:0;left:0;height:62px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;
    font-size:14px;color:#6B6E7C;border-top:1px solid #EFEAE0;background:#fff;
  }
  .s-num{font-weight:800;color:var(--ink);font-size:16px;letter-spacing:.04em;}
  .s-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#6B6E7C;font-size:22px;font-weight:600;
    background:#FAF7F0;border-radius:24px;border:1px dashed #E3DACA;}
  .s-note{position:absolute;bottom:0;right:0;left:0;font-size:15px;color:#5E6270;min-height:24px;}

  /* Cover */
  .slide-cover{padding:0;}
  .slide-cover::before{display:none;}
  .cv-panel{position:absolute;left:0;top:0;bottom:0;width:480px;background:var(--grad);overflow:hidden;}
  .cv-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.28);}
  .cv-ring.r1{width:560px;height:560px;left:-160px;top:-180px;}

function loadCore(){
  return new Promise((resolve, reject)=>{
    const f = document.createElement('iframe');
    f.src = '/index.html?core';
    f.hidden = true; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.title = 'core';

const defsById = R => Object.fromEntries(metricDefs(R).map(m => [m.id, m]));

// ---------- The report's rows ----------
// Campaigns a part can be narrowed to: Campaign Names for the budget sections
// (their filter works on those), campaigns everywhere else.
function partOptions(part, win){
  const inWin = d => !win || (d >= win.from && d <= win.to);
  const m = new Map();
  const add = (key, label, cost, d) => {
    if(!key) return;
    if(!m.has(key)) m.set(key, {key, label, cost:0, active:false});
    const o = m.get(key);
    if(inWin(d)){ o.cost += cost; o.active = true; }
  };
  if(part.kind === 'budget') (part.rawBlend || []).forEach(r => add(core.normCampaign(r.campaignName), r.campaignName, r.cost, r.date));
  else{
    (part.rawCost || []).forEach(r => add(r.campaign, r.campaignLabel || r.campaign, r.cost, r.date));
    (part.rawRef || []).forEach(r => add(r.campaign, r.campaignLabel || r.campaign, 0, r.date));
  }
  return Array.from(m.values());
}
function campaignOptions(R, win){
  return R.parts.flatMap(part => partOptions(part, win).map(o => ({...o, key:pkey(R, part, o.key), part})))
    .sort((a, b) => b.cost - a.cost || (a.label < b.label ? -1 : 1));
}
// The report's own campaign pick: an explicit list once one is made in the
// settings, otherwise everything — or the dashboard's default campaigns of
// the parts that have some (the Snapp sections).
function campaignSelection(R){
  const c = S.cfg.campaigns;
  if(Array.isArray(c)) return new Set(c);
  let narrowed = false;
  const keys = [];
  R.parts.forEach(part => {
    const opts = partOptions(part, null).map(o => o.key);
    if(part.defaultCampaigns && part.defaultCampaigns.length){
      const wanted = new Set(part.defaultCampaigns.map(core.normCampaign));
      const matched = opts.filter(k => wanted.has(k));
      if(matched.length && matched.length < opts.length){
        narrowed = true;
        keys.push(...matched.map(k => pkey(R, part, k)));
        return;
      }
    }
    keys.push(...opts.map(k => pkey(R, part, k)));
  });
  return narrowed ? new Set(keys) : 'ALL';
}

function slideSelection(R, s){

    const ex = partExtraCols(part);
    return core.messageRows(part, {from:win.from, to:win.to}).map(r => {
      const x = {};
      ex.ref.forEach(c => { x[c] = (r.extras && r.extras[c]) || 0; });
      ex.cost.forEach(c => { x[c] = (x[c] || 0) + ((r.costExtras && r.costExtras[c]) || 0); });
      return {...r, x, extras:undefined, costExtras:undefined, part:part.id, partTitle:part.title, raw:r.campaign,

    });

function allRows(R){
  return rowsFor(R, {from:R.minDate, to:R.maxDate}, 'ALL');
}
// `per` is a period setting — the report's (cfg.period) or a slide's own
// (slide.period): a preset or custom dates, plus days left out (`exclude`).
function resolvePeriod(R, per){
  per = per || S.cfg.period || {preset:'lastWeek'};
  const min = R.minDate, max = R.maxDate;
  if(!min || !max) return null;
  const clamp = w => ({from: w.from < min ? min : w.from, to: w.to > max ? max : w.to});
  switch(per.preset){
    case 'lastWeek': { const w = core.lastWeekWithin(min, max); return {from:isoToYmd(w.from), to:isoToYmd(w.to)}; }
    case 'last7': return clamp({from:addDays(max, -6), to:max});
    case 'last30': return clamp({from:addDays(max, -29), to:max});
    case 'sinceSat': return clamp({from:isoToYmd(core.weekStartFor(max)), to:max});
    case 'yesterday': { const d = isoToYmd(core.yesterdayWithin(min, max)); return {from:d, to:d}; }
    case 'all': return {from:min, to:max};
    case 'custom': {
      const f = per.from || min, t = per.to || max;
      return f <= t ? {from:f, to:t} : {from:t, to:f};
    }
  }
  return {from:min, to:max};
}
// Days left out of a period (a holiday, a day the tracking broke) are left
// out of the comparison too: the same day of the period before, so the two
// sides still cover like days.
function excludedIn(per, win){
  return win ? (per && per.exclude || []).filter(d => d >= win.from && d <= win.to).sort() : [];
}
function computeData(R, sel, only, per){
  per = per || S.cfg.period;
  const win = resolvePeriod(R, per);
  if(!win) return {win:null, rows:[], prevRows:[], t:totals([]), pt:null, days:0, excluded:[]};
  const days = daysBetween(win.from, win.to);
  const prev = {from:addDays(win.from, -days), to:addDays(win.from, -1)};
  const excluded = excludedIn(per, win);
  const skip = new Set(excluded), skipPrev = new Set(excluded.map(d => addDays(d, -days)));
  const rows = rowsFor(R, win, sel, only).filter(r => !skip.has(r.date));
  const prevRows = rowsFor(R, prev, sel, only).filter(r => !skipPrev.has(r.date));
  return {win, prev, days, rows, prevRows, excluded, t:totals(rows), pt:prevRows.length ? totals(prevRows) : null};
}
// A slide of a merged report may show only some of its parts (Arzplus web

function slideParts(R, s){
  if(!R.merged || !s || !Array.isArray(s.parts)) return null;
  const ids = s.parts.filter(id => R.parts.some(p => p.id === id));
  return ids.length && ids.length < R.parts.length ? ids : null;
}

  const key = (own ? s.campaigns.slice().sort().join('|') : '*') + '#' + (only ? only.join('|') : '*') + '#' + (per ? JSON.stringify(per) : '*');
  return S.cache[key] || (S.cache[key] = computeData(S.report, own ? new Set(s.campaigns) : campaignSelection(S.report), only, per || S.cfg.period));
}

// The default analysis: what changed against the same length of time just
// before — the totals, the main action and its cost, traffic, the medium that
// moved most, and campaigns that started or stopped. Meant to be edited.
function analysisDraft(R, d){
  const defs = defsById(R);
  const w = compareWords(d.days);
  const t = d.t, p = d.pt;
  if(!d.rows.length) return `<ul><li>در ${w.cur} دیتایی ثبت نشده.</li></ul>`;
  const ok = id => defs[id] && defs[id].ok;
  const main = mainAction(ok), eff = EFF_OF[main];
  const mDef = defs[main], eDef = defs[eff];
  const val = (def, v) => v === null || !isFinite(v) ? '—' : def.pct ? faPct(v) : fa(v) + (def.money ? ' تومان' : '');
  const chg = (a, b) => {
    if(a === null || b === null || !isFinite(a) || !isFinite(b)) return '';
    if(!b) return a ? ' (از صفر)' : '';
    const pct = (a - b) / Math.abs(b) * 100;
    if(Math.abs(pct) < 0.5) return ' (بدون تغییر محسوس)';
    return ` (<b>${fa(Math.abs(pct), Math.abs(pct) < 10 ? 1 : 0)}٪ ${pct > 0 ? 'افزایش' : 'کاهش'}</b>)`;
  };
  const fromTo = (id, label) => {
    const def = defs[id];
    const a = metricValue(id, t), b = metricValue(id, p);
    return `${label || def.label} از ${val(def, b)} به <b>${val(def, a)}</b> رسید${chg(a, b)}`;
  };
  const out = [];
  if(!p){
    out.push(`در ${w.cur} مجموعاً <b>${fa(t.cost)} تومان</b> هزینه شد و <b>${fa(metricValue(main, t))}</b> ${esc(mDef.label)} ثبت شد.`);
    out.push(`برای ${w.prev} دیتایی نیست که با اون مقایسه بشه.`);
    return '<ul>' + out.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  out.push(`در ${w.cur} نسبت به ${w.prev}، ${fromTo('cost', esc(defs.cost.label))}.`);
  const effPart = metricValue(eff, t) !== null || metricValue(eff, p) !== null ? ` و ${fromTo(eff, esc(eDef.label))}` : '';
  out.push(`${main === 'clicks' ? '' : 'تعداد '}${fromTo(main, esc(mDef.label))}${effPart}.`);
  const plain = (a, b) => {
    if(!b) return a ? 'رشد از صفر' : 'بدون تغییر';
    const pct = (a - b) / Math.abs(b) * 100;
    return Math.abs(pct) < 0.5 ? 'بدون تغییر محسوس' : `<b>${fa(Math.abs(pct), Math.abs(pct) < 10 ? 1 : 0)}٪ ${pct > 0 ? 'افزایش' : 'کاهش'}</b>`;
  };
  const traffic = [];
  if(ok('impressions') && main !== 'impressions') traffic.push(`نمایش ${plain(t.impressions, p.impressions)}`);
  if(ok('clicks') && main !== 'clicks') traffic.push(`کلیک ${plain(t.clicks, p.clicks)}`);
  if(traffic.length){
    const ctr = ok('ctr') ? `؛ ${fromTo('ctr')}` : '';
    out.push(`${traffic.join(' و ')} داشت${ctr}.`);
  }
  if(ok('sessions') && main !== 'sessions') out.push(`تعداد ${fromTo('sessions')}.`);
  // The medium whose main action moved the most, up or down.
  const cur = groupRows(R, d.rows, 'medium').groups, prev = groupRows(R, d.prevRows, 'medium').groups;
  const names = new Set([...cur, ...prev].map(g => g.key));
  if(names.size > 1){
    const find = (list, k) => (list.find(g => g.key === k) || {t:totals([])}).t;
    let best = null;
    names.forEach(k => {
      const a = metricValue(main, find(cur, k)) || 0, b = metricValue(main, find(prev, k)) || 0;
      if(!best || Math.abs(a - b) > Math.abs(best.a - best.b)) best = {k, a, b};
    });
    if(best && best.a !== best.b){
      out.push(`بیشترین تغییر ${esc(mDef.label)} مربوط به مدیوم <b>${esc(best.k)}</b> بود: از ${fa(best.b)} به <b>${fa(best.a)}</b>${chg(best.a, best.b)}.`);
    }
  }
  // Campaigns that spent this time but not last time, and the other way round.
  const spent = rows => {
    const m = new Map();
    rows.forEach(r => { if(r.cost > 0) m.set(r.campaign, r.campaignLabel || r.raw); });
    return m;
  };
  const a = spent(d.rows), b = spent(d.prevRows);
  const list = (m, other) => {
    const names = Array.from(m.entries()).filter(([k]) => !other.has(k)).map(([, l]) => `<bdi>${esc(l)}</bdi>`);
    if(!names.length) return '';
    return names.slice(0, 3).join('، ') + (names.length > 3 ? ` و ${fa(names.length - 3)} کمپین دیگه` : '');
  };
  const started = list(a, b), stopped = list(b, a);
  if(started) out.push(`کمپین‌های تازه‌ی ${w.cur}: ${started}.`);
  if(stopped) out.push(`کمپین‌هایی که در ${w.cur} هزینه نداشتن: ${stopped}.`);
  return '<ul>' + out.map(x => `<li>${x}</li>`).join('') + '</ul>';
}

    </div>`).join('');

    <div class="s-body"><div class="an-grid" style="--cols:${cols.length}">${body}</div></div>${slideFoot(R, num)}</section>`;

// A separator between parts of the deck: a title and nothing else.
function renderSectionSlide(R, s, num){
  return `<section class="slide slide-section">
    <span class="sec-ring r1"></span><span class="sec-ring r2"></span>
    <div class="s-logo-btn sec-logo" data-logo title="برای عوض کردن لوگو کلیک کن">${logoHtml(R)}</div>

function renderSlide(R, s, num){
  switch(s.type){
    case 'cover': return renderCover(R, s);
    case 'campaigns': return renderTypesSlide(R, s, num);
    case 'kpis': return renderKpis(R, s, num);
    case 'table': return renderTableSlide(R, s, num);
    case 'chart': return renderChartSlide(R, s, num);
    case 'text': return renderTextSlide(R, s, num);
    case 'section': return renderSectionSlide(R, s, num);
  }
  return '';
}

// ---------- Charts ----------
const FONT = "'Vazirmatn', system-ui, -apple-system, sans-serif";
const PIE = ['#F59E0B', '#10B981', '#6366F1', '#EC4899', '#14B8A6', '#94A3B8', '#EF4444', '#8B5CF6'];
function alpha(hex, a){
  const h = String(hex).replace('#', '');
  if(h.length !== 6) return hex;
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
function drawChart(R, s, canvas){
  const defs = defsById(R), th = themeOf(R), d = dataFor(s);
  const ms = (s.metrics || []).filter(id => defs[id] && defs[id].ok).slice(0, s.chart === 'doughnut' ? 1 : 2);
  if(!ms.length) return null;
  let {dim, groups} = groupRows(R, d.rows, s.dim || 'day');
  const all = d.t;
  if(!dim.chrono && groups.length > 10){
    const rest = groups.slice(9);
    groups = groups.slice(0, 9).concat([{key:'__rest', name:'سایر', t:totals(rest.flatMap(g => g.rows))}]);
  }
  const labels = groups.map(g => g.name);
  const colors = [th.accent, th.second];
  const font = {family:FONT, size:15};
  const tick = def => v => def.pct ? faPct(v) : faCompact(v);
  const type = s.chart || 'combo';
  let config;
  if(type === 'doughnut'){
    const def = defs[ms[0]];
    config = {type:'doughnut', data:{labels, datasets:[{data:groups.map(g => metricValue(ms[0], g.t, all) || 0),
      backgroundColor:groups.map((g, i) => i === 0 ? th.accent : i === 1 ? th.second : PIE[(i - 2) % PIE.length]), borderColor:'#fff', borderWidth:3}]},
      options:{cutout:'58%', plugins:{legend:{position:'left', rtl:true, labels:{font:{...font, size:16}, padding:16, boxWidth:16, boxHeight:16,
        generateLabels(chart){
          const ds = chart.data.datasets[0], sum = ds.data.reduce((a, b) => a + b, 0);
          return chart.data.labels.map((l, i) => ({text:`${l} — ${def.pct ? faPct(ds.data[i]) : faCompact(ds.data[i])}${sum > 0 && !def.pct ? ` (${faPct(ds.data[i] / sum * 100)})` : ''}`,
            fillStyle:ds.backgroundColor[i], strokeStyle:ds.backgroundColor[i], index:i}));
        }}},
        tooltip:{rtl:true, callbacks:{label:c => `${c.label}: ${fmtMetric(def, c.raw)}`}}}}};
  }else{
    const horizontal = type === 'hbar';
    const datasets = ms.map((id, i) => {
      const def = defs[id];
      const asLine = type === 'line' || (type === 'combo' && i === 1);
      return {
        type: asLine ? 'line' : 'bar', label:def.label,
        data:groups.map(g => metricValue(id, g.t, all)),
        backgroundColor: asLine ? colors[i] : alpha(colors[i], i === 0 ? 0.9 : 0.75),
        borderColor: colors[i], borderWidth: asLine ? 3 : 0, borderRadius: asLine ? 0 : 8, maxBarThickness:56,
        pointRadius: asLine ? (groups.length > 20 ? 2 : 4) : 0, pointBackgroundColor:'#fff', pointBorderWidth:2, tension:.3,
        spanGaps:true, yAxisID: horizontal ? undefined : (i === 0 ? 'y' : 'y1'), xAxisID: horizontal ? (i === 0 ? 'x' : 'x1') : undefined,
        order: asLine ? 0 : 1
      };
    });
    const valAxis = (id, i) => ({
      position: horizontal ? (i === 0 ? 'bottom' : 'top') : (i === 0 ? 'right' : 'left'),
      beginAtZero:true, grid:{display:i === 0, color:'#F0EBE1'}, border:{display:false},
      ticks:{font, color:'#6B6E7C', callback:tick(defs[id]), maxTicksLimit:6},
      title:{display:true, text:defs[id].label + (defs[id].money ? ' (تومان)' : ''), font:{...font, size:14, weight:'600'}, color:colors[i]}
    });
    const catAxis = {grid:{display:false}, border:{color:'#E5DFD2'},
      ticks:{font, color:'#3E424C', autoSkip:true, maxRotation:0, autoSkipPadding:14,
             callback(v){ const l = this.getLabelForValue(v); return String(l).length > 22 ? String(l).slice(0, 21) + '…' : l; }}};
    const scales = horizontal ? {y:{...catAxis, position:'right'}, x:valAxis(ms[0], 0)} : {x:catAxis, y:valAxis(ms[0], 0)};
    if(ms[1]) scales[horizontal ? 'x1' : 'y1'] = valAxis(ms[1], 1);
    config = {type:'bar', data:{labels, datasets}, options:{indexAxis: horizontal ? 'y' : 'x', scales,
      plugins:{legend:{position:'top', align:'start', rtl:true, labels:{font:{...font, size:16}, boxWidth:14, boxHeight:14, usePointStyle:true, padding:18}},
        tooltip:{rtl:true, callbacks:{label:c => `${c.dataset.label}: ${fmtMetric(defs[ms[c.datasetIndex]], c.raw)}`}}}}};
  }
  // Sized from the slide's own 1280×720 layout: a responsive chart would
  // measure the scaled-down frame on a phone and draw itself a quarter size.
  const box = canvas.parentElement;
  canvas.width = box.offsetWidth; canvas.height = box.offsetHeight;
  config.options = Object.assign(config.options, {responsive:false, maintainAspectRatio:false, animation:false, devicePixelRatio:2,
    layout:{padding:{top:4, left:6, right:6}}, interaction:{mode:'index', intersect:false}});
  return new Chart(canvas, config);
}

      m.title = title; m.parts = parts;
      // Campaign picks and mediums name the parts; a removed part's go too.
      const cfg = store.get(cfgKey(R), null);
      if(cfg){
        const keep = k => parts.some(id => String(k).startsWith(id + '::'));
        if(Array.isArray(cfg.campaigns)) cfg.campaigns = null;
        (cfg.slides || []).forEach(s => { if(Array.isArray(s.campaigns)) s.campaigns = s.campaigns.filter(keep); });

}

async function openReport(R, view){
  if(!S.report || S.report.id !== R.id){
    S.report = R; S.data = null; S.cache = {};
    document.body.style.setProperty('--page-accent', themeOf(R).accent);
    const todo = R.parts.filter(p => !p._loaded);
    if(todo.length){
      $('#view').innerHTML = `<div class="loading-box"><span class="spinner"></span>در حال خوندن شیت‌های ${esc(R.title)}…</div>`;
      setStatus('loading', 'در حال خوندن شیت…');
      await Promise.all(todo.map(async p => { await core.loadProject(p); p._loaded = !p.error; }));
      if(S.report !== R) return;
    }
    // This report's settings, template and edits as the server has them.
    await remoteLoad(R.id + '|');
    if(S.report !== R) return;
    const bad = R.parts.filter(p => p.error);
    if(bad.length){
      $('#view').innerHTML = `${backBar(R)}${bad.map(p => `<div class="error-box">${esc(p.title)}: ${esc(p.error)}</div>`).join('')}`;
      setStatus('err', 'خطا در خوندن شیت');
      S.report = null;
      return;
    }
    const mins = R.parts.map(p => p.minDate).filter(Boolean).sort(), maxs = R.parts.map(p => p.maxDate).filter(Boolean).sort();
    R.minDate = mins[0] || null; R.maxDate = maxs[maxs.length - 1] || null;
    loadCfg(R);
    document.body.style.setProperty('--page-accent', themeOf(R).accent);
  }else R = S.report;   // route() builds a fresh object each time; keep the loaded one
  S.cache = {};
  S.data = computeData(R, campaignSelection(R));
  loadEdits();
  if(remote.state === 'off') syncStatus('off');
  else if(!remote.pending.size) setStatus('live', 'همگام‌سازی شد — ' + new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'}));
  view === 'settings' ? renderSettings(R) : renderDeck(R);
}

// A figure too wide for its tile, or an analysis longer than its box, is
// stepped down in size rather than cut off.
function fitSlideText(slide){
  $$('.kpi-v, .ct-name', slide).forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth > el.clientWidth + 1 && size > 14){ size -= 1; el.style.fontSize = size + 'px'; }
  });
  $$('.an-body', slide).forEach(el => {
    el.style.fontSize = '';
    const box = el.parentElement;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while(box.scrollHeight > box.clientHeight + 1 && size > 12){ size -= 1; el.style.fontSize = size + 'px'; }
  });
}
function fitFrames(root){
  $$('.s-frame', root).forEach(f => f.style.setProperty('--k', f.clientWidth / 1280));
}
const ro = window.ResizeObserver ? new ResizeObserver(() => fitFrames()) : null;

function wireDeck(R){
  const deck = $('#deck');
  if(ro){ ro.disconnect(); ro.observe(deck); }
  deck.addEventListener('input', e => {
    const n = e.target.closest('[data-k]');
    const slide = e.target.closest('.slide');
    if(!n || !slide) return;
    const sid = slide.dataset.sid;
    (S.edits[sid] = S.edits[sid] || {})[n.dataset.k] = n.innerHTML;
    saveEdits();
    fitSlideText(slide);
  });
  // Pasting keeps the words, not the formatting of wherever they came from.
  // Dragging a card (KPI card, campaign-type tile) by its handle: the card
  // moves live under the pointer and the new order is saved with the slide.
  deck.addEventListener('pointerdown', e => {
    const grip = e.target.closest('[data-grip]');
    if(!grip || !document.body.classList.contains('editing')) return;
    e.preventDefault();
    const card = grip.closest('[data-card]'), grid = card.parentElement;
    card.classList.add('dragging');
    // Listened for on the document: moving the card in the page would drop a
    // pointer capture on its handle mid-drag.
    const move = ev => {
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = under && under.closest('[data-card]');
      if(!target || target === card || target.parentElement !== grid) return;
      const cards = Array.from(grid.children);
      grid.insertBefore(card, cards.indexOf(target) > cards.indexOf(card) ? target.nextSibling : target);
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      card.classList.remove('dragging');
      const sid = card.closest('.slide').dataset.sid;
      const s = S.cfg.slides.find(x => x.id === sid);
      // The dimension column has no handle (no data-card) and stays first.
      const ids = Array.from(grid.children).map(c => c.dataset.card).filter(Boolean);
      if(s.type === 'kpis' || s.type === 'table') s.metrics = [...ids, ...(s.metrics || []).filter(id => !ids.includes(id))];
      else s.tileOrder = ids;
      saveCfg();
      renderDeck(R);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
  deck.addEventListener('paste', e => {
    if(!e.target.closest('[data-k]')) return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
  deck.addEventListener('click', e => {
    const hide = e.target.closest('[data-hide]');
    if(hide){
      const sid = hide.closest('.slide').dataset.sid;
      (S.edits[sid] = S.edits[sid] || {})['hide:' + hide.dataset.hide] = 1;
      saveEdits();
      hide.closest('[data-row]').remove();
      return;
    }
    const logo = e.target.closest('[data-logo]');
    if(logo && document.body.classList.contains('editing')){ $('#logoFile').click(); return; }
    const add = e.target.closest('[data-add]');
    if(add){ addSlide(R, add.dataset.add); renderDeck(R); toast('اسلاید اضافه شد — تنظیماتش تو صفحه‌ی تنظیمات'); return; }
    const act = e.target.closest('[data-act]');
    if(!act) return;
    const sid = act.closest('.slide-item').dataset.sid;
    const list = S.cfg.slides, idx = list.findIndex(s => s.id === sid);
    switch(act.dataset.act){
      case 'up': case 'down': {
        const vis = enabledSlides(), vi = vis.findIndex(s => s.id === sid);
        const other = vis[vi + (act.dataset.act === 'up' ? -1 : 1)];
        if(!other) return;
        const oi = list.indexOf(other);
        [list[idx], list[oi]] = [list[oi], list[idx]];
        saveCfg(); renderDeck(R); break;
      }
      case 'hide': list[idx].on = false; saveCfg(); renderDeck(R); toast('پنهان شد — از تنظیمات برمی‌گرده'); break;
      case 'default':
        if(!confirm('این اسلاید به نسخه‌ی پیش‌فرض برگرده؟ متن‌های ویرایش‌شده (تو قالب و این بازه) و تنظیماتش (متریک‌ها، کمپین‌ها، نمودار…) پاک می‌شن.')) return;
        resetSlide(R, sid); renderDeck(R); toast('اسلاید به نسخه‌ی پیش‌فرض برگشت'); break;
      case 'cfg': S.focusSlide = sid; break;
      case 'present': openPresent(enabledSlides().findIndex(s => s.id === sid)); break;
    }
  });
  $('#saveTpl').addEventListener('click', () => {
    saveTemplate();
    renderDeck(R);
    toast('قالب ذخیره شد — همه‌ی متن‌ها می‌مونن و بازه‌های بعدی هم با همین‌ها ساخته می‌شن');
  });
  $('#editToggle').addEventListener('click', () => {
    document.body.classList.toggle('editing');
    renderDeck(R);
  });
  $('#resetAll').addEventListener('click', () => {
    if(!confirm('ویرایش‌های این بازه پاک بشه؟ (قالب ذخیره‌شده دست نمی‌خوره)')) return;
    S.edits = {}; store.del(S.editKey); renderDeck(R);
  });
  $('#presentBtn').addEventListener('click', () => openPresent(0));
  $('#pdfBtn').addEventListener('click', exportPdf);
  $('#htmlBtn').addEventListener('click', exportHtml);
}

$('#logoFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f || !S.report) return;
  const reader = new FileReader();
  reader.onload = () => {
    // Shrunk to fit: browser storage holds a few megabytes for everything.
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 480 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.cfg.logo = c.toDataURL('image/png');
      saveCfg();
      route();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});

function newSlide(R, type, id){
  const defs = defsById(R), ok = id => defs[id] && defs[id].ok;
  const main = mainAction(ok);
  const base = {id: id || type + '-' + Date.now().toString(36), type, on:true, title:SLIDE_TYPES[type]};
  if(type === 'chart') Object.assign(base, {title:'نمودار', dim:'day', chart:'combo', metrics:['cost', main]});
  if(type === 'table') Object.assign(base, {title:'جدول مقایسه', dim:'campaign', maxRows:10, metrics:['cost', 'costShare', main].filter(ok)});
  if(type === 'kpis') Object.assign(base, {title:'آمار کلی', metrics:['cost', main].filter(ok)});
  if(type === 'campaigns') Object.assign(base, {title:'کمپین‌های اجرا شده', level:'medium'});
  if(type === 'text') Object.assign(base, {title:'یادداشت', cols:[{h:'', auto:null, icon:'note'}]});
  if(type === 'section') base.title = 'عنوان بخش';
  return base;
}
function addSlide(R, type){
  const base = newSlide(R, type);
  S.cfg.slides.push(base);
  saveCfg();
  return base;
}
// Back to how the slide first came: its settings (metrics, dimension, chart,
// campaigns…) and its text, both the template's and this period's edits.
function resetSlide(R, sid){
  const list = S.cfg.slides, i = list.findIndex(s => s.id === sid);
  if(i < 0) return;
  const s = list[i];
  const builtIn = defaultSlides(R).find(d => d.id === sid);
  list[i] = Object.assign(builtIn || newSlide(R, s.type, sid), {on: s.on !== false});
  if(S.cfg.tpl) delete S.cfg.tpl[sid];
  delete S.edits[sid];
  saveCfg();
  store.set(S.editKey, S.edits);
}
const isEdited = sid => !!((S.cfg.tpl && S.cfg.tpl[sid] && Object.keys(S.cfg.tpl[sid]).length) || (S.edits[sid] && Object.keys(S.edits[sid]).length));

function periodEditor(R, per, scope){

  const excl = excludedIn(per, win);
  const days = [];
  for(let d = win.from; d <= win.to && days.length < 400; d = addDays(d, 1)) days.push(d);
  const kept = daysBetween(win.from, win.to) - excl.length;
  return `<div class="chips">${PRESETS.map(([k, v]) => `<button type="button" class="chip ${per.preset === k ? 'on' : ''}" data-pscope="${scope}" data-preset="${k}">${esc(v)}</button>`).join('')}</div>

      <label class="field"><span>از</span><input class="inp" type="date" data-pscope="${scope}" data-pend="from" value="${esc(ymdToIso(win.from))}" min="${esc(ymdToIso(R.minDate))}" max="${esc(ymdToIso(R.maxDate))}"></label>
      <label class="field"><span>تا</span><input class="inp" type="date" data-pscope="${scope}" data-pend="to" value="${esc(ymdToIso(win.to))}" min="${esc(ymdToIso(R.minDate))}" max="${esc(ymdToIso(R.maxDate))}"></label>

    </div>
    <div class="row" style="align-items:center;margin-bottom:12px">
      <label class="field" style="flex:0 1 240px;margin-bottom:0"><span>حذف یه روز از بازه</span>
        <select class="inp" data-pscope="${scope}" data-pexadd><option value="">انتخاب روز…</option>
          ${days.filter(d => !excl.includes(d)).map(d => `<option value="${d}">${esc(jWeekday(d))}</option>`).join('')}</select></label>
      ${excl.length ? `<div class="chips" style="margin:18px 0 0">${excl.map(d => `<button type="button" class="chip on" data-pscope="${scope}" data-pexdel="${d}" title="برگردوندن این روز">${esc(jWeekday(d))} ✕</button>`).join('')}</div>` : ''}

          : '<div class="camp-row"><span></span><span>توی این بازه کمپینی نیست</span></div>'}
      </div>
      ${mediumRows.length ? `<h3 style="margin-top:18px">مدیوم کمپین‌ها${someBudget && !budgetOnly ? ' (بخش‌های بودجه‌ای)' : ''}</h3><div class="camp-list">${mediumRows.map(([k, l]) => `<div class="camp-row"><span></span><span class="nm">${esc(l)}</span><span class="cs"></span>${medInput(k)}</div>`).join('')}</div>` : ''}
      <datalist id="mediumList">${mediumNames.map(m => `<option value="${esc(m)}">`).join('')}</datalist>
    </section>

    <section class="card"><h3>اسم متریک‌ها</h3><p class="hint">اسمی که هر متریک تو همه‌ی اسلایدها (کارت‌ها، سرستون جدول‌ها، نمودارها، متن تحلیل) و تو لیست‌های تنظیمات می‌گیره. خالی = اسم پیش‌فرض. «هزینه به ازای …» خودش از اسم جدید پیروی می‌کنه مگه اینکه اونم عوض کنی. متنی که قبلاً مستقیم روی یه اسلاید عوض کردی همون می‌مونه (با «پیش‌فرض» اون اسلاید از اینجا می‌خونه).</p>
      ${[['', defs.filter(m => m.ok && !m.extra)], ['ستون‌های دیگه‌ی شیت', defs.filter(m => m.ok && m.extra)]].filter(([, list]) => list.length).map(([title, list]) => `
        ${title ? `<div class="field" style="margin:6px 0 8px"><span>${esc(title)}</span></div>` : ''}
        <div class="ml-grid">${list.map(m => `<label class="field"><span>${esc(m.dflt)}</span>
          <input class="inp" data-mlabel="${esc(m.id)}" value="${esc(((cfg.metricLabels || {})[m.id]) || (m.id === 'actions' ? cfg.actionLabel || '' : ''))}" placeholder="${esc(m.dflt)}"></label>`).join('')}</div>`).join('')}
    </section>

    <section class="card"><h3>اسلایدها، متریک‌ها، ابعاد و کمپین‌ها</h3><p class="hint">ترتیب، نمایش، عنوان، متریک‌ها، بُعد، نوع نمودار و کمپین‌های هر اسلاید. تغییرها همون لحظه ذخیره می‌شن.</p>
      ${cfg.slides.map(slideOpts).join('')}
      <div class="set-foot" style="margin-top:12px">${['chart', 'table', 'kpis', 'campaigns', 'text', 'section'].map(t => `<button type="button" class="btn sm" data-add="${t}">+ ${esc(SLIDE_TYPES[t])}</button>`).join('')}</div>
    </section>

    <section class="card"><h3>قالب، ذخیره و انتقال</h3><p class="hint">${esc(savedLabel())}${tplN ? ` — ${fa(tplN)} متن ویرایش‌شده تو قالب` : ''}. تنظیمات این صفحه خودکار ذخیره می‌شن؛ متن‌هایی که روی اسلایدها عوض می‌کنی با «ذخیره قالب» (بالای اسلایدها) تو قالب این مشتری می‌مونن. همه‌چیز تو همین مرورگره؛ برای مرورگر دیگه خروجی بگیر و اونجا وارد کن.</p>
      <div class="set-foot">
        <a class="btn primary" href="#${esc(R.id)}">دیدن گزارش</a>
        <button type="button" class="btn" id="cfgExport">خروجی قالب و تنظیمات (JSON)</button>
        <button type="button" class="btn" id="cfgImport">وارد کردن</button>
        ${tplN ? '<button type="button" class="btn danger" id="tplClear">پاک کردن متن‌های قالب</button>' : ''}
        <button type="button" class="btn danger" id="cfgReset">برگشت به ساختار پیش‌فرض</button>
      </div>
      <input type="file" id="cfgFile" accept="application/json,.json" hidden>
    </section>
  </div>`;
  $('#deckActions').innerHTML = `<a class="btn primary" href="#${esc(R.id)}">${ICON.play}<span class="t">دیدن گزارش</span></a>`;
  if(S.focusSlide){
    const el = document.getElementById('set-' + S.focusSlide);
    if(el) el.scrollIntoView({block:'center'});
    S.focusSlide = null;
  }
  wireSettings(R);
}

function wireSettings(R){
  // The grid is rebuilt on every render, so its listeners never pile up.
  const cfg = S.cfg, view = $('.set-grid');
  const rerender = extraOpen => {
    const open = $$('.slide-set[open]').map(x => x.id).concat(extraOpen || []);
    const y = window.scrollY;
    S.cache = {};
    S.data = computeData(R, campaignSelection(R)); loadEdits();
    renderSettings(R);
    open.forEach(id => { const x = document.getElementById(id); if(x) x.open = true; });
    window.scrollTo(0, y);
  };
  // Period editors: the report's (scope 'r') and each slide's own.
  const perOf = scope => scope === 'r' ? (cfg.period = cfg.period || {preset:'lastWeek'}) : cfg.slides[+scope].period;
  const setPer = (scope, per) => {
    // Left-out days stay only while they fall inside the new period.
    const win = resolvePeriod(R, per);
    per.exclude = excludedIn({exclude:(perOf(scope) || {}).exclude}, win);
    if(!per.exclude.length) delete per.exclude;
    if(scope === 'r') cfg.period = per; else cfg.slides[+scope].period = per;
    saveCfg(); rerender(scope === 'r' ? [] : ['set-' + cfg.slides[+scope].id]);
  };
  view.addEventListener('click', e => {
    const b = e.target.closest('[data-pscope][data-preset],[data-pscope][data-pexdel]');
    if(!b) return;
    const scope = b.dataset.pscope, cur = perOf(scope);
    if(b.dataset.preset){
      const per = {preset:b.dataset.preset};
      if(per.preset === 'custom'){ const w = resolvePeriod(R, cur); if(w) Object.assign(per, w); }
      setPer(scope, per);
    }else{
      cur.exclude = (cur.exclude || []).filter(d => d !== b.dataset.pexdel);
      if(!cur.exclude.length) delete cur.exclude;
      saveCfg(); rerender(scope === 'r' ? [] : ['set-' + cfg.slides[+scope].id]);
    }
  });
  view.addEventListener('change', e => {
    const el = e.target;
    if(el.dataset.pscope === undefined) return;
    const scope = el.dataset.pscope, cur = perOf(scope);
    if(el.dataset.pend){
      const box = el.closest('.row');
      const f = $('[data-pend="from"]', box).value, t = $('[data-pend="to"]', box).value;
      if(f && t) setPer(scope, {preset:'custom', from:isoToYmd(f), to:isoToYmd(t)});
    }else if(el.dataset.pexadd !== undefined && el.value){
      cur.exclude = Array.from(new Set([...(cur.exclude || []), el.value])).sort();
      const win = resolvePeriod(R, cur);
      if(win && excludedIn(cur, win).length >= daysBetween(win.from, win.to)){
        cur.exclude.pop(); toast('حداقل یه روز باید تو بازه بمونه'); el.value = ''; return;
      }
      saveCfg(); rerender(scope === 'r' ? [] : ['set-' + cfg.slides[+scope].id]);
    }
  });
  $('#cmpToggle').addEventListener('change', e => { cfg.compare = e.target.checked; saveCfg(); });
  $$('[data-cfg]').forEach(inp => inp.addEventListener('change', () => { cfg[inp.dataset.cfg] = inp.value.trim(); saveCfg(); }));
  $('#logoPick').addEventListener('click', () => $('#logoFile').click());
  $$('[data-mlabel]').forEach(inp => inp.addEventListener('change', () => {
    const id = inp.dataset.mlabel, v = inp.value.trim();
    cfg.metricLabels = cfg.metricLabels || {};
    if(v) cfg.metricLabels[id] = v; else delete cfg.metricLabels[id];
    if(id === 'actions') cfg.actionLabel = '';   // the old single field, now part of this list
    saveCfg(); rerender();
  }));
  const setTheme = theme => {
    cfg.theme = theme;
    saveCfg();
    document.body.style.setProperty('--page-accent', themeOf(R).accent);
    rerender();
  };
  $$('[data-theme]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.theme === 'brand') return setTheme(null);
    const preset = THEME_PRESETS.find(x => x[0] === b.dataset.theme);
    setTheme({preset:preset[0], accent:preset[2], second:(cfg.theme && cfg.theme.second) || DEFAULT_SECOND});
  }));
  const pickColors = () => setTheme({preset:'custom', accent:$('#thA').value, second:$('#thB').value});
  $('#thA').addEventListener('change', pickColors);
  $('#thB').addEventListener('change', pickColors);
  const lr = $('#logoReset');
  if(lr) lr.addEventListener('click', () => { cfg.logo = null; saveCfg(); rerender(); });

  // Report campaigns: an explicit list once anything is unticked; null means
  // "all" (or the dashboard's default campaigns of the section).
  const writeCamps = () => {
    const boxes = $$('[data-camp]');
    const checked = boxes.filter(b => b.checked).map(b => b.dataset.camp);
    const sel = campaignSelection(R);
    // Campaigns outside this period's list keep whatever they were.
    const listed = new Set(boxes.map(b => b.dataset.camp));
    const keepOut = sel === 'ALL' ? campaignOptions(R, null).map(o => o.key).filter(k => !listed.has(k)) : Array.from(sel).filter(k => !listed.has(k));
    cfg.campaigns = checked.length === boxes.length && sel === 'ALL' ? null : checked.concat(keepOut);
    saveCfg();
    S.data = computeData(R, campaignSelection(R)); loadEdits();
  };
  $$('[data-camp]').forEach(b => b.addEventListener('change', writeCamps));
  $('#campSearch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $$('#reportCamps label.camp-row').forEach(r => { r.hidden = q && !r.dataset.q.includes(q); });
  });
  const setAllVisible = v => { $$('#reportCamps label.camp-row').filter(r => !r.hidden).forEach(r => { $('input', r).checked = v; }); writeCamps(); };
  $('#campAll').addEventListener('click', () => setAllVisible(true));
  $('#campNone').addEventListener('click', () => setAllVisible(false));
  const cd = $('#campDefault');
  if(cd) cd.addEventListener('click', () => { cfg.campaigns = null; saveCfg(); rerender(); });
  $$('[data-medium]').forEach(inp => inp.addEventListener('change', () => {
    cfg.mediums = cfg.mediums || {};
    const v = inp.value.trim();
    if(v) cfg.mediums[inp.dataset.medium] = v; else delete cfg.mediums[inp.dataset.medium];
    saveCfg();
  }));

  // Slides
  view.addEventListener('change', e => {
    const el = e.target;
    if(el.dataset.s === undefined || el.dataset.camp !== undefined || el.dataset.pscope !== undefined) return;
    const s = cfg.slides[+el.dataset.s];
    if(el.dataset.metric){
      const set = new Set(s.metrics || []);
      el.checked ? set.add(el.dataset.metric) : set.delete(el.dataset.metric);
      // Keep the order of the metric list, which is the order on the slide.
      // Keeps the order the cards were dragged into; a new one goes last.
      s.metrics = el.checked ? Array.from(set).sort((a, b) => {
        const ia = (s.metrics || []).indexOf(a), ib = (s.metrics || []).indexOf(b);
        return (ia < 0 ? Infinity : ia) - (ib < 0 ? Infinity : ib);
      }) : (s.metrics || []).filter(id => set.has(id));
    }else if(el.dataset.prop === 'perMode'){
      if(el.value === 'own'){
        // Starts as a copy of the report's period.
        s.period = JSON.parse(JSON.stringify(cfg.period || {preset:'lastWeek'}));
      }else delete s.period;
      saveCfg(); rerender(['set-' + s.id]); return;
    }else if(el.dataset.spart !== undefined){
      const boxes = $$(`[data-s="${el.dataset.s}"][data-spart]`);
      const ids = boxes.filter(b => b.checked).map(b => b.dataset.spart);
      if(!ids.length){ el.checked = true; toast('حداقل یه بخش باید بمونه'); return; }
      if(ids.length === boxes.length) delete s.parts; else s.parts = ids;
      saveCfg(); rerender(['set-' + s.id]); return;
    }else if(el.dataset.scamp !== undefined){
      const set = new Set(s.campaigns || []);
      el.checked ? set.add(el.dataset.scamp) : set.delete(el.dataset.scamp);
      s.campaigns = Array.from(set);
    }else if(el.dataset.prop === 'campMode'){
      if(el.value === 'own'){
        // Start from what the report counts now.
        const sel = campaignSelection(R);
        s.campaigns = sel === 'ALL' ? campaignOptions(R, null).map(o => o.key) : Array.from(sel);
      }else delete s.campaigns;
      saveCfg(); rerender(['set-' + s.id]); return;
    }else if(el.dataset.prop === 'on'){
      s.on = el.checked;
      el.closest('.slide-set').classList.toggle('off', !el.checked);
    }else if(el.dataset.prop === 'maxRows'){
      s.maxRows = Math.max(2, Math.min(20, +el.value || 10));
    }else if(el.dataset.prop === 'ncols'){
      const n = +el.value, cur = s.cols || [];
      s.cols = Array.from({length:n}, (_, i) => cur[i] || {h:'', auto:null, icon:'note'});
    }else{
      s[el.dataset.prop] = el.value;
      if(el.dataset.prop === 'title') $('.t', el.closest('.slide-set')).firstChild.textContent = el.value || SLIDE_TYPES[s.type];
    }
    saveCfg();
  });
  view.addEventListener('click', e => {
    const b = e.target.closest('[data-move],[data-dup],[data-del],[data-add],[data-sall],[data-snone],[data-default]');
    if(!b) return;
    const extra = [];
    if(b.dataset.default !== undefined){
      const sid = cfg.slides[+b.dataset.default].id;
      if(!confirm('این اسلاید به نسخه‌ی پیش‌فرض برگرده؟ متن‌های ویرایش‌شده و تنظیماتش پاک می‌شن.')) return;
      resetSlide(R, sid); rerender(['set-' + sid]); return;
    }
    if(b.dataset.sall !== undefined || b.dataset.snone !== undefined){
      const i = +(b.dataset.sall !== undefined ? b.dataset.sall : b.dataset.snone);
      const s = cfg.slides[i];
      const listed = $$(`[data-s="${i}"][data-scamp]`).map(x => x.dataset.scamp);
      const set = new Set(s.campaigns || []);
      listed.forEach(k => b.dataset.sall !== undefined ? set.add(k) : set.delete(k));
      s.campaigns = Array.from(set);
    }else if(b.dataset.add){ const s = addSlide(R, b.dataset.add); extra.push('set-' + s.id); }
    else if(b.dataset.move !== undefined){
      const i = +b.dataset.move, j = i + +b.dataset.dir;
      if(j < 0 || j >= cfg.slides.length) return;
      [cfg.slides[i], cfg.slides[j]] = [cfg.slides[j], cfg.slides[i]];
    }else if(b.dataset.dup !== undefined){
      const i = +b.dataset.dup;
      const copy = JSON.parse(JSON.stringify(cfg.slides[i]));
      copy.id = copy.type + '-' + Date.now().toString(36);
      copy.title = (copy.title || '') + ' (کپی)';
      cfg.slides.splice(i + 1, 0, copy);
      if(cfg.tpl[cfg.slides[i].id]) cfg.tpl[copy.id] = JSON.parse(JSON.stringify(cfg.tpl[cfg.slides[i].id]));
      extra.push('set-' + copy.id);
    }else if(b.dataset.del !== undefined){
      const i = +b.dataset.del;
      if(!confirm(`اسلاید «${cfg.slides[i].title || SLIDE_TYPES[cfg.slides[i].type]}» حذف بشه؟`)) return;
      delete cfg.tpl[cfg.slides[i].id];
      cfg.slides.splice(i, 1);
    }
    saveCfg();
    rerender(extra);
  });

  $('#cfgExport').addEventListener('click', () => {
    download(`${R.id}-slides-template.json`, JSON.stringify({report:R.id, merge:R.merged ? R.def : undefined, cfg}, null, 2), 'application/json');
  });
  $('#cfgImport').addEventListener('click', () => $('#cfgFile').click());
  $('#cfgFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    f.text().then(txt => {
      const j = JSON.parse(txt);
      const c = j.cfg || j;
      if(!Array.isArray(c.slides)) throw new Error('bad');
      S.cfg = Object.assign(defaultCfg(), c);
      saveCfg(); rerender(); toast('قالب و تنظیمات وارد شد');
    }).catch(() => toast('این فایل قالب گزارش نیست'));
  });
  const tc = $('#tplClear');
  if(tc) tc.addEventListener('click', () => {
    if(!confirm('متن‌های ذخیره‌شده تو قالب پاک بشن؟ (اسلایدها و تنظیمات می‌مونن)')) return;
    cfg.tpl = {}; cfg.tplSavedAt = null; saveCfg(); rerender();
  });
  $('#cfgReset').addEventListener('click', () => {
    if(!confirm('همه‌ی تنظیمات و قالب این گزارش (بازه، کمپین‌ها، مدیوم‌ها، اسلایدها، متن‌ها، لوگو) به حالت پیش‌فرض برگرده؟')) return;
    store.del(cfgKey(R)); loadCfg(R); rerender();
  });
}

// ---------- Snapshots: presentation and exports ----------
// A slide as a self-contained node: charts become pictures, nothing is
// editable, the editing-only controls and empty placeholders are gone.
function snapshot(slideEl){
  const clone = slideEl.cloneNode(true);
  const srcCanvases = $$('canvas', slideEl), dstCanvases = $$('canvas', clone);
  dstCanvases.forEach((c, i) => {
    const img = document.createElement('img');
    img.alt = '';
    try{ img.src = srcCanvases[i].toDataURL('image/png'); }catch(e){}
    c.replaceWith(img);
  });
  $$('[contenteditable]', clone).forEach(n => n.removeAttribute('contenteditable'));
  $$('.row-x, .card-grip', clone).forEach(n => n.remove());
  $$('[data-k]', clone).forEach(n => {
    if(!n.textContent.trim() && !n.querySelector('img')) n.classList.add('x-empty');
    n.removeAttribute('data-ph'); n.removeAttribute('data-k');
  });
  $$('[data-logo]', clone).forEach(n => { n.removeAttribute('title'); n.removeAttribute('data-logo'); });
  clone.style.cssText = slideEl.closest('.s-frame').getAttribute('style') || '';
  clone.style.transform = 'none';
  return clone;
}
function deckSnapshots(){
  return $$('#deck .s-frame > .slide').map(snapshot);
}

let presentIdx = 0, presentSlides = [];
function openPresent(i){
  presentSlides = deckSnapshots();
  if(!presentSlides.length) return;
  presentIdx = Math.max(0, i);
  const ov = document.createElement('div');
  ov.id = 'present';
  ov.innerHTML = `<div class="p-stage"></div><div class="p-ctrl">
    <button type="button" class="btn sm" data-p="prev">قبلی</button><span id="pCount"></span>
    <button type="button" class="btn sm" data-p="next">بعدی</button><button type="button" class="btn sm" data-p="close">خروج (Esc)</button></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if(b){ b.dataset.p === 'close' ? closePresent() : stepPresent(b.dataset.p === 'next' ? 1 : -1); return; }
    stepPresent(1);
  });
  if(ov.requestFullscreen) ov.requestFullscreen().catch(()=>{});
  showPresent();
}
function showPresent(){
  const ov = $('#present');
  if(!ov) return;
  const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  const stage = $('.p-stage', ov);
  stage.style.width = 1280 * k + 'px'; stage.style.height = 720 * k + 'px';
  stage.innerHTML = '';
  const sl = presentSlides[presentIdx];
  sl.style.transform = `scale(${k})`;
  stage.appendChild(sl);
  $('#pCount').textContent = `${fa(presentIdx + 1)} / ${fa(presentSlides.length)}`;
}
function stepPresent(dir){
  presentIdx = Math.max(0, Math.min(presentSlides.length - 1, presentIdx + dir));
  showPresent();
}
function closePresent(){
  const ov = $('#present');
  if(!ov) return;
  ov.remove();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
document.addEventListener('keydown', e => {
  if(!$('#present')) return;
  if(e.key === 'Escape') closePresent();
  else if(['ArrowLeft', 'PageDown', ' ', 'Enter'].includes(e.key)){ e.preventDefault(); stepPresent(1); }
  else if(['ArrowRight', 'PageUp', 'Backspace'].includes(e.key)){ e.preventDefault(); stepPresent(-1); }
  else if(e.key === 'Home'){ presentIdx = 0; showPresent(); }
  else if(e.key === 'End'){ presentIdx = presentSlides.length - 1; showPresent(); }
});
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement && $('#present')) closePresent(); });
window.addEventListener('resize', showPresent);

// Export file name, Erfan's pattern: «گزارش کمپین بانکینو - 2 تا 8 آبان» —
// Latin day numbers, Persian month, no year; the month is written once when
// both ends share it.
function fileBase(){
  const w = S.data.win;
  const day = ymd => jalali(ymd, {day:'numeric', month:'long', numberingSystem:'latn'}, 'dml');
  const dayOnly = ymd => jalali(ymd, {day:'numeric', numberingSystem:'latn'}, 'dl');
  const month = ymd => jalali(ymd, {month:'long'}, 'm');
  let range = '';
  if(w) range = w.from === w.to ? day(w.from)
    : month(w.from) === month(w.to) ? `${dayOnly(w.from)} تا ${day(w.to)}` : `${day(w.from)} تا ${day(w.to)}`;
  const name = `گزارش کمپین ${S.report.title}${range ? ' - ' + range : ''}`;
  return name.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function exportPdf(){
  const box = $('#printDeck');
  box.innerHTML = '';
  deckSnapshots().forEach(sl => {
    const page = document.createElement('div');
    page.className = 'p-page';
    page.appendChild(sl);
    box.appendChild(page);
  });
  const title = document.title;
  document.title = fileBase();
  const done = () => { document.title = title; box.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  // Pictures need a moment to decode before the print snapshot is taken.
  Promise.all($$('img', box).map(img => img.decode ? img.decode().catch(()=>{}) : null)).then(() => window.print());
}
function download(name, text, type){
  const blob = new Blob([text], {type: type + ';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportHtml(){
  const R = S.report;
  const frames = deckSnapshots().map(sl => `<div class="x-frame">${sl.outerHTML}</div>`).join('\n');
  const doc = `<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

// ---------- Start ----------
async function init(){
  setStatus('loading', 'در حال آماده‌سازی…');
  try{
    core = await loadCore();
  }catch(e){
    $('#view').innerHTML = `<div class="error-box">${esc(e.message)} — صفحه رو رفرش کن.</div>`;
    setStatus('err', 'خطا');
    return;
  }
  PROJ = core.PROJECTS;
  Chart.defaults.font.family = FONT;
  Chart.defaults.color = '#5E6270';
  // Charts are drawn once (no animation), so the font has to be there first.
  try{ await Promise.all([document.fonts.load('600 15px Vazirmatn'), document.fonts.load('800 15px Vazirmatn')]); }catch(e){}
  await remoteLoad('_|');           // the merged-report list
  window.addEventListener('hashchange', route);
  route();
}
window.dashAuth.ready().then(init);
})();
